<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOG</title>
<meta name="theme-color" content="#1A1D23">
<meta name="description" content="Дневник речевых подходов и самонаблюдений">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg: #F2F7F6;
    --surface: #FFFFFF;
    --surface-2: #E9F2F0;
    --border: #DCE9E6;
    --text: #1E3838;
    --text-muted: #7E9896;
    --accent: #3FA7A0;
    --accent-soft: rgba(63,167,160,0.14);
    --accent-text: #FFFFFF;
    --good: #5FA87F;
    --good-soft: rgba(95,168,127,0.15);
    --warn: #D9695A;
    --warn-soft: rgba(217,105,90,0.14);
    --radius: 18px;
    --radius-sm: 10px;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="dark"]{
    --bg: #15211F;
    --surface: #1C2B29;
    --surface-2: #223634;
    --border: #2C403D;
    --text: #EAF3F1;
    --text-muted: #8FA6A3;
    --accent: #4FBDB6;
    --accent-soft: rgba(79,189,182,0.18);
    --accent-text: #0E2220;
    --good: #7BC79A;
    --good-soft: rgba(123,199,154,0.16);
    --warn: #E08673;
    --warn-soft: rgba(224,134,115,0.16);
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    padding: 26px 20px 0;
  }
  h1,h2,h3{ font-family: var(--serif); font-weight:400; margin:0; }
  .eyebrow{ color: var(--text-muted); font-size: 14px; margin-bottom: 6px; }
  .btn{
    border:none; border-radius: var(--radius-sm);
    padding: 17px 20px; font-size:18px; font-family: var(--sans);
    cursor:pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .08s ease, opacity .15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--accent); color:var(--accent-text); font-weight:600; width:100%; }
  .btn-ghost{ background: transparent; color: var(--text); border:1px solid var(--border); width:100%; }
  .card{
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
  }
  .content{ flex:1; padding-bottom: 24px; }

  /* ---- Top app bar ---- */
  .app-bar{
    position: sticky; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    background: var(--surface); border-bottom:1px solid var(--border);
    padding: 14px 20px; margin: -26px -20px 18px;
  }
  .app-bar-brand{ display:flex; align-items:center; gap:9px; font-family: var(--serif); font-size:19px; font-weight:600; letter-spacing:.05em; color: var(--text); }
  .brand-mark{ display:flex; flex:none; width:32px; height:32px; }
  .brand-mark svg{ display:block; width:100%; height:100%; }
  .brand-text{ line-height:1; }
  .app-bar-right{ display:flex; align-items:center; gap:8px; }
  .streak-pill{
    display:inline-flex; align-items:center; gap:4px;
    background: var(--accent-soft); color: var(--accent); font-weight:600;
    border-radius:999px; padding:6px 12px; font-size:14px; font-family: var(--sans);
    border:none; cursor:pointer; -webkit-tap-highlight-color: transparent;
  }
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-card{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding:22px; max-width:360px; width:100%;
  }
  .modal-title{ font-family: var(--serif); font-size:20px; margin-bottom:10px; }
  .modal-text{ font-size:15px; color: var(--text-muted); line-height:1.5; }
  .gear-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--border);
    background: var(--surface); color: var(--text-muted); font-size:17px;
    display:flex; align-items:center; justify-content:center; padding:0; flex:none;
  }
  .gear-btn.active{ color: var(--accent); border-color: var(--accent); }

  /* ---- Bottom nav ---- */
  .tabbar{
    position: sticky; bottom:0; left:0; right:0;
    display:flex; background: var(--surface);
    border-top:1px solid var(--border);
    padding: 10px 6px calc(10px + env(safe-area-inset-bottom));
    margin: 0 -20px;
  }
  .tab-btn{
    flex:1; background:none; border:none; color: var(--text-muted);
    font-size:12px; padding:6px 4px; display:flex; flex-direction:column;
    align-items:center; gap:4px; font-family: var(--sans);
  }
  .tab-btn .ic{ font-size:19px; }
  .tab-btn.active{ color: var(--accent); }

  /* ---- Home / Practice tab ---- */
  .home-hero{ margin-top: 4px; margin-bottom: 28px; }
  .home-hero h1{ font-size: 34px; line-height:1.25; }
  .today-badge-wrap{ display:flex; justify-content:center; margin: 10px 0 30px; }
  .today-badge{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:176px; height:176px; border-radius:50%;
    background: radial-gradient(circle at 32% 28%, var(--surface) 0%, var(--accent-soft) 72%);
    border:2px solid var(--accent);
    box-shadow: 0 8px 24px -10px var(--accent-soft);
  }
  .today-badge-num{ font-family: var(--serif); font-size:68px; line-height:1; color: var(--accent); }
  .today-badge-lbl{ font-size:13px; color: var(--text-muted); margin-top:8px; text-align:center; letter-spacing:.02em; }

  /* ---- Practice wizard ---- */
  .progress-dots{ display:flex; gap:5px; justify-content:center; flex-wrap:wrap; margin-bottom: 6vh; margin-top: 4px; }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--border); }
  .dot.done{ background: var(--accent); }
  .dot.current{ background: var(--text); }
  .q-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; min-height: 46vh; }
  .q-label{ font-size:26px; font-family: var(--serif); text-align:center; margin-bottom: 8px; }
  .q-hint{ font-size:16px; color: var(--text-muted); text-align:center; margin-bottom: 34px; }
  .scale-value{ font-family: var(--serif); font-size: 64px; text-align:center; margin-bottom: 18px; }
  .scale-slider{ width:100%; -webkit-appearance:none; height:6px; border-radius:3px; background: var(--border); outline:none; }
  .scale-slider::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background: var(--accent); border:3px solid var(--bg); box-shadow:0 0 0 1px var(--accent); }
  .scale-ends{ display:flex; justify-content:space-between; font-size:13px; color: var(--text-muted); margin-top:8px; }
  .choice-row{ display:flex; gap:12px; margin-top: 6px; }
  .choice-btn{ flex:1; padding: 20px; border-radius: var(--radius-sm); border:1px solid var(--border); background: var(--surface); color: var(--text); font-size:18px; transition: background .15s ease, border-color .15s ease, color .15s ease; }
  .choice-btn.selected{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight:600; }
  .choice-list{ display:flex; flex-direction:column; gap:10px; }
  .choice-list-btn{ text-align:left; padding:18px 18px; border-radius: var(--radius-sm); border:1px solid var(--border); background: var(--surface); color: var(--text); font-size:18px; }
  .choice-list-btn.selected{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight:600; }
  textarea, input[type=text], input[type=number], input[type=email], input[type=password], input[type=date]{
    width:100%; max-width:100%; min-width:0; box-sizing:border-box;
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-size:18px; padding:14px 14px; font-family: var(--sans);
  }
  textarea{ min-height: 140px; resize:vertical; line-height:1.45; }
  textarea[id^="jw-text-"]{ min-height: 220px; }
  /* Some mobile browsers reserve extra internal width for the date
     picker's calendar icon beyond the box's own width, which can push
     the control a few pixels past its card. The wrapper alone now owns
     the visible border/background/radius; the input itself is borderless
     and transparent, so there's no second edge of its own that could peek
     out past the wrapper's rounded corner (the earlier overflow:hidden-only
     fix still left the input's own 1px border visibly breaking out of the
     curve in Safari). */
  .date-input-wrap{
    overflow:hidden; border-radius: var(--radius-sm);
    border:1px solid var(--border); background: var(--surface);
  }
  .date-input-wrap input[type=date]{
    display:block; width:100%; border:none; background:transparent;
    border-radius:0; padding-right:8px;
    -webkit-appearance:none; appearance:none;
  }
  input[type=number]{ -moz-appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .nav-row{ display:flex; gap:10px; margin-top: 6vh; padding-bottom: 24px; }
  .nav-row .btn-ghost{ flex: 0 0 84px; }

  /* ---- Top bar (sub-pages) ---- */
  .top-bar{ display:flex; align-items:center; gap:10px; margin-bottom: 18px; }
  .back-btn{ background:none; border:none; color: var(--text-muted); font-size:24px; padding:4px 8px 4px 0; cursor:pointer; }
  .top-bar h2{ font-size:23px; flex:1; }
  .top-bar .save-btn{ background:none; border:none; color: var(--accent); font-size:16px; font-weight:600; padding:4px; }

  /* ---- Segmented control ---- */
  .segment-row, .period-row{ display:flex; gap:8px; margin-bottom: 20px; }
  .segment-btn, .period-btn{ flex:1; padding:10px; border-radius: 999px; border:1px solid var(--border); background:transparent; color: var(--text-muted); font-size:15px; }
  .segment-btn.active, .period-btn.active{ background: var(--accent); color:var(--accent-text); border-color: var(--accent); font-weight:600; }

  /* ---- Journal ---- */
  .journal-today-card{ margin-bottom: 20px; }
  .journal-today-card .date{ color: var(--text-muted); font-size:14px; margin-bottom:6px; }
  .journal-today-card .mood{ font-family: var(--serif); font-size:24px; margin-bottom: 10px; }
  .journal-list-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 16px; background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-sm); margin-bottom:10px;
  }
  .journal-list-row .jd{ font-size:17px; max-width: 78%; }
  .journal-list-row .jd > div:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .journal-list-row .jd .date{ color: var(--text-muted); font-size:13px; }
  .journal-list-row .flags{ display:flex; gap:6px; }
  .flag-dot{ width:8px; height:8px; border-radius:50%; }
  .flag-good{ background: var(--good); }
  .flag-off{ background: var(--border); }
  .empty{ text-align:center; color: var(--text-muted); padding: 40px 10px; font-size:16px; }

  .read-hero{ text-align:center; margin: 14px 0 34px; }
  .read-hero-emoji{ font-size:64px; line-height:1; margin-bottom:12px; }
  .read-hero-mood{ font-family: var(--serif); font-size:26px; }
  .read-row{ display:flex; gap:16px; padding:19px 2px; border-bottom:1px solid var(--border); align-items:flex-start; }
  .read-row:last-child{ border-bottom:none; }
  .read-icon{ font-size:30px; line-height:1.4; width:36px; text-align:center; flex-shrink:0; }
  .read-label{ font-size:14px; color: var(--text-muted); margin-bottom:5px; font-weight:600; }
  .read-text{ font-size:18px; line-height:1.6; }
  .read-big{ font-family: var(--serif); font-size:30px; }
  .read-sub{ font-size:14px; color: var(--text-muted); margin-top:3px; }

  .section-block{ margin-bottom: 26px; }
  .section-head{ display:flex; align-items:baseline; gap:10px; margin-bottom: 12px; }
  .section-num{ font-family: var(--serif); color: var(--accent); font-size:14px; }
  .section-title{ font-family: var(--serif); font-size:20px; }
  .journal-card{ margin-bottom: 16px; }
  .jc-title{ font-family: var(--serif); font-size:19px; margin-bottom: 14px; }
  .autosave-hint{ font-size:13px; color: var(--text-muted); margin: -6px 0 18px; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .field{ margin-bottom: 12px; }
  .field-label{ font-size:14px; color: var(--text-muted); margin-bottom:6px; }
  .bool-row{ display:flex; gap:10px; }
  .bool-chip{ flex:1; padding:14px; border-radius: var(--radius-sm); border:1px solid var(--border); background: var(--surface); color: var(--text-muted); font-size:16px; }
  .bool-chip.selected-yes{ background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight:600; }
  .bool-chip.selected-no{ background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight:600; }

  /* ---- Progress ---- */
  .metric-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom: 22px; }
  .metric-tile{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-sm); padding:16px; }
  .metric-tile .num{ font-family: var(--serif); font-size: 30px; }
  .metric-tile .lbl{ font-size:14px; color: var(--text-muted); margin-top:4px; }
  .metric-tile.good .num{ color: var(--good); }
  .metric-tile .lbl .delta{ display:block; margin-top:3px; font-size:11px; }
  .delta-good{ color: var(--good); }
  .delta-bad{ color: var(--warn); }
  .trend-wrap{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-sm); padding:14px 12px 10px; margin-top:16px; }
  .trend-svg{ width:100%; height:120px; display:block; }
  .trend-legend{ display:flex; justify-content:space-between; font-size:12px; color: var(--text-muted); margin-top:6px; flex-wrap:wrap; gap:8px; }
  .trend-empty{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-sm); padding:24px 12px; margin-top:16px; text-align:center; color: var(--text-muted); font-size:13px; }
  .report-actions{ margin-top:20px; display:flex; flex-direction:column; gap:10px; }
  .report-row{ display:flex; gap:8px; align-items:stretch; flex-wrap:wrap; }
  .report-row .btn-primary{ flex:1 1 140px; }
  .report-row .btn-ghost{ width:auto; flex:0 0 auto; padding-left:14px; padding-right:14px; white-space:nowrap; }
  .delta-flat{ color: var(--text-muted); }
  .chart-card{ margin-bottom: 20px; }
  .chart-card h3{ font-size:15px; margin-bottom: 10px; color: var(--text-muted); font-family: var(--sans); }
  canvas.chart{ width:100%; height:150px; display:block; }
  .history-row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; gap:10px; }
  .history-row:last-child{ border-bottom:none; }
  .history-row .d{ color: var(--text-muted); white-space:nowrap; }
  .history-row .m{ text-align:right; }
  .digest-item{ padding: 14px 0; border-bottom:1px solid var(--border); }
  .digest-item:last-child{ border-bottom:none; }
  .digest-item .dd{ font-size:12px; color: var(--text-muted); margin-bottom:4px; }
  .digest-item .dl{ font-size:11px; color: var(--accent); margin-bottom:2px; }
  .digest-item .dt{ font-size:14px; }
  .note-card{ padding:14px 18px; font-size:14px; color: var(--text-muted); margin-bottom:18px; }
  .note-card b{ color: var(--text); font-weight:600; }

  /* ---- Calendar ---- */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-weekdays{ margin-bottom:6px; }
  .cal-weekday{ font-size:11px; color: var(--text-muted); text-align:center; padding-bottom:2px; }
  .cal-cell{ position:relative; aspect-ratio:1; border-radius:12px; background: var(--surface); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding-top:2px; }
  .cal-cell.empty{ background:transparent; border:none; }
  .cal-cell.today{ border-color: var(--accent); border-width:2px; }
  .cal-day-num{ font-size:15px; font-family: var(--serif); color: var(--text); line-height:1; }
  .cal-emojis{ display:flex; gap:2px; min-height:14px; align-items:center; font-size:12px; line-height:1; }
  .cal-count{ font-size:9px; color: var(--accent); font-weight:600; line-height:1; min-height:10px; }
  .cal-arrow{ position:absolute; top:3px; right:4px; font-size:10px; line-height:1; }
  .cal-arrow.up{ color: var(--good); }
  .cal-arrow.down{ color: var(--warn); }
  .cal-legend{ display:flex; flex-wrap:wrap; justify-content:center; gap:14px 18px; margin-top:14px; font-size:12px; color: var(--text-muted); align-items:center; text-align:center; width:100%; }
  .cal-legend span{ display:inline-flex; align-items:center; gap:5px; }

  /* ---- Exercises ---- */
  .exercise-cat-list{ display:flex; flex-direction:column; gap:12px; }
  .exercise-cat-card{
    display:flex; align-items:center; gap:14px; text-align:left;
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding:18px; font-family: var(--sans); color: var(--text); cursor:pointer;
  }
  .exercise-cat-icon{ font-size:28px; flex-shrink:0; width:40px; text-align:center; }
  .exercise-cat-body{ flex:1; min-width:0; }
  .exercise-cat-label{ font-family: var(--serif); font-size:19px; }
  .exercise-cat-sub{ font-size:13px; color: var(--text-muted); margin-top:3px; }
  .exercise-cat-count{ font-size:16px; color: var(--text-muted); flex-shrink:0; }

  .exercise-list{ display:flex; flex-direction:column; gap:10px; }
  .exercise-row{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-sm); padding:4px 14px; }
  .exercise-row-top{ display:flex; align-items:center; gap:12px; min-height:52px; }
  .exercise-name{ flex:1; text-align:left; background:none; border:none; color: var(--text); font-size:16px; font-family: var(--sans); padding:10px 0; }
  .exercise-chevron{ color: var(--text-muted); font-size:11px; flex-shrink:0; }
  .exercise-detail{ padding:0 0 16px; font-size:14px; line-height:1.55; color: var(--text); }
  .exercise-note{ margin-top:8px; color: var(--text-muted); font-size:13px; font-style:italic; }
</style>

<div id="app"></div>

<script>
const SUPABASE_URL = 'https://zvstrubroelqaivgtooc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cnIPiLyx12CBRvx175QrhQ_kKQgW6Eh';

// Everything the person types (journal text, custom answers, notes) ends up
// back in the page via innerHTML — this neutralizes it as plain text before
// it's inserted, so typed-in HTML/script can never run (stored XSS).
function esc(str){
  if(str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ---------- lazy-load jsPDF ----------
   Only the two "скачать PDF" buttons actually need jsPDF — "копировать
   картинкой" works off plain canvas and never touches it. Loading the
   ~280KB library eagerly on every page open (even for people who never
   export a PDF) slowed down first paint for no reason, so it's now
   fetched on demand, once, the first time it's actually needed. */
let jsPDFLoadPromise = null;
function ensureJsPDF(){
  if(window.jspdf) return Promise.resolve(true);
  if(jsPDFLoadPromise) return jsPDFLoadPromise;
  jsPDFLoadPromise = new Promise((resolve)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = ()=> resolve(!!window.jspdf);
    s.onerror = ()=> resolve(false);
    document.head.appendChild(s);
  });
  return jsPDFLoadPromise;
}

/* ---------- auth (Supabase email/password) ---------- */
const auth = { accessToken: null, refreshToken: null, userId: null, email: null, expiresAt: 0 };

function sbHeaders(extra){
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + (auth.accessToken || SUPABASE_KEY),
    'Content-Type': 'application/json',
    ...(extra || {}),
  };
}
function loadSession(){
  try{
    const raw = localStorage.getItem('arlilia_session');
    if(!raw) return;
    const s = JSON.parse(raw);
    auth.accessToken = s.access_token; auth.refreshToken = s.refresh_token;
    auth.userId = s.user_id; auth.email = s.email; auth.expiresAt = s.expires_at;
  }catch(e){}
}
function setSession(data){
  auth.accessToken = data.access_token;
  auth.refreshToken = data.refresh_token;
  if(data.user){ auth.userId = data.user.id; auth.email = data.user.email; }
  auth.expiresAt = Date.now() + (data.expires_in || 3600) * 1000;
  try{
    localStorage.setItem('arlilia_session', JSON.stringify({
      access_token: auth.accessToken, refresh_token: auth.refreshToken,
      user_id: auth.userId, email: auth.email, expires_at: auth.expiresAt,
    }));
  }catch(e){}
}
function clearSession(){
  auth.accessToken = null; auth.refreshToken = null; auth.userId = null; auth.email = null; auth.expiresAt = 0;
  try{ localStorage.removeItem('arlilia_session'); }catch(e){}
}
// Returns 'ok' (refreshed), 'invalid' (Supabase explicitly rejected the
// refresh token — it's genuinely expired/revoked, session really is gone),
// or 'network' (couldn't even reach the server — a connectivity blip, not
// a reason to log anyone out).
async function refreshSession(){
  if(!auth.refreshToken) return 'invalid';
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: auth.refreshToken }),
    });
    if(res.ok){
      const data = await res.json();
      setSession(data);
      return 'ok';
    }
    return (res.status === 400 || res.status === 401) ? 'invalid' : 'network';
  }catch(e){ return 'network'; }
}
// Proactively renews the access token a few minutes before it expires, so
// the app rarely has to rely on the reactive 401-then-refresh path below —
// fewer round trips at exactly the moment the person wants to see data.
async function ensureFreshToken(){
  if(!auth.accessToken || !auth.refreshToken) return;
  if(auth.expiresAt - Date.now() > 5 * 60 * 1000) return;
  await refreshSession();
}
async function sbFetch(url, options){
  options = options || {};
  options.headers = sbHeaders(options.headers);
  let res = await fetch(url, options);
  if(res.status === 401 && auth.refreshToken){
    const status = await refreshSession();
    if(status === 'ok'){
      options.headers = sbHeaders(options.headers);
      res = await fetch(url, options);
    } else if(status === 'invalid'){
      auth.sessionInvalid = true;
    }
    // status === 'network': leave the original 401 as-is and keep the
    // session — a dropped connection isn't proof the login expired.
  }
  return res;
}
function translateAuthError(data, fallback){
  const raw = (data && (data.error_description || data.msg || data.error_code || data.error)) || '';
  const text = String(raw);
  const waitMatch = text.match(/after (\d+) seconds?/i);
  if(waitMatch) return `Слишком много попыток подряд — подождите ${waitMatch[1]} сек. и повторите.`;
  if(/already registered|user_already_exists/i.test(text)) return 'Этот email уже зарегистрирован — попробуйте войти.';
  if(/invalid login credentials/i.test(text)) return 'Неверный email или пароль.';
  if(/email not confirmed/i.test(text)) return 'Email ещё не подтверждён — проверьте почту (или попросите админа отключить подтверждение в Supabase).';
  if(/password.*at least|should be at least/i.test(text)) return 'Пароль слишком короткий — минимум 6 символов.';
  if(/invalid.*email|unable to validate email/i.test(text)) return 'Проверьте формат email.';
  if(/signup.*disabled|signups? not allowed/i.test(text)) return 'Регистрация сейчас отключена в настройках Supabase.';
  if(/network|failed to fetch/i.test(text)) return 'Нет соединения с сервером.';
  return text || fallback;
}
async function login(email, password){
  state.loginBusy = true; state.loginError = null; state.loginNotice = null; render();
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if(!res.ok){
      state.loginError = translateAuthError(data, 'Неверный email или пароль');
      state.loginBusy = false; render();
      return;
    }
    setSession(data);
    state.loggedIn = true;
    state.loginBusy = false;
    await loadAll();
    render();
  }catch(e){
    state.loginError = 'Нет соединения с сервером';
    state.loginBusy = false; render();
  }
}
async function signUp(email, password){
  state.loginBusy = true; state.loginError = null; render();
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if(!res.ok){
      state.loginError = translateAuthError(data, 'Не удалось создать профиль');
      state.loginBusy = false; render();
      return;
    }
    // Profile created — do NOT log the person in automatically. They
    // explicitly asked for registration and login to be separate steps.
    state.loginBusy = false;
    state.authMode = 'login';
    state.loginError = null;
    state.loginNotice = data.access_token
      ? 'Профиль создан! Теперь войдите с вашим email и паролем.'
      : 'Профиль создан! Проверьте почту и подтвердите email, затем войдите.';
    render();
  }catch(e){
    state.loginError = 'Нет соединения с сервером';
    state.loginBusy = false; render();
  }
}
function logout(){
  clearSession();
  state.loggedIn = false;
  state.loaded = false;
  state.entries = []; state.journalEntries = [];
  render();
}

async function resetAllData(){
  if(!auth.userId) return;
  state.resetBusy = true; render();
  try{
    await sbFetch(`${SUPABASE_URL}/rest/v1/attempts?user_id=eq.${auth.userId}`, { method:'DELETE' });
    await sbFetch(`${SUPABASE_URL}/rest/v1/journal_entries?user_id=eq.${auth.userId}`, { method:'DELETE' });
    await saveStartDate(null);
    state.entries = [];
    state.journalEntries = [];
    state.confirmReset = false;
    state.resetBusy = false;
    showToast('Все данные сброшены — можно начинать заново');
    render();
  }catch(e){
    console.error(e);
    state.resetBusy = false;
    showToast('Не удалось сбросить данные — проверьте соединение');
    render();
  }
}

async function loadAll(){
  auth.sessionInvalid = false;
  state.loadOffline = false;
  await ensureFreshToken();
  try{
    const res = await sbFetch(`${SUPABASE_URL}/rest/v1/attempts?select=*&order=created_at.asc`);
    if(res.status === 401){
      if(auth.sessionInvalid) return false; // Supabase really did reject the session
      state.loadOffline = true; return true; // just a connectivity blip — stay logged in
    }
    const rows = await res.json();
    state.entries = Array.isArray(rows) ? rows.map(rowToAttempt) : [];
  }catch(e){ console.error(e); state.loadOffline = true; }
  try{
    const res2 = await sbFetch(`${SUPABASE_URL}/rest/v1/journal_entries?select=*&order=entry_date.asc`);
    const rows2 = await res2.json();
    state.journalEntries = Array.isArray(rows2) ? rows2.map(rowToJournal) : [];
  }catch(e){ console.error(e); }
  try{
    const res3 = await sbFetch(`${SUPABASE_URL}/rest/v1/app_settings?select=*&limit=1`);
    const rows3 = await res3.json();
    if(Array.isArray(rows3) && rows3[0]){
      state.settings.startDate = rows3[0].start_date || null;
    }
  }catch(e){ console.error(e); }
  try{
    const savedTheme = localStorage.getItem('arlilia_theme');
    if(savedTheme) state.settings.theme = savedTheme;
  }catch(e){}
  applyTheme();
  state.loaded = true;
  return true;
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.settings.theme === 'dark' ? 'dark' : 'light');
}

async function saveStartDate(dateStr){
  state.settings.startDate = dateStr || null;
  try{
    const res = await sbFetch(`${SUPABASE_URL}/rest/v1/app_settings?on_conflict=user_id`, {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' },
      body: JSON.stringify([{ user_id: auth.userId, start_date: dateStr || null }]),

async function insertAttempt(answers){
  try{
    const res = await sbFetch(`${SUPABASE_URL}/rest/v1/attempts`, {
      method: 'POST',
      headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify(attemptToRow(answers)),

    if(!res.ok){
      const errText = await res.text();
      console.error('insertAttempt failed', res.status, errText);
      showToast('Не сохранилось: ' + res.status + ' ' + errText.slice(0,80));
      return null;
    }
    const rows = await res.json();
    if(Array.isArray(rows) && rows[0]) return rowToAttempt(rows[0]);

  }catch(err){
    console.error(err);
    showToast('Нет соединения с сервером — подход не сохранён');

async function persistJournal(){
  const draft = state.journalDraft;
  if(!draft || !draft.entryDate) return;
  try{
    const res = await sbFetch(`${SUPABASE_URL}/rest/v1/journal_entries?on_conflict=entry_date,user_id`, {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' },
      body: JSON.stringify([journalDraftToRow(draft)]),
    });
    if(!res.ok){
      const errText = await res.text();
      console.error('persistJournal failed', res.status, errText);
      showToast('Дневник не сохранился: ' + res.status);
      return;
    }
    const rows = await res.json();
    if(Array.isArray(rows) && rows[0]){
      const updated = rowToJournal(rows[0]);
      const idx = state.journalEntries.findIndex(j => j.entryDate === updated.entryDate);
      if(idx >= 0) state.journalEntries[idx] = updated; else state.journalEntries.push(updated);
      if(state.journalDraft && state.journalDraft.entryDate === updated.entryDate){
        state.journalDraft = updated;
        state.journalEditId = updated.entryDate;
      }
    }
  }catch(e){ console.error(e); showToast('Нет соединения — дневник не сохранён'); }
}

function isJournalEntryEmpty(entry){
  return !JOURNAL_STEPS.some(f => {
    const v = entry[f.id];
    if(v !== undefined && v !== null && v !== '') return true;
    // number_note fields (e.g. "Сон") can be filled in with only the text
    // note and no number — that still counts as content.
    if(f.type === 'number_note'){
      const note = entry[f.id + 'Note'];
      if(note !== undefined && note !== null && note !== '') return true;
    }
    return false;
  });
}

/* ---------- helpers ---------- */
function fmtNum(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return (Math.round(n*10)/10).toString().replace('.', ',');
}
function startOfDay(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
// Local calendar date as YYYY-MM-DD. Deliberately NOT toISOString() (which is
// UTC): for timezones ahead of UTC (e.g. Moscow, UTC+3), toISOString() still
// reports "yesterday" for roughly the first 3 hours after local midnight,
// while everything else in the app (the calendar grid, dateLabel, etc.)
// already shows the new local day — so an attempt logged just after midnight
// would silently fail to count as "today" and could land under the wrong
// calendar day. Building the key from local getFullYear/getMonth/getDate
// keeps every "which day is this" check on the same (local) calendar.
function localDateKey(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayKey(){ return localDateKey(new Date()); }
function dateKey(ts){ return localDateKey(new Date(ts)); }
function dateLabel(ts){ return new Date(ts).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'}); }
function timeLabel(ts){ return new Date(ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); }
function weekdayDateLabel(ts){ return new Date(ts).toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'}); }

function avg(arr, key){
  const vals = arr.map(e=>e[key]).filter(v=>typeof v === 'number' && !isNaN(v));
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function capitalize(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

/* ---------- calendar helpers ---------- */
function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function firstWeekdayMonIndex(d){
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  return (first.getDay() + 6) % 7; // Monday = 0
}
function attemptsInMonth(monthDate){
  return state.entries.filter(e=>{
    const d = new Date(e.ts);
    return d.getFullYear()===monthDate.getFullYear() && d.getMonth()===monthDate.getMonth();
  }).sort((a,b)=>a.ts-b.ts);
}
function journalEntriesInMonth(monthDate){
  return state.journalEntries.filter(e=>{
    if(isJournalEntryEmpty(e)) return false;
    const d = new Date(e.ts);
    return d.getFullYear()===monthDate.getFullYear() && d.getMonth()===monthDate.getMonth();
  }).sort((a,b)=>a.ts-b.ts);
}
function attemptsOnDate(dateStr){
  return state.entries.filter(e=> dateKey(e.ts) === dateStr).sort((a,b)=>a.ts-b.ts);
}
function journalEntryOnDate(dateStr){
  return state.journalEntries.find(e=> dateKey(e.ts) === dateStr && !isJournalEntryEmpty(e)) || null;
}
function attemptsCountByDay(monthDate){
  const map = {};
  attemptsInMonth(monthDate).forEach(e=>{
    const day = new Date(e.ts).getDate();
    map[day] = (map[day]||0) + 1;
  });
  return map;
}
function journalDaysInMonth(monthDate){
  const set = new Set();
  journalEntriesInMonth(monthDate).forEach(e=> set.add(new Date(e.ts).getDate()));
  return set;
}
function daysSinceStart(){
  if(!state.settings.startDate) return null;
  const start = new Date(state.settings.startDate + 'T00:00:00');
  const diff = Math.floor((startOfDay(Date.now()) - start.getTime()) / 86400000);
  return diff + 1;
}
function dayNumberForTs(ts){
  if(!state.settings.startDate) return null;
  const start = new Date(state.settings.startDate + 'T00:00:00');
  const diff = Math.floor((startOfDay(ts) - start.getTime()) / 86400000);
  return diff + 1;
}

/* ---------- all-time aggregates (Progress tab headline tiles) ---------- */
function totalAttemptsCount(){ return state.entries.length; }
function todayAttemptsCount(){
  const k = todayKey();
  return state.entries.filter(e=> dateKey(e.ts) === k).length;
}
function allTimeJournalDayKeys(){
  const set = new Set();
  state.journalEntries.forEach(e=>{ if(!isJournalEntryEmpty(e)) set.add(dateKey(e.ts)); });
  return set;
}
function allTimeAttemptDayKeys(){
  const set = new Set();
  state.entries.forEach(e=> set.add(dateKey(e.ts)));
  return set;
}
function allTimeFullDaysCount(){
  const journalSet = allTimeJournalDayKeys();
  const attemptSet = allTimeAttemptDayKeys();
  let n = 0;
  journalSet.forEach(k=>{ if(attemptSet.has(k)) n++; });
  return n;
}

/* ---------- current streak (consecutive complete days, i.e. a day with
   both an attempt and a journal entry) and milestone levels — a day still
   in progress (today) doesn't break the streak, only a day that's fully
   over and was missed does. ---------- */
function currentStreak(){
  const attemptSet = allTimeAttemptDayKeys();
  const journalSet = allTimeJournalDayKeys();
  const isComplete = (key)=> attemptSet.has(key) && journalSet.has(key);
  let streak = 0;
  const cur = new Date(); cur.setHours(0,0,0,0);
  if(!isComplete(dateKey(cur.getTime()))) cur.setDate(cur.getDate() - 1);
  while(isComplete(dateKey(cur.getTime()))){
    streak++;
    cur.setDate(cur.getDate() - 1);
  }
  return streak;
}
const STREAK_MILESTONES = [3, 7, 14, 21, 30, 45, 60, 90, 120, 180, 365];
function nextStreakMilestone(streak){
  return STREAK_MILESTONES.find(m => m > streak) ?? null;
}
function ruDays(n){
  const n10 = n % 10, n100 = n % 100;
  if(n100 >= 11 && n100 <= 14) return 'дней';
  if(n10 === 1) return 'день';
  if(n10 >= 2 && n10 <= 4) return 'дня';
  return 'дней';
}

/* ---------- running total (+1 complete / -1 missed) from the start date up
   to, but not including, a given moment — used so the month trend chart
   carries its balance over from previous months instead of resetting to 0
   on the 1st of every month. ---------- */
function cumulativeBefore(dateTs){
  if(!state.settings.startDate) return 0;
  const start = new Date(state.settings.startDate + 'T00:00:00');
  start.setHours(0,0,0,0);
  const end = new Date(dateTs);
  end.setHours(0,0,0,0);
  if(end <= start) return 0;
  const attemptSet = allTimeAttemptDayKeys();
  const journalSet = allTimeJournalDayKeys();
  let cum = 0;
  const cur = new Date(start);
  while(cur < end){
    const k = dateKey(cur.getTime());
    cum += (attemptSet.has(k) && journalSet.has(k)) ? 1 : -1;
    cur.setDate(cur.getDate() + 1);
  }
  return cum;
}

/* ---------- month trend (up/down "stock chart" of completed days) ---------- */
function buildMonthTrend(monthDate){
  const total = daysInMonth(monthDate);
  const attemptsByDay = attemptsCountByDay(monthDate);
  const journalDays = journalDaysInMonth(monthDate);
  const today = new Date();
  const isCurMonth = today.getFullYear()===monthDate.getFullYear() && today.getMonth()===monthDate.getMonth();
  const isFutureMonth = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1) > new Date(today.getFullYear(), today.getMonth(), 1);
  const lastDay = isFutureMonth ? 0 : (isCurMonth ? today.getDate() : total);

  // Don't count any day before the chosen start date — those were never
  // meant to be tracked, so they shouldn't pull the trend down.
  let firstDay = 1;
  if(state.settings.startDate){
    const start = new Date(state.settings.startDate + 'T00:00:00');
    if(start.getFullYear() === monthDate.getFullYear() && start.getMonth() === monthDate.getMonth()){
      firstDay = start.getDate();
    } else if(start.getFullYear() > monthDate.getFullYear() ||
      (start.getFullYear() === monthDate.getFullYear() && start.getMonth() > monthDate.getMonth())){
      firstDay = total + 1; // start date is still in a later month — nothing to plot yet
    }
  }

  // Carry the running total over from every earlier day since the start
  // date (including previous months) instead of starting each month back
  // at 0 — the graph is one continuous streak, viewed a month at a time.
  const baseline = cumulativeBefore(new Date(monthDate.getFullYear(), monthDate.getMonth(), firstDay).getTime());

  const points = [{ day: firstDay - 1, val: baseline, complete: null }];
  let cum = baseline;
  for(let day=firstDay; day<=lastDay; day++){
    const complete = (attemptsByDay[day]||0) > 0 && journalDays.has(day);
    cum += complete ? 1 : -1;
    points.push({ day, val: cum, complete });
  }
  return points;
}

/* ---------- render root ---------- */
function render(){
  const app = document.getElementById('app');
  if(!state.loggedIn){
    app.innerHTML = renderLogin();
    attachHandlers();
    return;
  }
  if(!state.loaded){ app.innerHTML = ''; return; }

  if(state.practiceActive){
    app.innerHTML = renderPracticeWizard();
  } else if(state.journalFormActive){
    app.innerHTML = renderJournalWizardStep();
  } else if(state.journalView === 'read' && state.journalReadEntry){
    app.innerHTML = renderJournalRead(state.journalReadEntry);
  } else {
    let body = '';
    if(state.tab === 'practice') body = renderPracticeHome();
    else if(state.tab === 'journal') body = renderJournalHome();
    else if(state.tab === 'exercises') body = state.exerciseCategory ? renderExerciseCategory(state.exerciseCategory) : renderExercisesHome();
    else if(state.tab === 'progress') body = renderProgress();
    else body = renderSettings();
    app.innerHTML = `${renderAppBar()}<div class="content">${body}</div>${renderTabbar()}`;
  }
  attachHandlers();
}

    `).join('')}</div>`;

    // Any stored value that isn't one of the preset options is treated as a
    // previously-typed custom answer (mirrors the practice wizard's

  } else if(q.type === 'number_note'){
    const noteKey = q.id + 'Note';

function renderCalendar(monthDate){
  const total = daysInMonth(monthDate);
  const offset = firstWeekdayMonIndex(monthDate);
  const countsByDay = attemptsCountByDay(monthDate);
  const journalDays = journalDaysInMonth(monthDate);
  const today = new Date();
  const todayStart = startOfDay(Date.now());
  const startDate = state.settings.startDate ? startOfDay(new Date(state.settings.startDate + 'T00:00:00').getTime()) : null;
  const isCurMonth = today.getFullYear()===monthDate.getFullYear() && today.getMonth()===monthDate.getMonth();
  const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  let cells = '';
  for(let i=0;i<offset;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=total; day++){
    const count = countsByDay[day] || 0;
    const hasJournal = journalDays.has(day);
    const cellDate = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
    const isToday = isCurMonth && today.getDate() === day;
    // A day before the chosen start date was never meant to be tracked —
    // don't mark it as a missed day, only days from the start date onward.
    const isAfterStart = startDate === null || cellDate.getTime() >= startDate;
    const isPastOrToday = cellDate.getTime() <= todayStart && isAfterStart;
    const complete = count > 0 && hasJournal;
    let arrow = '';
    if(isPastOrToday) arrow = complete
      ? `<span class="cal-arrow up">↑</span>`
      : `<span class="cal-arrow down">↓</span>`;
    cells += `<div class="cal-cell${isToday?' today':''}">
      ${arrow}
      <div class="cal-day-num">${day}</div>
      <div class="cal-emojis">
        ${hasJournal ? `<span>📓</span>` : ''}
        ${count ? `<span>🚶</span>` : ''}
      </div>
      <div class="cal-count">${count ? '×'+count : ''}</div>
    </div>`;
  }

  return `
    <div class="cal-grid cal-weekdays">${weekdays.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <span>📓 дневник</span>
      <span>🚶 подход</span>
      <span>×N — подходов за день</span>
      <span style="color:var(--good);">↑ день выполнен</span>
      <span style="color:var(--warn);">↓ день пропущен</span>
    </div>
  `;
}

function renderTrendChart(monthDate){
  const points = buildMonthTrend(monthDate);
  if(points.length <= 1){
    return `<div class="trend-empty">В этом месяце пока нет данных для графика</div>`;
  }
  const W = 600, H = 150, padX = 10, padY = 18;
  const maxAbs = Math.max(2, ...points.map(p=>Math.abs(p.val)));
  const lastDay = points[points.length-1].day;
  const xFor = day => padX + (day / Math.max(1,lastDay)) * (W - padX*2);
  const yFor = val => H/2 - (val / maxAbs) * (H/2 - padY);

  let segments = '';
  for(let i=1;i<points.length;i++){
    const a = points[i-1], b = points[i];
    const color = b.complete ? 'var(--good)' : 'var(--warn)';
    segments += `<line x1="${xFor(a.day).toFixed(1)}" y1="${yFor(a.val).toFixed(1)}" x2="${xFor(b.day).toFixed(1)}" y2="${yFor(b.val).toFixed(1)}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`;
  }
  const last = points[points.length-1];
  const lastColor = last.val > 0 ? 'var(--good)' : (last.val < 0 ? 'var(--warn)' : 'var(--text-muted)');

  return `
    <div class="trend-wrap">
      <svg viewBox="0 0 ${W} ${H}" class="trend-svg" preserveAspectRatio="none">
        <line x1="${padX}" y1="${(H/2).toFixed(1)}" x2="${W-padX}" y2="${(H/2).toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4"/>
        ${segments}
        <circle cx="${xFor(last.day).toFixed(1)}" cy="${yFor(last.val).toFixed(1)}" r="4.5" fill="${lastColor}"/>
      </svg>
      <div class="trend-legend">
        <span style="color:var(--good);">↑ день выполнен</span>
        <span style="color:var(--warn);">↓ день пропущен</span>
        <span style="color:${lastColor}; font-weight:600;">сейчас: ${last.val > 0 ? '+' : ''}${last.val}</span>
      </div>
    </div>
  `;
}

/* ---------- events ---------- */
function attachHandlers(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-action]').forEach(el=> el.addEventListener('click', onAction));
  const streakModalCard = app.querySelector('.modal-card');
  if(streakModalCard) streakModalCard.addEventListener('click', e=> e.stopPropagation());
  app.querySelectorAll('[data-tab]').forEach(el=> el.addEventListener('click', e=>{
    const next = e.currentTarget.getAttribute('data-tab');
    state.tab = next;
    if(next !== 'settings') state.lastTab = next;
    render();
  }));
  app.querySelectorAll('.scale-slider').forEach(el=>{
    el.addEventListener('input', (e)=>{
      const id = e.target.id.replace('slider-','');
      state.answers[id] = parseInt(e.target.value,10);
      const valEl = e.target.parentElement.querySelector('.scale-value');
      if(valEl) valEl.textContent = e.target.value;
    });
  });
  app.querySelectorAll('[data-bool-id]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const id = e.currentTarget.getAttribute('data-bool-id');
      const manual = e.currentTarget.getAttribute('data-manual') === '1';
      state.answers[id] = e.currentTarget.getAttribute('data-bool-val') === 'true';

      if(manual) return;
      const targetIndex = state.qIndex;
      setTimeout(()=>{
        if(state.qIndex === targetIndex && state.qIndex < QUESTIONS.length - 1){
          state.qIndex++;
          render();
        }
      }, 260);
    });
  });
  app.querySelectorAll('[data-choice-id]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const id = e.currentTarget.getAttribute('data-choice-id');
      const val = e.currentTarget.getAttribute('data-choice-val');
      state.answers[id] = val;
      render();
      if(val === 'other') return;
      const targetIndex = state.qIndex;
      setTimeout(()=>{
        if(state.qIndex === targetIndex && state.qIndex < QUESTIONS.length - 1){
          state.qIndex++;
          render();
        }
      }, 260);
    });
  });
  app.querySelectorAll('[data-note-toggle]').forEach(el=>{
    el.addEventListener('click', (e)=>{

    });

  app.querySelectorAll('[data-jw-note-toggle]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const id = e.currentTarget.getAttribute('data-jw-note-toggle');
      state.journalNoteOpen = state.journalNoteOpen || {};
      state.journalNoteOpen[id] = !state.journalNoteOpen[id];
      render();
    });
  });
  app.querySelectorAll('textarea[id^="note-"]').forEach(el=>{

    });
  });
  app.querySelectorAll('[data-jw-bool]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const id = e.currentTarget.getAttribute('data-jw-bool');
      state.journalDraft[id] = e.currentTarget.getAttribute('data-jw-val') === 'true';

      render();
      const targetIndex = state.journalStepIndex;
      setTimeout(()=>{
        if(state.journalStepIndex === targetIndex && state.journalStepIndex < JOURNAL_STEPS.length - 1){

          render();

    });
  });
  app.querySelectorAll('[data-jw-choice]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const id = e.currentTarget.getAttribute('data-jw-choice');
      const val = e.currentTarget.getAttribute('data-jw-val');
      state.journalDraft[id] = val;
      scheduleJournalSave();

      // Picking "Другое" opens a text field right below — don't auto-advance

      const targetIndex = state.journalStepIndex;
      setTimeout(()=>{

function doLoginFromForm(){
  if(state.loginBusy) return;
  const email = (document.getElementById('login-email')||{}).value || '';
  const password = (document.getElementById('login-password')||{}).value || '';
  if(!email.trim() || !password){
    state.loginError = 'Введите email и пароль';
    render();
    return;
  }
  login(email.trim(), password);
}

function doSignupFromForm(){
  if(state.loginBusy) return;
  const email = (document.getElementById('login-email')||{}).value || '';
  const password = (document.getElementById('login-password')||{}).value || '';
  const password2 = (document.getElementById('login-password2')||{}).value || '';
  if(!email.trim() || !password){
    state.loginError = 'Введите email и пароль';
    render();
    return;
  }
  if(password.length < 6){
    state.loginError = 'Пароль должен быть не короче 6 символов';
    render();
    return;
  }
  if(password !== password2){
    state.loginError = 'Пароли не совпадают';
    render();
    return;
  }
  signUp(email.trim(), password);
}

function doAuthFromForm(){
  if(state.authMode === 'signup') doSignupFromForm();
  else doLoginFromForm();
}

async function onAction(e){
  const action = e.currentTarget.getAttribute('data-action');

  if(action === 'toggle-streak-info'){
    state.streakInfoOpen = true; render(); return;
  } else if(action === 'close-streak-info'){
    state.streakInfoOpen = false; render(); return;
  } else if(action === 'toggle-settings'){
    if(state.tab === 'settings'){
      state.tab = state.lastTab || 'practice';
    } else {
      state.lastTab = state.tab;
      state.tab = 'settings';
    }
    render();
    return;
  } else if(action === 'confirm-start-date'){
    const input = document.getElementById('settings-start-date');
    const val = input ? input.value : '';
    state.startDateSaving = true; render();
    await saveStartDate(val || null);
    state.startDateSaving = false;
    showToast(val ? 'Дата начала сохранена' : 'Дата начала очищена');
    render();
    return;
  } else if(action === 'reset-start-date'){
    state.startDateSaving = true; render();
    await saveStartDate(null);
    state.startDateSaving = false;
    showToast('Дата начала сброшена');
    render();
    return;
  } else if(action === 'do-login'){
    doLoginFromForm(); return;
  } else if(action === 'do-signup'){
    doSignupFromForm(); return;
  } else if(action === 'auth-mode-login'){
    state.authMode = 'login'; state.loginError = null; state.loginNotice = null; render(); return;
  } else if(action === 'auth-mode-signup'){
    state.authMode = 'signup'; state.loginError = null; state.loginNotice = null; render(); return;
  } else if(action === 'logout'){
    logout(); return;
  } else if(action === 'ask-reset-data'){
    state.confirmReset = true; render(); return;
  } else if(action === 'cancel-reset-data'){
    state.confirmReset = false; render(); return;
  } else if(action === 'confirm-reset-data'){
    resetAllData(); return;
  } else if(action === 'start-practice'){
    state.practiceActive = true; state.qIndex = 0; state.answers = {}; state.noteOpen = {};
    QUESTIONS.forEach(q => { if(q.type==='scale' || q.type==='scale_note') state.answers[q.id] = 5; });
  } else if(action === 'cancel-practice'){
    state.practiceActive = false;
  } else if(action === 'prev-question'){
    state.qIndex = Math.max(0, state.qIndex - 1);
  } else if(action === 'next-question'){
    state.qIndex = Math.min(QUESTIONS.length - 1, state.qIndex + 1);
  } else if(action === 'save-practice'){
    state.practiceActive = false;
    render();
    const saved = await insertAttempt(state.answers);
    if(saved) state.entries.push(saved);
    render();
    return;

  } else if(action === 'new-journal'){
    let entry = findTodayJournal();
    if(!entry){
      const entryDate = todayKey();
      entry = { entryDate, ts: new Date(entryDate + 'T12:00:00').getTime() };
      state.journalEntries.push(entry);
    }
    state.journalDraft = entry;
    state.journalEditId = entry.entryDate;
    state.journalStepIndex = 0;
    state.journalFormActive = true;
  } else if(action === 'view-old-journal'){
    const jid = parseInt(e.currentTarget.getAttribute('data-jid'),10);
    const existing = state.journalEntries.find(j=>j.ts === jid);
    if(!existing) return;
    state.journalReadEntry = existing;
    state.journalView = 'read';
  } else if(action === 'journal-read-back'){
    state.journalReadEntry = null;
    state.journalView = 'history';
  } else if(action === 'show-journal-history'){
    state.journalView = 'history';
  } else if(action === 'journal-history-back'){
    state.journalView = 'home';
  } else if(action === 'journal-prev-step'){
    state.journalStepIndex = Math.max(0, state.journalStepIndex - 1);
  } else if(action === 'journal-next-step'){
    state.journalStepIndex = Math.min(JOURNAL_STEPS.length - 1, state.journalStepIndex + 1);
  } else if(action === 'done-journal'){
    clearTimeout(journalSaveTimer);
    const draft = state.journalDraft;
    state.journalFormActive = false;
    state.journalStepIndex = 0;
    state.journalView = 'home';
    render();
    if(draft && draft.entryDate){
      if(isJournalEntryEmpty(draft)){
        if(state.journalEditId) await deleteJournalEntry(draft.entryDate);
        else state.journalEntries = state.journalEntries.filter(j => j.entryDate !== draft.entryDate);
      } else {
        await persistJournal();
      }
    }
    render();
    return;

  } else if(action === 'export-attempts-pdf'){
    generateAttemptsPdf(); return;
  } else if(action === 'export-journal-pdf'){
    generateJournalPdf(); return;
  } else if(action === 'copy-attempts-image'){
    copyAttemptsImage(); return;
  } else if(action === 'copy-journal-image'){
    copyJournalImage(); return;
  } else if(action === 'progress-prev-month'){
    const d = new Date(state.progressMonth); d.setMonth(d.getMonth()-1); state.progressMonth = d;
  } else if(action === 'progress-next-month'){
    const d = new Date(state.progressMonth); d.setMonth(d.getMonth()+1); state.progressMonth = d;
  } else if(action === 'theme-light'){
    setTheme('light'); return;
  } else if(action === 'theme-dark'){
    setTheme('dark'); return;
  } else if(action === 'open-exercise-category'){
    state.exerciseCategory = e.currentTarget.getAttribute('data-cat');
  } else if(action === 'exercises-back'){
    state.exerciseCategory = null;
  } else if(action === 'toggle-exercise-expand'){
    const id = e.currentTarget.getAttribute('data-exid');
    state.exerciseExpanded[id] = !state.exerciseExpanded[id];
  }
  render();
}

function showToast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1E3838;color:#F2F7F6;padding:11px 20px;border-radius:999px;font-size:14px;z-index:999;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .2s ease;font-family:-apple-system,sans-serif;max-width:88vw;text-align:center;';
  document.body.appendChild(t);
  requestAnimationFrame(()=>{ t.style.opacity = '1'; });
  setTimeout(()=>{
    t.style.opacity = '0';
    setTimeout(()=> t.remove(), 250);
  }, 2600);
}

/* ---------- PDF / image reports ----------
   jsPDF's built-in fonts don't cover Cyrillic, so every page is drawn on an
   off-screen canvas first (the browser's own font renderer handles Cyrillic
   fine) and then embedded into the PDF as an image (or copied straight to
   the clipboard as a PNG for pasting into Telegram etc). This keeps text
   crisp and sidesteps font-embedding entirely. */
const REPORT_FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';
const REPORT_SERIF = 'Georgia, "Times New Roman", serif';
const RC = { // report colors — mirrors the app's teal palette
  bg: '#FFFFFF', band: '#3FA7A0', bandText: '#FFFFFF',
  text: '#1E3838', muted: '#5C7977', border: '#DCE9E6',
  stripe: '#EFF6F5', headBg: '#E9F2F0', accent: '#2E8B85',
  good: '#3E8A61', warn: '#C14F3F'
};

// "2026-10-03" -> "03.10.2026" — for PDF filenames.
function ruFileDate(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}.${mm}.${d.getFullYear()}`;
}

// Portrait page (journal: Q&A table)
const PDF_P_W = 1060, PDF_P_H = 1500, PDF_P_MARGIN = 64;
// Landscape page (attempts: wide multi-column table)
const PDF_L_W = 1500, PDF_L_H = 1060, PDF_L_MARGIN = 56;

function newReportPage(pages, w, h){
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = RC.bg; ctx.fillRect(0,0,w,h);
  pages.push(canvas);
  return { canvas, ctx, y: 0, w, h };
}
function wrapLines(ctx, text, maxWidth){
  const words = String(text).split(' ');
  const lines = []; let line = '';
  words.forEach(w=>{
    // A single "word" with no spaces to break on — a long URL, or just a
    // run of the same character — would otherwise sail straight past the
    // column/page edge instead of wrapping. Hard-break it to fit.
    while(ctx.measureText(w).width > maxWidth){
      let i = 1;
      while(i < w.length && ctx.measureText(w.slice(0, i + 1)).width <= maxWidth) i++;
      if(line){ lines.push(line); line = ''; }
      lines.push(w.slice(0, i));
      w = w.slice(i);
    }
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  });
  if(line) lines.push(line);
  return lines.length ? lines : [''];
}
function drawReportHeader(ctx, w, margin, title, subtitle){
  let y = margin + 4;
  ctx.fillStyle = RC.accent; ctx.font = '36px ' + REPORT_SERIF;
  ctx.fillText(title, margin, y + 28); y += 46;
  ctx.fillStyle = RC.muted; ctx.font = '19px ' + REPORT_FONT;
  ctx.fillText(subtitle, margin, y + 14); y += 32;
  ctx.strokeStyle = RC.accent; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(margin, y + 14); ctx.lineTo(w - margin, y + 14); ctx.stroke();
  return y + 40;
}
function savePdfFromPages(pages, filename, landscape){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4', orientation: landscape ? 'landscape' : 'portrait' });
  const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
  pages.forEach((pg,i)=>{
    if(i>0) doc.addPage();
    doc.addImage(pg.toDataURL('image/png'), 'PNG', 0, 0, pw, ph);
  });
  doc.save(filename);
}
// Stacks every report page into one tall image so "Копировать" always
// carries the whole day, not just page 1 — a day with enough attempts (or
// a long journal entry) to spill onto a second PDF page used to get
// silently cut off when only the first page's canvas was copied.
// Each source page is a fixed-size A4-shaped canvas (for real pagination
// in the PDF), but most pages only use the top portion of it — stacking
// them as-is left a huge blank void wherever a page's unused bottom
// margin ended up. `bottoms[i]` is how far page i's content actually
// reaches, so each page is cropped to that before stacking, with a
// dashed rule between pages marking where one page ended and the next
// began (so it still reads as separate pages, not one continuous sheet).
function mergeCanvasesVertically(pages, bottoms){
  if(pages.length === 1 && !(bottoms && bottoms[0] < pages[0].height - 40)) return pages[0];
  const width = pages[0].width;
  const pad = 24;
  const heights = pages.map((p,i)=> Math.min(p.height, Math.ceil((bottoms && bottoms[i] ? bottoms[i] : p.height) + pad)));
  const dividerGap = 34;
  const totalHeight = heights.reduce((sum,h)=> sum + h, 0) + dividerGap * (pages.length - 1);
  const merged = document.createElement('canvas');
  merged.width = width; merged.height = totalHeight;
  const ctx = merged.getContext('2d');
  ctx.fillStyle = RC.bg; ctx.fillRect(0, 0, width, totalHeight);
  let y = 0;
  pages.forEach((p, i)=>{
    const h = heights[i];
    ctx.drawImage(p, 0, 0, width, h, 0, y, width, h);
    y += h;
    if(i < pages.length - 1){
      const dy = y + dividerGap / 2;
      ctx.strokeStyle = RC.border; ctx.lineWidth = 1.5;
      ctx.setLineDash([7, 7]);
      ctx.beginPath(); ctx.moveTo(40, dy); ctx.lineTo(width - 40, dy); ctx.stroke();
      ctx.setLineDash([]);
      y += dividerGap;
    }
  });
  return merged;
}
function copyCanvasImage(canvas, extraCount){
  if(!(navigator.clipboard && window.ClipboardItem)){
    downloadCanvasFallback(canvas);
    return;
  }
  // iOS Safari (and some other mobile browsers) only allow writing to the
  // clipboard while the call still carries the original tap's "user
  // activation" — any await/async hop before calling clipboard.write()
  // and it silently refuses. So the write() call itself must happen
  // synchronously, right here, even though the PNG isn't ready yet; we
  // hand it a Promise<Blob> as the MIME value, which both Safari and
  // Chrome explicitly support resolving after the fact.
  const blobPromise = new Promise((resolve, reject)=>{
    canvas.toBlob(blob=>{ blob ? resolve(blob) : reject(new Error('toBlob failed')); }, 'image/png');
  });
  navigator.clipboard.write([ new ClipboardItem({ 'image/png': blobPromise }) ])
    .then(()=> showToast(extraCount > 0
      ? `Скопировано! (ещё ${extraCount} стр. — скачайте PDF, если нужны все)`
      : 'Скопировано в буфер обмена'))
    .catch(()=> downloadCanvasFallback(canvas));
}
function downloadCanvasFallback(canvas){
  const dataUrl = canvas.toDataURL('image/png');
  // iOS Safari ignores the <a download> attribute entirely and would just
  // navigate the current tab to the raw image — losing the app's state in
  // the process. Opening it in a new tab instead is recoverable there: the
  // person can long-press the image to copy/save it, and the app tab stays
  // untouched. Browsers that DO support <a download> (desktop/Android
  // Chrome, Firefox) get a real file download instead.
  const isLikelyIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if(isLikelyIOS){
    const win = window.open();
    if(win){
      win.document.write(`<title>Дневник подходов</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="${dataUrl}" style="max-width:100%;height:auto;" alt="Отчёт"></body>`);
      showToast('Откройте новую вкладку и удержите картинку, чтобы скопировать или сохранить');
      return;
    }
  }
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'otchet-' + todayKey() + '.png';
  document.body.appendChild(a); a.click(); a.remove();
  showToast('Браузер не поддерживает копирование — картинка скачана');
}

/* ---- Attempts: wide multi-column table, landscape, one day at a time ---- */
const ATT_COLS = [
  { id:'num',      label:'№',          w:40  },
  { id:'title',    label:'Тип',        w:170 },
  { id:'mindset',  label:'Настрой',    w:160 },
  { id:'reaction', label:'Реакция',    w:230 },
  { id:'voice',    label:'Речь',       w:170, note:'voiceNote'   },
  { id:'hand',     label:'Рука',       w:170, note:'handNote'    },
  { id:'anxiety',  label:'Волнение',   w:180, note:'anxietyNote' },
  { id:'ritual',   label:'Ритуал',     w:156, note:'ritualNote' },
];
function attColX(){
  const gap = 16; let x = PDF_L_MARGIN; const map = {};
  ATT_COLS.forEach(c=>{ map[c.id] = x; x += c.w + gap; });
  return map;
}
function buildAttemptsPages(){
  const dateStr = state.reportDate || todayKey();
  const entries = attemptsOnDate(dateStr);
  if(!entries.length) return null;
  const dayLabel = capitalize(weekdayDateLabel(new Date(dateStr + 'T12:00:00').getTime()));
  const colX = attColX();
  const tableRight = PDF_L_W - PDF_L_MARGIN;

  // "На улице — 2 · Звонок — 1" — counts grouped by the attempt's type,
  // in the order each type first appears.
  const typeCounts = [];
  entries.forEach(e=>{
    const t = e.title || 'Без типа';
    const row = typeCounts.find(r=>r[0]===t);
    if(row) row[1]++; else typeCounts.push([t, 1]);
  });
  const summaryLine = typeCounts.map(([t,n])=> `${t} — ${n}`).join('   ·   ');

  // "Речь: 0 — сбивался, 10 — чисто" etc — explains what the 0–10 scores
  // in the Речь/Рука/Волнение columns mean, pulled straight from the same
  // lowLabel/highLabel shown in the practice wizard so it can't drift out
  // of sync with the actual questions.
  const scaleLegend = ['voice','hand','anxiety'].map(id=>{
    const q = QUESTIONS.find(qq=>qq.id===id);
    return q ? `${q.label}: 0 — ${q.lowLabel}, 10 — ${q.highLabel}` : null;
  }).filter(Boolean).join('   ·   ');

  const pages = [];
  const pageBottoms = []; // actual content height reached on each page — lets
                           // the clipboard-copy merge crop away each page's
                           // unused bottom margin instead of stacking dead space.
  let { ctx, y } = newReportPage(pages, PDF_L_W, PDF_L_H);
  y = drawReportHeader(ctx, PDF_L_W, PDF_L_MARGIN, 'Таблица осознанности', dayLabel + ' · всего подходов: ' + entries.length);

  if(scaleLegend){
    ctx.fillStyle = RC.muted; ctx.font = 'italic 16px ' + REPORT_FONT;
    const legendLines = wrapLines(ctx, scaleLegend, tableRight - PDF_L_MARGIN);
    legendLines.forEach((l,li)=> ctx.fillText(l, PDF_L_MARGIN, y + li*22));
    y += legendLines.length * 22 + 12;
  }

  if(summaryLine){
    ctx.fillStyle = RC.muted; ctx.font = '17px ' + REPORT_FONT;
    const sumLines = wrapLines(ctx, summaryLine, tableRight - PDF_L_MARGIN);
    sumLines.forEach((l,li)=> ctx.fillText(l, PDF_L_MARGIN, y + li*23));
    y += sumLines.length * 23 + 16;
  }

  function drawTableHeader(){
    ctx.fillStyle = RC.headBg;
    ctx.fillRect(PDF_L_MARGIN - 10, y - 22, tableRight - PDF_L_MARGIN + 20, 40);
    ctx.fillStyle = RC.accent; ctx.font = 'bold 17px ' + REPORT_FONT;
    ATT_COLS.forEach(c=> ctx.fillText(c.label, colX[c.id], y));
    y += 32;
  }
  drawTableHeader();

  entries.forEach((e,i)=>{
    const rowVals = {
      num: String(i+1),
      title: e.title || '—',
      mindset: e.mindsetBefore || '—',
      reaction: e.reactionAfter || '—',
      voice: fmtNum(e.voice),
      hand: fmtNum(e.hand),
      anxiety: fmtNum(e.anxiety),
      ritual: e.ritual===true?'Соблюдал':e.ritual===false?'Не соблюдал':'—',
    };
    const lineH = 24, noteLineH = 18, noteGap = 7;
    ctx.font = '17px ' + REPORT_FONT;
    const wrapped = {};
    const noteWrapped = {};
    let maxColH = 0;
    ATT_COLS.forEach(c=>{
      const lines = wrapLines(ctx, rowVals[c.id], c.w);
      wrapped[c.id] = lines;
      let colH = lines.length * lineH;
      // A score's comment (e.g. "рука — подробно: ...") is printed as small
      // italic text directly under that same score, in its own column —
      // not bundled into one block under the whole row.
      if(c.note && e[c.note]){
        ctx.font = 'italic 14px ' + REPORT_FONT;
        const nLines = wrapLines(ctx, e[c.note], c.w);
        noteWrapped[c.id] = nLines;
        ctx.font = '17px ' + REPORT_FONT;
        colH += noteGap + nLines.length * noteLineH;
      }
      if(colH > maxColH) maxColH = colH;
    });
    const rowH = Math.max(42, maxColH + 16);

    if(y + rowH > PDF_L_H - 54){
      // Continuation page: just keep the table going — no repeated title/
      // date/legend, only the column header row so columns stay labelled.
      pageBottoms.push(y + 10); // outgoing page's actual content ends here
      ({ ctx, y } = newReportPage(pages, PDF_L_W, PDF_L_H));
      y = PDF_L_MARGIN + 28;
      drawTableHeader();
    }

    if(i % 2 === 1){
      ctx.fillStyle = RC.stripe;
      ctx.fillRect(PDF_L_MARGIN - 10, y - 18, tableRight - PDF_L_MARGIN + 20, rowH);
    }
    ATT_COLS.forEach(c=>{
      ctx.fillStyle = RC.text; ctx.font = '17px ' + REPORT_FONT;
      wrapped[c.id].forEach((line, li)=> ctx.fillText(line, colX[c.id], y + li*lineH));
      if(noteWrapped[c.id]){
        ctx.fillStyle = RC.muted; ctx.font = 'italic 14px ' + REPORT_FONT;
        const startY = y + wrapped[c.id].length * lineH + 3;
        noteWrapped[c.id].forEach((line, li)=> ctx.fillText(line, colX[c.id], startY + li*noteLineH));
      }
    });
    y += rowH;

    ctx.strokeStyle = RC.border; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PDF_L_MARGIN - 10, y); ctx.lineTo(tableRight + 10, y); ctx.stroke();
    y += 22;
  });
  pageBottoms.push(y + 10);

  return { pages, pageBottoms, filename: 'Таблица осознанности ' + ruFileDate(dateStr) + '.pdf' };
}
async function generateAttemptsPdf(){
  const built = buildAttemptsPages();
  if(!built){ showToast('За этот день нет записанных подходов'); return; }
  if(!window.jspdf) showToast('Готовим PDF…');
  const ok = await ensureJsPDF();
  if(!ok){ showToast('Не удалось загрузить модуль PDF — проверьте интернет-соединение'); return; }
  savePdfFromPages(built.pages, built.filename, true);
}
function copyAttemptsImage(){
  const built = buildAttemptsPages();
  if(!built){ showToast('За этот день нет записанных подходов'); return; }
  copyCanvasImage(mergeCanvasesVertically(built.pages, built.pageBottoms), 0);
}

/* ---- Journal: one question-and-answer card per field, portrait, one day ----
   Each field is its own visually separated card — accent label line on top,
   the answer below in larger text, a tinted background and a coloured left
   bar — so it reads at a glance which answer belongs to which question
   (plain alternating table rows made that hard to tell apart). */
function buildJournalPages(){
  const dateStr = state.reportDate || todayKey();
  const entry = journalEntryOnDate(dateStr);
  if(!entry) return null;

  const fieldLabels = [
    ['mood','Самочувствие'], ['glad','Радует'], ['worry','Волнует'],
    ['dailyRoutine','Саморегуляция'], ['sleepHours','Сон, ч'],
    ['difficulties','Трудная тетрадь'], ['questions','Вопросы'], ['reflections','Откровения'],
    ['tricks','Уловки'], ['praise','Похвала'], ['intentions','Речевые планы'],
  ];
  const tableLeft = PDF_P_MARGIN - 10, tableRight = PDF_P_W - PDF_P_MARGIN + 10;
  const textX = PDF_P_MARGIN + 14;
  const valueW = tableRight - textX - 14;

  const ts = new Date(dateStr + 'T12:00:00').getTime();
  const dn = dayNumberForTs(ts);
  const weekdayLabel = capitalize(weekdayDateLabel(ts));
  const headerSubtitle = dn ? `День ${dn} · ${weekdayLabel}` : weekdayLabel;

  const pages = [];
  const pageBottoms = []; // see buildAttemptsPages — same purpose
  let { ctx, y } = newReportPage(pages, PDF_P_W, PDF_P_H);
  y = drawReportHeader(ctx, PDF_P_W, PDF_P_MARGIN, 'Дневник дня', headerSubtitle);

  let idx = 0;
  fieldLabels.forEach(([id,lbl])=>{
    let val = entry[id];
    if(id === 'sleepHours'){
      if(val != null) val = fmtNum(val);
      const note = entry.sleepHoursNote;
      if(val != null && note) val = val + ' — ' + note;
      else if(note) val = note; // text note only, no number entered
    }
    if(val === null || val === undefined || val === '') return;

    ctx.font = '17px ' + REPORT_FONT;
    const valLines = wrapLines(ctx, String(val), valueW);
    const padTop = 16, padBottom = 18, labelH = 24, lineH = 24;
    const cardH = padTop + labelH + valLines.length * lineH + padBottom;

    if(y + cardH > PDF_P_H - 70){
      // Continuation page: just keep the cards going, no repeated title/date.
      pageBottoms.push(y);
      ({ ctx, y } = newReportPage(pages, PDF_P_W, PDF_P_H));
      y = PDF_P_MARGIN + 24;
    }

    ctx.fillStyle = idx % 2 === 1 ? RC.stripe : RC.bg;
    ctx.fillRect(tableLeft, y, tableRight - tableLeft, cardH);
    ctx.fillStyle = RC.accent;
    ctx.fillRect(tableLeft, y, 4, cardH);

    let ty = y + padTop + 14;
    ctx.fillStyle = RC.accent; ctx.font = 'bold 15px ' + REPORT_FONT;
    ctx.fillText(lbl.toUpperCase(), textX, ty);
    ty += labelH;
    ctx.fillStyle = RC.text; ctx.font = '17px ' + REPORT_FONT;
    valLines.forEach((l,li)=> ctx.fillText(l, textX, ty + li*lineH));

    y += cardH + 10;
    idx++;
  });
  pageBottoms.push(y);

  return { pages, pageBottoms, filename: 'Дневник ' + ruFileDate(dateStr) + '.pdf' };
}
async function generateJournalPdf(){
  const built = buildJournalPages();
  if(!built){ showToast('За этот день нет записи дневника'); return; }
  if(!window.jspdf) showToast('Готовим PDF…');
  const ok = await ensureJsPDF();
  if(!ok){ showToast('Не удалось загрузить модуль PDF — проверьте интернет-соединение'); return; }
  savePdfFromPages(built.pages, built.filename, false);
}
function copyJournalImage(){
  const built = buildJournalPages();
  if(!built){ showToast('За этот день нет записи дневника'); return; }
  copyCanvasImage(mergeCanvasesVertically(built.pages, built.pageBottoms), 0);
}

async function boot(){
  loadSession();
  try{
    const savedTheme = localStorage.getItem('arlilia_theme');
    if(savedTheme) state.settings.theme = savedTheme;
  }catch(e){}
  applyTheme();
  if(!auth.accessToken){
    state.loggedIn = false;
    render();
    return;
  }
  state.loggedIn = true;
  render();
  const ok = await loadAll();
  if(ok === false){
    clearSession();
    state.loggedIn = false;
  } else if(state.loadOffline){
    showToast('Нет соединения — показаны сохранённые данные');
  }
  render();
}
boot();

// Register the service worker (app shell caching) only once the app is up
// and running, so it never competes with real data loads for bandwidth.
// Fails silently when sw.js isn't served next to this page (e.g. a local
// file opened directly) — the app works identically either way.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
