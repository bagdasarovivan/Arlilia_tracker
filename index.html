  } else if(action === 'toggle-pw-form'){
    state.pwOpen = !state.pwOpen;
  } else if(action === 'save-password'){
    changePassword(); return;
  } else if(action === 'remind-on'){
    lsSet('arlilia_remind', { on: true, hour: getRemind().hour });
  } else if(action === 'remind-off'){
    lsSet('arlilia_remind', { on: false, hour: getRemind().hour });
  } else if(action === 'remind-hour'){
    lsSet('arlilia_remind', { on: true, hour: parseInt(e.currentTarget.getAttribute('data-hour'), 10) || 19 });
  } else if(action === 'set-report-view'){
    state.reportView = e.currentTarget.getAttribute('data-view') === 'cards' ? 'cards' : 'table';
    lsSet('arlilia_report_view', state.reportView);
  } else if(action === 'export-attempts-pdf'){
    generateAttemptsPdf(); return;
  } else if(action === 'export-journal-pdf'){
    generateJournalPdf(); return;
  } else if(action === 'copy-attempts-image'){
    copyAttemptsImage(); return;
  } else if(action === 'copy-journal-image'){
    copyJournalImage(); return;
  } else if(action === 'progress-prev-month'){
    const d = new Date(state.progressMonth); d.setMonth(d.getMonth()-1); state.progressMonth = d;
  } else if(action === 'progress-next-month'){
    const d = new Date(state.progressMonth); d.setMonth(d.getMonth()+1); state.progressMonth = d;
  } else if(action === 'theme-light'){
    setTheme('light'); return;
  } else if(action === 'theme-dark'){
    setTheme('dark'); return;
  } else if(action === 'open-exercise-category'){
    state.exerciseCategory = e.currentTarget.getAttribute('data-cat');
  } else if(action === 'exercises-back'){
    state.exerciseCategory = null;
  } else if(action === 'toggle-exercise-expand'){
    const id = e.currentTarget.getAttribute('data-exid');
    state.exerciseExpanded[id] = !state.exerciseExpanded[id];
  }
  render();
}

/* ---------- toast ---------- */
function showToast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1E3838;color:#F2F7F6;padding:11px 20px;border-radius:999px;font-size:14px;z-index:999;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .2s ease;font-family:-apple-system,sans-serif;max-width:88vw;text-align:center;';
  document.body.appendChild(t);
  requestAnimationFrame(()=>{ t.style.opacity = '1'; });
  setTimeout(()=>{
    t.style.opacity = '0';
    setTimeout(()=> t.remove(), 250);
  }, Math.min(9000, 2600 + String(msg).length * 45));
}

/* ---------- PDF / image reports ----------
   jsPDF's built-in fonts don't cover Cyrillic, so every page is drawn on an
   off-screen canvas first (the browser's own font renderer handles Cyrillic
   fine) and then embedded into the PDF as an image (or copied straight to
   the clipboard as a PNG for pasting into Telegram etc). This keeps text
   crisp and sidesteps font-embedding entirely. */
const REPORT_FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';
const REPORT_SERIF = 'Georgia, "Times New Roman", serif';
const RC = { // report colors — mirrors the app's teal palette
  bg: '#FFFFFF', band: '#3FA7A0', bandText: '#FFFFFF',
  text: '#1E3838', muted: '#5C7977', border: '#DCE9E6',
  stripe: '#EFF6F5', headBg: '#E9F2F0', accent: '#2E8B85',
  good: '#3E8A61', warn: '#C14F3F'
};

// "2026-10-03" -> "03.10.2026" — for PDF filenames.
function ruFileDate(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}.${mm}.${d.getFullYear()}`;
}

// Portrait page (journal: Q&A table)
// Journal report: a narrow, single tall page (phone-width) with large text, so a
// viewer that fits the page to the screen width shows it readable without panning.
const PDF_P_W = 720, PDF_P_H = 14000, PDF_P_MARGIN = 36;
// Landscape page (attempts: wide multi-column table)
const PDF_L_W = 1800, PDF_L_H = 1272, PDF_L_MARGIN = 56;

function newReportPage(pages, w, h){
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = RC.bg; ctx.fillRect(0,0,w,h);
  pages.push(canvas);
  return { canvas, ctx, y: 0, w, h };
}
function wrapLines(ctx, text, maxWidth){
  const words = String(text).split(' ');
  const lines = []; let line = '';
  words.forEach(w=>{
    // A single "word" with no spaces to break on — a long URL, or just a
    // run of the same character — would otherwise sail straight past the
    // column/page edge instead of wrapping. Hard-break it to fit.
    while(ctx.measureText(w).width > maxWidth){
      let i = 1;
      while(i < w.length && ctx.measureText(w.slice(0, i + 1)).width <= maxWidth) i++;
      if(line){ lines.push(line); line = ''; }
      lines.push(w.slice(0, i));
      w = w.slice(i);
    }
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  });
  if(line) lines.push(line);
  return lines.length ? lines : [''];
}
function drawReportHeader(ctx, w, margin, title, subtitle){
  let y = margin + 4;
  ctx.fillStyle = RC.accent; ctx.font = '36px ' + REPORT_SERIF;
  ctx.fillText(title, margin, y + 28); y += 46;
  ctx.fillStyle = RC.muted; ctx.font = '19px ' + REPORT_FONT;
  ctx.fillText(subtitle, margin, y + 14); y += 32;
  ctx.strokeStyle = RC.accent; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(margin, y + 14); ctx.lineTo(w - margin, y + 14); ctx.stroke();
  return y + 40;
}
function savePdfFromPages(pages, filename, landscape, fitPage){
  const { jsPDF } = window.jspdf;
  // fitPage: page size follows the canvas (phone-width, any height) instead of A4.
  const k = 0.5;
  const doc = fitPage
    ? new jsPDF({ unit:'pt', format:[pages[0].width*k, pages[0].height*k], orientation:'portrait', compress:true })
    : new jsPDF({ unit:'pt', format:'a4', orientation: landscape ? 'landscape' : 'portrait' });
  const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
  pages.forEach((pg,i)=>{
    if(i>0) fitPage ? doc.addPage([pg.width*k, pg.height*k]) : doc.addPage();
    const w2 = fitPage ? pg.width*k : pw, h2 = fitPage ? pg.height*k : ph;
    doc.addImage(pg.toDataURL('image/png'), 'PNG', 0, 0, w2, h2);
  });
  doc.save(filename);
}
// Stacks every report page into one tall image so "Копировать" always
// carries the whole day, not just page 1 — a day with enough attempts (or
// a long journal entry) to spill onto a second PDF page used to get
// silently cut off when only the first page's canvas was copied.
// Each source page is a fixed-size A4-shaped canvas (for real pagination
// in the PDF), but most pages only use the top portion of it — stacking
// them as-is left a huge blank void wherever a page's unused bottom
// margin ended up. `bottoms[i]` is how far page i's content actually
// reaches, so each page is cropped to that before stacking, with a
// dashed rule between pages marking where one page ended and the next
// began (so it still reads as separate pages, not one continuous sheet).
function mergeCanvasesVertically(pages, bottoms, contTop){
  if(pages.length === 1 && !(bottoms && bottoms[0] < pages[0].height - 40)) return pages[0];
  const width = pages[0].width;
  const pad = 14;
  const dividerGap = 28;
  // Continuation pages start with an empty top margin — cut it off, so the gap
  // between "pages" in the merged image is only the dashed divider's breathing room.
  const srcTops = pages.map((p,i)=> i > 0 && contTop ? Math.max(0, contTop - pad) : 0);
  const srcBottoms = pages.map((p,i)=> Math.min(p.height, Math.ceil((bottoms && bottoms[i] ? bottoms[i] : p.height) + pad)));
  const heights = pages.map((p,i)=> srcBottoms[i] - srcTops[i]);
  const totalHeight = heights.reduce((sum,h)=> sum + h, 0) + dividerGap * (pages.length - 1);
  const merged = document.createElement('canvas');
  merged.width = width; merged.height = totalHeight;
  const ctx = merged.getContext('2d');
  ctx.fillStyle = RC.bg; ctx.fillRect(0, 0, width, totalHeight);
  let y = 0;
  pages.forEach((p, i)=>{
    const h = heights[i];
    ctx.drawImage(p, 0, srcTops[i], width, h, 0, y, width, h);
    y += h;
    if(i < pages.length - 1){
      const dy = y + dividerGap / 2;
      ctx.strokeStyle = RC.border; ctx.lineWidth = 1.5;
      ctx.setLineDash([7, 7]);
      ctx.beginPath(); ctx.moveTo(40, dy); ctx.lineTo(width - 40, dy); ctx.stroke();
      ctx.setLineDash([]);
      y += dividerGap;
    }
  });
  return merged;
}
function copyCanvasImage(canvas, extraCount){
  if(!(navigator.clipboard && window.ClipboardItem)){
    downloadCanvasFallback(canvas);
    return;
  }
  // iOS Safari (and some other mobile browsers) only allow writing to the
  // clipboard while the call still carries the original tap's "user
  // activation" — any await/async hop before calling clipboard.write()
  // and it silently refuses. So the write() call itself must happen
  // synchronously, right here, even though the PNG isn't ready yet; we
  // hand it a Promise<Blob> as the MIME value, which both Safari and
  // Chrome explicitly support resolving after the fact.
  const blobPromise = new Promise((resolve, reject)=>{
    canvas.toBlob(blob=>{ blob ? resolve(blob) : reject(new Error('toBlob failed')); }, 'image/png');
  });
  navigator.clipboard.write([ new ClipboardItem({ 'image/png': blobPromise }) ])
    .then(()=> showToast(extraCount > 0
      ? `Скопировано! (ещё ${extraCount} стр. — скачайте PDF, если нужны все)`
      : 'Скопировано в буфер обмена'))
    .catch(()=> downloadCanvasFallback(canvas));
}
function downloadCanvasFallback(canvas){
  const dataUrl = canvas.toDataURL('image/png');
  // iOS Safari ignores the <a download> attribute entirely and would just
  // navigate the current tab to the raw image — losing the app's state in
  // the process. Opening it in a new tab instead is recoverable there: the
  // person can long-press the image to copy/save it, and the app tab stays
  // untouched. Browsers that DO support <a download> (desktop/Android
  // Chrome, Firefox) get a real file download instead.
  const isLikelyIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if(isLikelyIOS){
    const win = window.open();
    if(win){
      win.document.write(`<title>Дневник подходов</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="${dataUrl}" style="max-width:100%;height:auto;" alt="Отчёт"></body>`);
      showToast('Откройте новую вкладку и удержите картинку, чтобы скопировать или сохранить');
      return;
    }
  }
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'otchet-' + todayKey() + '.png';
  document.body.appendChild(a); a.click(); a.remove();
  showToast('Браузер не поддерживает копирование — картинка скачана');
}

/* ---- Attempts: wide multi-column table, landscape, one day at a time ---- */
const ATT_COLS = [
  { id:'num',      label:'№',                   w:36  },
  { id:'title',    label:'Название ФТ',         w:140 },
  { id:'mindset',  label:'Мой настрой',         w:204 },
  { id:'reaction', label:'Реакция собеседника', w:205 },
  { id:'ritual',   label:'Ритуал речи',         w:190 },
  { id:'start',    label:'Начало речи',         w:145 },
  { id:'method',   label:'Речь по методике',    w:170 },
  { id:'voice',    label:'Голос',               w:150 },
  { id:'anxiety',  label:'Волнение',            w:118 },
  { id:'hard',     label:'Что было трудно',     w:173 },
];
// Короткий текст для ячейки таблицы: что отмечено из списка.
function ftCell(e, k){
  const ft = e.ft;
  if(!ft) return null;
  if(ft.silent && FT_SPEECH_KEYS.includes(k)) return '—';
  const L = FT_LISTS[k], sel = ft[k] || [];
  if(!sel.length) return '—';
  if(L.items.every(it=>sel.includes(it.id))) return L.allShort;
  return L.items.filter(it=>sel.includes(it.id)).map(it=>it.s).join(', ');
}
function ftHardText(e){
  const ft = e.ft;
  if(!ft) return '—';
  const parts = (ft.hard || []).map(id=>FT_ITEM_SHORT[id]).filter(Boolean).concat(ft.hardOther || []);
  return parts.join(', ') || '—';
}
function attColX(){
  const gap = 16; let x = PDF_L_MARGIN; const map = {};
  ATT_COLS.forEach(c=>{ map[c.id] = x; x += c.w + gap; });
  return map;
}
function buildAttemptsPages(){
  const dateStr = state.reportDate || todayKey();
  const entries = attemptsOnDate(dateStr);
  if(!entries.length) return null;
  const dayLabel = capitalize(weekdayDateLabel(new Date(dateStr + 'T12:00:00').getTime()));
  const colX = attColX();
  const tableRight = PDF_L_W - PDF_L_MARGIN;

  // "На улице — 2 · Звонок — 1" — counts grouped by the attempt's type,
  // in the order each type first appears.
  const typeCounts = [];
  entries.forEach(e=>{
    if(e.scrubbed) return;
    const t = e.title || 'Без типа';
    const row = typeCounts.find(r=>r[0]===t);
    if(row) row[1]++; else typeCounts.push([t, 1]);
  });
  const summaryLine = typeCounts.map(([t,n])=> `${t} — ${n}`).join('   ·   ');

  const pages = [];
  const pageBottoms = []; // actual content height reached on each page — lets
                           // the clipboard-copy merge crop away each page's
                           // unused bottom margin instead of stacking dead space.
  let { ctx, y } = newReportPage(pages, PDF_L_W, PDF_L_H);
  y = drawReportHeader(ctx, PDF_L_W, PDF_L_MARGIN, 'Таблица осознанности', dayLabel + ' · подходов за день: ' + entries.length + ' · за всё время: ' + totalAttemptsCount());

  const dg = state.dayGoals && state.dayGoals[dateStr];
  if(dg && (dg.goal || dg.description)){
    ctx.fillStyle = RC.text; ctx.font = 'bold 20px ' + REPORT_FONT;
    wrapLines(ctx, 'Цель всех ФТ на день: ' + (dg.goal || ''), PDF_L_W - 2*PDF_L_MARGIN).forEach(l=>{ ctx.fillText(l, PDF_L_MARGIN, y); y += 28; });
    if(dg.description){
      ctx.fillStyle = RC.muted; ctx.font = '18px ' + REPORT_FONT;
      wrapLines(ctx, dg.description, PDF_L_W - 2*PDF_L_MARGIN).forEach(l=>{ ctx.fillText(l, PDF_L_MARGIN, y); y += 25; });
    }
    y += 14;
  }
  if(entries.some(e=>e.scrubbed)){
    ctx.fillStyle = RC.muted; ctx.font = 'italic 16px ' + REPORT_FONT;
    ctx.fillText('Подробности подходов хранятся 14 дней, потом остаётся только их количество.', PDF_L_MARGIN, y);
    y += 40;
  }

  if(summaryLine){
    ctx.fillStyle = RC.muted; ctx.font = '17px ' + REPORT_FONT;
    const sumLines = wrapLines(ctx, summaryLine, tableRight - PDF_L_MARGIN);
    sumLines.forEach((l,li)=> ctx.fillText(l, PDF_L_MARGIN, y + li*23));
    y += sumLines.length * 23 + 16;
  }

  function drawTableHeader(){
    ctx.fillStyle = RC.headBg;
    ctx.fillRect(PDF_L_MARGIN - 10, y - 22, tableRight - PDF_L_MARGIN + 20, 40);
    ctx.fillStyle = RC.accent; ctx.font = 'bold 18px ' + REPORT_FONT;
    ATT_COLS.forEach(c=> ctx.fillText(c.label, colX[c.id], y));
    y += 32;
  }
  drawTableHeader();

  entries.forEach((e,i)=>{
    const rowVals = {
      num: String(i+1),
      title: e.title || '—',
      mindset: e.mindsetBefore || '—',
      reaction: e.reactionAfter || '—',
      anxiety: fmtNum(e.anxiety),
      ritual: e.ft ? (e.ft.silent ? 'Режим молчания' : ftCell(e, 'ritual')) : (ritualText(e) || '—'),
      start: e.ft ? ftCell(e, 'start') : ((e.speechStart || []).join(', ') || '—'),
      method: e.ft ? ftCell(e, 'method') : (e.voice != null ? 'Оценка: ' + fmtNum(e.voice) : '—'),
      voice: e.ft ? ftCell(e, 'voice') : '—',
      hard: ftHardText(e),
    };
    const noteVals = {
      title: e.ft ? ftDetailsText(e.title, e.ft.d) : '',
      ritual: e.ritualNote || '',
      anxiety: e.anxietyNote || '',
    };
    const lineH = 27, noteLineH = 20, noteGap = 7;
    ctx.font = '20px ' + REPORT_FONT;
    const wrapped = {};
    const noteWrapped = {};
    let maxColH = 0;
    ATT_COLS.forEach(c=>{
      const lines = wrapLines(ctx, rowVals[c.id], c.w);
      wrapped[c.id] = lines;
      let colH = lines.length * lineH;
      // A score's comment (e.g. "рука — подробно: ...") is printed as small
      // italic text directly under that same score, in its own column —
      // not bundled into one block under the whole row.
      if(noteVals[c.id]){
        ctx.font = 'italic 15px ' + REPORT_FONT;
        const nLines = wrapLines(ctx, noteVals[c.id], c.w);
        noteWrapped[c.id] = nLines;
        ctx.font = '20px ' + REPORT_FONT;
        colH += noteGap + nLines.length * noteLineH;
      }
      if(colH > maxColH) maxColH = colH;
    });
    const rowH = Math.max(42, maxColH + 16);

    if(y + rowH > PDF_L_H - 54){
      // Continuation page: just keep the table going — no repeated title/
      // date/legend, only the column header row so columns stay labelled.
      pageBottoms.push(y + 10); // outgoing page's actual content ends here
      ({ ctx, y } = newReportPage(pages, PDF_L_W, PDF_L_H));
      y = PDF_L_MARGIN + 28;
      drawTableHeader();
    }

    if(i % 2 === 1){
      ctx.fillStyle = RC.stripe;
      ctx.fillRect(PDF_L_MARGIN - 10, y - 18, tableRight - PDF_L_MARGIN + 20, rowH);
    }
    ATT_COLS.forEach(c=>{
      ctx.fillStyle = RC.text; ctx.font = '20px ' + REPORT_FONT;
      wrapped[c.id].forEach((line, li)=> ctx.fillText(line, colX[c.id], y + li*lineH));
      if(noteWrapped[c.id]){
        ctx.fillStyle = RC.muted; ctx.font = 'italic 15px ' + REPORT_FONT;
        const startY = y + wrapped[c.id].length * lineH + 3;
        noteWrapped[c.id].forEach((line, li)=> ctx.fillText(line, colX[c.id], startY + li*noteLineH));
      }
    });
    y += rowH;

    ctx.strokeStyle = RC.border; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PDF_L_MARGIN - 10, y); ctx.lineTo(tableRight + 10, y); ctx.stroke();
    y += 22;
  });
  pageBottoms.push(y + 10);

  return { pages, pageBottoms, filename: 'Таблица осознанности ' + ruFileDate(dateStr) + '.pdf' };
}
async function generateAttemptsPdf(){
  const cards = state.reportView === 'cards';
  const built = cards ? buildAttemptCardPages() : buildAttemptsPages();
  if(!built){ showToast('За этот день нет записанных подходов'); return; }
  if(!window.jspdf) showToast('Готовим PDF…');
  const ok = await ensureJsPDF();
  if(!ok){ showToast('Не удалось загрузить модуль PDF — проверьте интернет-соединение'); return; }
  if(cards) savePdfFromPages(built.pages, built.filename, false, true);
  else savePdfFromPages(built.pages, built.filename, true);
}
function copyAttemptsImage(){
  const cards = state.reportView === 'cards';
  const built = cards ? buildAttemptCardPages() : buildAttemptsPages();
  if(!built){ showToast('За этот день нет записанных подходов'); return; }
  copyCanvasImage(mergeCanvasesVertically(built.pages, built.pageBottoms, cards ? PDF_P_MARGIN + 24 : PDF_L_MARGIN + 28), 0);
}

/* ---- Attempts as phone-width cards: one card per ФТ, large text ---- */
function buildAttemptCardPages(){
  const dateStr = state.reportDate || todayKey();
  const entries = attemptsOnDate(dateStr);
  if(!entries.length) return null;
  const W = PDF_P_W, H = PDF_P_H, M = PDF_P_MARGIN;
  const dayLabel = capitalize(weekdayDateLabel(new Date(dateStr + 'T12:00:00').getTime()));
  const left = M - 10, right = W - M + 10, textX = M + 14, valueW = right - textX - 14;

  const typeCounts = [];
  entries.forEach(e=>{
    if(e.scrubbed) return;
    const t = e.title || 'Без типа';
    const row = typeCounts.find(r=>r[0]===t);
    if(row) row[1]++; else typeCounts.push([t, 1]);
  });
  const summaryLine = typeCounts.map(([t,n])=> `${t} — ${n}`).join(' · ');

  const pages = [], pageBottoms = [];
  let { ctx, y } = newReportPage(pages, W, H);
  y = drawReportHeader(ctx, W, M, 'Таблица осознанности', dayLabel + ' · подходов: ' + entries.length);
  const para = (text, font, color, lh)=>{
    ctx.font = font; ctx.fillStyle = color;
    wrapLines(ctx, text, W - 2*M).forEach(l=>{ ctx.fillText(l, M, y); y += lh; });
  };
  const dg = state.dayGoals && state.dayGoals[dateStr];
  if(dg && (dg.goal || dg.description)){
    para('Цель всех ФТ на день: ' + (dg.goal || ''), 'bold 24px ' + REPORT_FONT, RC.text, 33);
    if(dg.description) para(dg.description, '22px ' + REPORT_FONT, RC.muted, 30);
    y += 12;
  }
  if(entries.some(e=>e.scrubbed)){
    para('Подробности подходов хранятся 14 дней, потом остаётся только их количество.', 'italic 20px ' + REPORT_FONT, RC.muted, 28);
    y += 8;
  }
  if(summaryLine){ para(summaryLine, '22px ' + REPORT_FONT, RC.muted, 30); y += 14; }

  let idx = 0;
  entries.forEach((e,i)=>{
    if(e.scrubbed) return;
    const fields = [
      ['Настрой', e.mindsetBefore || '—'],
      ['Реакция собеседника', e.reactionAfter || '—'],
      ['Ритуал речи', e.ft ? (e.ft.silent ? 'Режим молчания' : ftCell(e, 'ritual')) : (ritualText(e) || '—')],
      ['Начало речи', e.ft ? ftCell(e, 'start') : ((e.speechStart || []).join(', ') || '—')],
      ['Речь по методике', e.ft ? ftCell(e, 'method') : (e.voice != null ? 'Оценка: ' + fmtNum(e.voice) : '—')],
      ['Голос', e.ft ? ftCell(e, 'voice') : '—'],
      ['Волнение', fmtNum(e.anxiety) + (e.anxietyNote ? ' — ' + e.anxietyNote : '')],
      ['Что было трудно', ftHardText(e)],
    ];
    if(e.ritualNote) fields.push(['Заметка к ритуалу', e.ritualNote]);
    const details = e.ft ? ftDetailsText(e.title, e.ft.d) : '';
    const titleText = (i+1) + '. ' + (e.title || 'Без названия');
    const lh = 33, labelH = 28, gapF = 10, pad = 18;
    ctx.font = '23px ' + REPORT_FONT;
    const detLines = details ? wrapLines(ctx, details, valueW) : [];
    const wrapped = fields.map(([lbl,val])=> wrapLines(ctx, String(val), valueW));
    let cardH = pad + 26 + 14 + (detLines.length ? detLines.length*30 + 6 : 0) + 8;
    wrapped.forEach(w=>{ cardH += 26 + w.length*lh; });
    cardH += 14;

    if(y + cardH > H - 70){
      pageBottoms.push(y);
      ({ ctx, y } = newReportPage(pages, W, H));
      y = M + 24;
    }
    ctx.fillStyle = idx % 2 === 1 ? RC.stripe : RC.bg;
    ctx.fillRect(left, y, right - left, cardH);
    ctx.fillStyle = RC.accent; ctx.fillRect(left, y, 4, cardH);

    let ty = y + pad + 26;
    ctx.fillStyle = RC.accent; ctx.font = 'bold 28px ' + REPORT_FONT;
    ctx.fillText(titleText, textX, ty); ty += 14;
    if(detLines.length){
      ctx.fillStyle = RC.muted; ctx.font = 'italic 21px ' + REPORT_FONT;
      detLines.forEach(l=>{ ty += 30; ctx.fillText(l, textX, ty); });
      ty += 6;
    }
    ty += 8;
    fields.forEach(([lbl],fi)=>{
      ty += labelH - 6;
      ctx.fillStyle = RC.accent; ctx.font = 'bold 18px ' + REPORT_FONT;
      ctx.fillText(lbl.toUpperCase(), textX, ty);
      ctx.fillStyle = RC.text; ctx.font = '23px ' + REPORT_FONT;
      wrapped[fi].forEach((l,li)=>{ ty += (li === 0 ? 30 : lh); ctx.fillText(l, textX, ty); });
      ty += gapF - 3;
    });
    y += cardH + 12;
    idx++;
  });
  pageBottoms.push(y);
  const last = pages[pages.length-1], h = Math.min(Math.ceil(y + 30), last.height);
  const c = document.createElement('canvas'); c.width = last.width; c.height = h;
  const cx = c.getContext('2d'); cx.fillStyle = RC.bg; cx.fillRect(0,0,c.width,h); cx.drawImage(last,0,0);
  pages[pages.length-1] = c; pageBottoms[pageBottoms.length-1] = h;
  return { pages, pageBottoms, filename: 'Таблица осознанности ' + ruFileDate(dateStr) + ' (телефон).pdf' };
}

/* ---- Journal: one question-and-answer card per field, portrait, one day ----
   Each field is its own visually separated card — accent label line on top,
   the answer below in larger text, a tinted background and a coloured left
   bar — so it reads at a glance which answer belongs to which question
   (plain alternating table rows made that hard to tell apart). */
function buildJournalPages(){
  const dateStr = state.reportDate || todayKey();
  const entry = journalEntryOnDate(dateStr);
  if(!entry || entry.scrubbed) return null;

  const fieldLabels = [
    ['mood','Настрой'], ['speechMode','Речевой режим'], ['glad','Что порадовало'],
    ['lessons','Логопедические занятия'], ['ftNotes','ФТ'], ['difficulties','Трудная тетрадь'],
    ['dailyRoutine','Приёмы саморегуляции'], ['sleepHours','Сон'],
    ['reflections','Вопросы, открытия, откровения'], ['praise','За что себя хвалю'],
    ['intentions','Цели на следующий день'],
  ].concat(JOURNAL_LEGACY_FIELDS.filter(([k]) => entry[k]));
  const tableLeft = PDF_P_MARGIN - 10, tableRight = PDF_P_W - PDF_P_MARGIN + 10;
  const textX = PDF_P_MARGIN + 14;
  const valueW = tableRight - textX - 14;

  const ts = new Date(dateStr + 'T12:00:00').getTime();
  const dn = dayNumberForTs(ts);
  const weekdayLabel = capitalize(weekdayDateLabel(ts));
  const headerSubtitle = dn ? `День ${dn} · ${weekdayLabel}` : weekdayLabel;

  const pages = [];
  const pageBottoms = []; // see buildAttemptsPages — same purpose
  let { ctx, y } = newReportPage(pages, PDF_P_W, PDF_P_H);
  y = drawReportHeader(ctx, PDF_P_W, PDF_P_MARGIN, 'Дневник дня', headerSubtitle);

  let idx = 0;
  fieldLabels.forEach(([id,lbl])=>{
    let val = entry[id];
    if(id === 'sleepHours'){
      const hrs = val != null ? fmtNum(val) + ' ч' : '';
      const parts = [hrs, entry.sleepHoursNote || ''].filter(Boolean).join(' — ');
      val = [entry.sleepQuality || '', parts].filter(Boolean).join(' · ') || null;
    }
    if(id === 'speechMode' && val && entry.speechModeNote) val = val + ': ' + entry.speechModeNote;
    if(val === null || val === undefined || String(val).trim() === '') val = '—'; // unanswered question: a dash

    ctx.font = '26px ' + REPORT_FONT;
    const valLines = wrapLines(ctx, String(val), valueW);
    const padTop = 18, padBottom = 20, labelH = 34, lineH = 36;
    const cardH = padTop + labelH + valLines.length * lineH + padBottom;

    if(y + cardH > PDF_P_H - 70){
      // Continuation page: just keep the cards going, no repeated title/date.
      pageBottoms.push(y);
      ({ ctx, y } = newReportPage(pages, PDF_P_W, PDF_P_H));
      y = PDF_P_MARGIN + 24;
    }

    ctx.fillStyle = idx % 2 === 1 ? RC.stripe : RC.bg;
    ctx.fillRect(tableLeft, y, tableRight - tableLeft, cardH);
    ctx.fillStyle = RC.accent;
    ctx.fillRect(tableLeft, y, 4, cardH);

    let ty = y + padTop + 14;
    ctx.fillStyle = RC.accent; ctx.font = 'bold 21px ' + REPORT_FONT;
    ctx.fillText(lbl.toUpperCase(), textX, ty + 4);
    ty += labelH;
    ctx.fillStyle = RC.text; ctx.font = '26px ' + REPORT_FONT;
    valLines.forEach((l,li)=> ctx.fillText(l, textX, ty + li*lineH));

    y += cardH + 10;
    idx++;
  });
  pageBottoms.push(y);
  // Crop the single tall page to its content.
  if(pages.length === 1){
    const full = pages[0], h = Math.min(Math.ceil(y + 30), full.height);
    const c = document.createElement('canvas'); c.width = full.width; c.height = h;
    const cx = c.getContext('2d'); cx.fillStyle = RC.bg; cx.fillRect(0,0,c.width,h); cx.drawImage(full,0,0);
    pages[0] = c; pageBottoms[0] = h;
  }

  return { pages, pageBottoms, filename: 'Дневник ' + ruFileDate(dateStr) + '.pdf' };
}
async function generateJournalPdf(){
  const built = buildJournalPages();
  if(!built){ showToast(journalScrubbedOn(state.reportDate || todayKey()) ? 'Текст этого дневника уже удалён — хранится 30 дней' : 'За этот день нет записи дневника'); return; }
  if(!window.jspdf) showToast('Готовим PDF…');
  const ok = await ensureJsPDF();
  if(!ok){ showToast('Не удалось загрузить модуль PDF — проверьте интернет-соединение'); return; }
  savePdfFromPages(built.pages, built.filename, false, true);
}
function copyJournalImage(){
  const built = buildJournalPages();
  if(!built){ showToast(journalScrubbedOn(state.reportDate || todayKey()) ? 'Текст этого дневника уже удалён — хранится 30 дней' : 'За этот день нет записи дневника'); return; }
  copyCanvasImage(mergeCanvasesVertically(built.pages, built.pageBottoms, PDF_P_MARGIN + 24), 0);
}

async function boot(){
  loadSession();
  try{
    const savedTheme = localStorage.getItem('arlilia_theme');
    if(savedTheme) state.settings.theme = savedTheme;
  }catch(e){}
  applyTheme();
  if(!auth.accessToken){
    state.loggedIn = false;
    render();
    return;
  }
  state.loggedIn = true;
  // Если на телефоне уже есть сохранённые данные — показываем их сразу, а свежие подгружаем в фоне.
  if(loadCache()){ state.loaded = true; mergeOutboxIntoEntries(); }
  render();
  const ok = await loadAll();
  if(ok === false){
    clearSession();
    state.loggedIn = false;
    state.loginNotice = 'Сессия истекла — войдите снова. Дальше вход будет сохраняться.';
  } else if(state.loadOffline){
    showToast('Нет соединения — показаны сохранённые данные');
  } else if(!state.settings.startDate){
    // First-time setup nudge: a popup, then an arrow pointing at the
    // settings gear — only for someone who hasn't set a start date yet
    // and hasn't dismissed this before (per device).
    let seen = false;
    try{ seen = localStorage.getItem('arlilia_onboarding_done') === '1'; }catch(e){}
    if(!seen) state.onboarding = 1;
  }
  render();
}
boot();

// Keep the login alive. A phone suspends the page in the background, so the
// short-lived access token routinely expires while the app is closed; renew
// it the moment the app comes back to the foreground (before any data call
// has a chance to fail), and keep this tab in step with other tabs/windows
// that may have rotated the refresh token.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState !== 'visible' || !state.loggedIn) return;
  syncSessionFromStorage();
  auth.sessionInvalid = false;
  ensureFreshToken().then(()=>{
    flushOutbox();
    // The server genuinely rejected the saved login — say so, rather than
    // leaving the screen showing data that can no longer be saved.
    if(auth.sessionInvalid && state.loggedIn){
      clearSession();
      state.loggedIn = false; state.loaded = false;
      state.loginNotice = 'Сессия истекла — войдите снова. Дальше вход будет сохраняться.';
      render();
    }
  });
});
window.addEventListener('online', ()=>{ if(state.loggedIn) ensureFreshToken().then(flushOutbox); });
window.addEventListener('storage', (ev)=>{
  if(ev.key === 'arlilia_session') syncSessionFromStorage();
});
// Ask the browser not to evict this site's saved data (the saved login lives
// in localStorage) when it's low on space. Best-effort; ignored if unsupported.
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

// Register the service worker (app shell caching) only once the app is up
// and running, so it never competes with real data loads for bandwidth.
// Fails silently when sw.js isn't served next to this page (e.g. a local
// file opened directly) — the app works identically either way.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ---- "New version available" notice. An installed app can stay open in the
   background for days and keep running old code, so we compare the version
   the page was opened with against the current one on the server whenever the
   app comes back to the foreground (and every 30 minutes). Nothing reloads by
   itself — the person taps «Обновить», so a half-filled form is never lost. */
let shellVersion = null, updateShown = false;
async function fetchShellVersion(){
  try{
    const res = await fetch('sw.js?v=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) return null;
    const m = (await res.text()).match(/CACHE_NAME\s*=\s*'([^']+)'/);
    return m ? m[1] : null;
  }catch(e){ return null; }
}
async function checkForUpdate(){
  if(updateShown) return;
  const v = await fetchShellVersion();
  if(!v) return;
  if(shellVersion === null){ shellVersion = v; return; }
  if(v !== shellVersion){
    updateShown = true;
    const bar = document.createElement('div');
    bar.className = 'update-bar';
    bar.innerHTML = '<span>Доступна новая версия приложения</span><button type="button">Обновить</button>';
    bar.querySelector('button').addEventListener('click', ()=> location.reload());
    document.body.appendChild(bar);
  }
}
window.addEventListener('load', ()=>{ checkForUpdate(); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkForUpdate(); });
setInterval(checkForUpdate, 30 * 60 * 1000);
</script>
