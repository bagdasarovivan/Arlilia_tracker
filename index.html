<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arlilia</title>
<meta name="theme-color" content="#1A1D23">
<meta name="description" content="Дневник речевых подходов и самонаблюдений">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="arlilia-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="arlilia-192.png">
<link rel="apple-touch-icon" href="arlilia-180.png">
<style>
  :root{
    --bg: #F2F7F6;
    --surface: #FFFFFF;
    --surface-2: #E9F2F0;
    --border: #DCE9E6;
    --text: #1E3838;
    --text-muted: #7E9896;
    --accent: #3FA7A0;
    --accent-soft: rgba(63,167,160,0.14);
    --accent-text: #FFFFFF;
    --good: #5FA87F;
    --good-soft: rgba(95,168,127,0.15);
    --warn: #D9695A;
    --warn-soft: rgba(217,105,90,0.14);
    --t0:#B7C6C4; --t1:#5FA87F; --t2:#5C8FBF; --t3:#8C78B8; --t4:#C9A24E; --t5:#A9443F;
    --radius: 18px;
    --radius-sm: 10px;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="dark"]{
    --bg: #15211F;
    --surface: #1C2B29;
    --surface-2: #223634;
    --border: #2C403D;
    --text: #EAF3F1;
    --text-muted: #8FA6A3;
    --accent: #4FBDB6;
    --accent-soft: rgba(79,189,182,0.18);
    --accent-text: #0E2220;
    --good: #7BC79A;
    --good-soft: rgba(123,199,154,0.16);
    --warn: #E08673;
    --warn-soft: rgba(224,134,115,0.16);
    --t0:#D5E2E0; --t1:#7BC79A; --t2:#7AA9D6; --t3:#A592D0; --t4:#DDB964; --t5:#C85A55;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    padding: 26px 20px 0;
  }
  h1,h2,h3{ font-family: var(--serif); font-weight:400; margin:0; }
  .eyebrow{ color: var(--text-muted); font-size: 14px; margin-bottom: 6px; }
  .btn{
    border:none; border-radius: var(--radius-sm);
    padding: 17px 20px; font-size:18px; font-family: var(--sans);
    cursor:pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .08s ease, opacity .15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--accent); color:var(--accent-text); font-weight:600; width:100%; }
  .btn-ghost{ background: transparent; color: var(--text); border:1px solid var(--border); width:100%; }
  .card{
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
  }
  .content{ flex:1; padding-bottom: 24px; }

  /* ---- Top app bar ---- */
  .app-bar{
    position: sticky; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    background: var(--surface); border-bottom:1px solid var(--border);
    padding: 14px 20px; margin: -26px -20px 18px;
  }
  .app-bar-brand{ display:flex; align-items:center; gap:9px; font-family: var(--serif); font-size:19px; font-weight:600; letter-spacing:.05em; color: var(--text); }
  .brand-mark{ display:flex; flex:none; width:32px; height:32px; }
  .brand-mark{ background:#fff; border-radius:9px; overflow:hidden; }
  .brand-mark img{ display:block; width:100%; height:100%; object-fit:contain; }
  .brand-text{ line-height:1; }
  .app-bar-right{ display:flex; align-items:center; gap:8px; }
  .streak-pill{
    display:inline-flex; align-items:center; gap:4px;
    background: var(--accent-soft); color: var(--accent); font-weight:600;
    border-radius:999px; padding:6px 12px; font-size:14px; font-family: var(--sans);
    border:none; cursor:pointer; -webkit-tap-highlight-color: transparent;
  }
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-card{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding:22px; max-width:360px; width:100%;
  }
  .modal-title{ font-family: var(--serif); font-size:20px; margin-bottom:10px; }
  .modal-text{ font-size:15px; color: var(--text-muted); line-height:1.5; }
  .gear-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--border);
    background: var(--surface); color: var(--text-muted); font-size:17px;
    display:flex; align-items:center; justify-content:center; padding:0; flex:none;
  }
  .gear-btn.active{ color: var(--accent); border-color: var(--accent); }

  /* ---- Onboarding: popup + pointing arrow at the settings gear ---- */
  .onboard-arrow-wrap{
    position: fixed; top:0; right:16px; z-index:50;
    display:flex; flex-direction:column; align-items:flex-end;
    padding-top: 58px;
  }
  .onboard-arrow{
    font-size:30px; line-height:1; color: var(--accent);
    margin-right:16px; animation: onboard-bounce 1.2s ease-in-out infinite;
  }
  @keyframes onboard-bounce{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }
  .onboard-callout{
    background: var(--surface); border:1px solid var(--accent); border-radius: var(--radius);
    padding:16px; width: min(280px, calc(100vw - 32px)); margin-top:2px;
    box-shadow: 0 10px 28px -10px rgba(0,0,0,.35);
  }

  /* ---- Bottom nav ---- */
  .tabbar{
    position: sticky; bottom:0; left:0; right:0;
    display:flex; background: var(--surface);
    border-top:1px solid var(--border);
    padding: 10px 6px calc(10px + env(safe-area-inset-bottom));
    margin: 0 -20px;
  }
  .tab-btn{
    flex:1; background:none; border:none; color: var(--text-muted);
    font-size:12px; padding:6px 4px; display:flex; flex-direction:column;
    align-items:center; gap:4px; font-family: var(--sans);
  }
  .tab-btn{ min-width:0; padding-left:2px; padding-right:2px; }
  .tab-btn span{ white-space:nowrap; }
  @media (max-width: 370px){ .tab-btn{ font-size:10.5px; } .tab-btn .ic{ font-size:18px; } }
  .tab-btn .ic{ font-size:19px; }
  .tab-btn.active{ color: var(--accent); }

  /* ---- Home / Practice tab ---- */
  .home-hero{ margin-top: 4px; margin-bottom: 28px; }
  .home-hero h1{ font-size: 34px; line-height:1.25; }
  .today-badge-wrap{ display:flex; justify-content:center; margin: 10px 0 30px; }
  .today-badge-wrap.has-ring{ margin-bottom:30px; }
  .today-badge{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:176px; height:176px; border-radius:50%;
    background: radial-gradient(circle at 32% 28%, var(--surface) 0%, var(--accent-soft) 72%);
    border:1px solid var(--border);
    box-shadow: 0 8px 24px -10px var(--accent-soft);
  }
  .today-badge-num{ font-family: var(--serif); font-size:68px; line-height:1; color: var(--accent); }
  .today-badge-lbl{ font-size:13px; color: var(--text-muted); margin-top:8px; text-align:center; letter-spacing:.02em; }

  /* ---- progress ring on the home screen ---- */
  .ring-wrap{ position:relative; width:206px; height:206px; display:flex; align-items:center; justify-content:center; }
  .ring-wrap svg{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .ring-arc{ fill:none; stroke-width:7; stroke-linecap:round; stroke: var(--border); }
  .ring-arc.min{ stroke: var(--text-muted); opacity:.4; }
  .ring-arc.on{ opacity:1; }
  .ring-caption{ text-align:center; font-size:14px; color: var(--text-muted); margin:-14px 0 24px; }
    .remind-card{ display:flex; align-items:center; gap:12px; background: var(--accent-soft); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin:0 0 16px; }
  .remind-card .remind-text{ flex:1; font-size:14px; line-height:1.4; }
  .remind-card .btn{ padding:9px 14px; font-size:14px; flex:none; width:auto; }
  .pw-form{ display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
  .view-switch{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px; align-items:center; font-size:13px; color: var(--text-muted); }
  .view-switch .attempt-mini{ flex:none; }
  .update-bar{ position:fixed; left:12px; right:12px; top:calc(env(safe-area-inset-top, 0px) + 10px); z-index:9998; display:flex; align-items:center; gap:10px; background:#1f6f68; color:#fff; border-radius:14px; padding:11px 14px; box-shadow:0 8px 24px -8px rgba(0,0,0,.4); font-size:14px; }
  .update-bar span{ flex:1; }
  .update-bar button{ background:#fff; color:#1f6f68; border:none; border-radius:10px; padding:8px 14px; font-size:14px; font-weight:600; }

  /* ---- Practice wizard ---- */
  .progress-dots{ display:flex; gap:5px; justify-content:center; flex-wrap:wrap; margin-bottom: 22px; margin-top: 4px; }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--border); }
  .dot.done{ background: var(--accent); }
  .dot.current{ background: var(--text); }
  .q-wrap{ flex:1; display:flex; flex-direction:column; justify-content:flex-start; padding-top: 2vh; }
  .wiz-shell{ padding:22px 20px 0; display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }
  .q-label{ font-size:26px; font-family: var(--serif); text-align:center; margin-bottom: 8px; }
  .q-hint{ font-size:16px; color: var(--text-muted); text-align:center; margin-bottom: 24px; }
  .scale-value{ font-family: var(--serif); font-size: 64px; text-align:center; margin-bottom: 18px; }
  .scale-slider{ width:100%; -webkit-appearance:none; height:6px; border-radius:3px; background: var(--border); outline:none; }
  .scale-slider::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background: var(--accent); border:3px solid var(--bg); box-shadow:0 0 0 1px var(--accent); }
  .scale-ends{ display:flex; justify-content:space-between; font-size:13px; color: var(--text-muted); margin-top:8px; }
  .choice-row{ display:flex; gap:12px; margin-top: 6px; }
  .choice-btn{ flex:1; padding: 20px; border-radius: var(--radius-sm); border:1px solid var(--border); background: var(--surface); color: var(--text); font-size:18px; transition: background .15s ease, border-color .15s ease, color .15s ease; }
  .choice-btn.selected{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight:600; }
  .choice-list{ display:flex; flex-direction:column; gap:10px; }
  .choice-list-btn{ text-align:left; padding:18px 18px; border-radius: var(--radius-sm); border:1px solid var(--border); background: var(--surface); color: var(--text); font-size:18px; }
  .choice-list-btn.selected{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight:600; }
  textarea, input[type=text], input[type=number], input[type=email], input[type=password], input[type=date]{
    width:100%; max-width:100%; min-width:0; box-sizing:border-box;
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-size:18px; padding:14px 14px; font-family: var(--sans);
  }
  textarea{ min-height: 140px; resize:vertical; line-height:1.45; }
  textarea[id^="jw-text-"]{ min-height: 220px; }
  /* Some mobile browsers reserve extra internal width for the date
     picker's calendar icon beyond the box's own width, which can push
     the control a few pixels past its card. The wrapper alone now owns
     the visible border/background/radius; the input itself is borderless
     and transparent, so there's no second edge of its own that could peek
     out past the wrapper's rounded corner (the earlier overflow:hidden-only
     fix still left the input's own 1px border visibly breaking out of the
     curve in Safari). */
  .date-input-wrap{
    overflow:hidden; border-radius: var(--radius-sm);
    border:1px solid var(--border); background: var(--surface);
  }
  .date-input-wrap input[type=date]{
    display:block; width:100%; border:none; background:transparent;
    border-radius:0; padding-right:8px;
    -webkit-appearance:none; appearance:none;
  }
  input[type=number]{ -moz-appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .nav-row{ display:flex; gap:10px; margin-top:auto; padding:14px 0 calc(16px + env(safe-area-inset-bottom)); position:sticky; bottom:0; background: linear-gradient(to top, var(--bg) 75%, transparent); }
  .nav-row .btn-ghost{ flex: 0 0 84px; }

  /* ---- Top bar (sub-pages) ---- */
  .top-bar{ display:flex; align-items:center; gap:10px; margin-bottom: 18px; }
  .back-btn{ background:none; border:none; color: var(--text-muted); font-size:24px; padding:4px 8px 4px 0; cursor:pointer; }
  .top-bar h2{ font-size:23px; flex:1; }
  .top-bar .save-btn{ background:none; border:none; color: var(--accent); font-size:16px; font-weight:600; padding:4px; }

  /* ---- Segmented control ---- */
  .segment-row, .period-row{ display:flex; gap:8px; margin-bottom: 20px; }
  .segment-btn, .period-btn{ flex:1; padding:10px; border-radius: 999px; border:1px solid var(--border); background:transparent; color: var(--text-muted); font-size:15px; }
  .segment-btn.active, .period-btn.active{ background: var(--accent); color:var(--accent-text); border-color: var(--accent); font-weight:600; }

  /* ---- Journal ---- */
  .journal-today-card{ margin-bottom: 20px; }
  .journal-today-card .date{ color: var(--text-muted); font-size:14px; margin-bottom:6px; }
  .journal-today-card .mood{ font-family: var(--serif); font-size:24px; margin-bottom: 10px; }
  .journal-list-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 16px; background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-sm); margin-bottom:10px;
  }
  .journal-list-row .jd{ font-size:17px; max-width: 78%; }
  .journal-list-row .jd > div:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .journal-list-row .jd .date{ color: var(--text-muted); font-size:13px; }
  .journal-list-row .flags{ display:flex; gap:6px; }
  .flag-dot{ width:8px; height:8px; border-radius:50%; }
  .flag-good{ background: var(--good); }
  .flag-off{ background: var(--border); }
  .empty{ text-align:center; color: var(--text-muted); padding: 32px 10px; font-size:16px; line-height:1.45; }
  .empty-art{ display:flex; justify-content:center; margin-bottom:12px; opacity:.95; }
  .trend-empty .empty-art{ margin-bottom:8px; }

  .read-hero{ text-align:center; margin: 14px 0 34px; }
  .read-hero-emoji{ font-size:64px; line-height:1; margin-bottom:12px; }
  .read-hero-mood{ font-family: var(--serif); font-size:26px; }
  .read-row{ display:flex; gap:16px; padding:19px 2px; border-bottom:1px solid var(--border); align-items:flex-start; }
  .read-row:last-child{ border-bottom:none; }
  .read-icon{ font-size:22px; line-height:1; width:42px; height:42px; display:flex; align-items:center; justify-content:center; background: var(--accent-soft); border-radius:12px; flex-shrink:0; }
  .read-label{ font-size:14px; color: var(--text-muted); margin-bottom:5px; font-weight:600; }
  .read-text{ font-size:18px; line-height:1.6; }
  .read-big{ font-family: var(--serif); font-size:30px; }
  .read-sub{ font-size:14px; color: var(--text-muted); margin-top:3px; }

  .section-block{ margin-bottom: 26px; }
  .section-head{ display:flex; align-items:baseline; gap:10px; margin-bottom: 12px; }
  .section-num{ font-family: var(--serif); color: var(--accent); font-size:14px; }
  .section-title{ font-family: var(--serif); font-size:20px; }
  .journal-card{ margin-bottom: 16px; }
  .jc-title{ font-family: var(--serif); font-size:19px; margin-bottom: 14px; }
  .autosave-hint{ font-size:13px; color: var(--text-muted); margin: -6px 0 18px; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .field{ margin-bottom: 12px; }
  .field-label{ font-size:14px; color: var(--text-muted); margin-bottom:6px; }
  .bool-row{ display:flex; gap:10px; }
  .bool-chip{ flex:1; padding:14px; border-radius: var(--radius-sm); border:1px solid var(--border); background: var(--surface); color: var(--text-muted); font-size:16px; }
  .bool-chip.selected-yes{ background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight:600; }
  .bool-chip.selected-no{ background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight:600; }

  /* ---- Onboarding hint (set a start date) ---- */
  .hint-card{
    display:flex; align-items:center; gap:12px;
    background: var(--accent-soft); border:1px solid var(--accent);
    border-radius: var(--radius-sm); padding:14px 16px; margin-bottom:18px;
  }
  .hint-card-icon{ font-size:20px; line-height:1; width:40px; height:40px; display:flex; align-items:center; justify-content:center; background: var(--surface); border-radius:12px; flex:none; }
  .hint-card-text{ flex:1; font-size:14px; line-height:1.4; color: var(--text); }
  .hint-card-btn{
    flex:none; background: var(--accent); color: var(--accent-text);
    border:none; border-radius:999px; padding:9px 16px; font-size:13px;
    font-weight:600; font-family: var(--sans); white-space:nowrap;
  }

  /* ---- Progress ---- */
  .metric-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom: 22px; }
  .metric-tile{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-sm); padding:16px; }
  .metric-tile .num{ font-family: var(--serif); font-size: 30px; }
  .metric-tile .lbl{ font-size:14px; color: var(--text-muted); margin-top:4px; }
  .metric-tile.good .num{ color: var(--good); }
  .metric-tile .lbl .delta{ display:block; margin-top:3px; font-size:11px; }
  .delta-good{ color: var(--good); }
  .delta-bad{ color: var(--warn); }
  .trend-wrap{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-sm); padding:14px 12px 10px; margin-top:16px; }
  .trend-svg{ width:100%; height:120px; display:block; }
  .trend-legend{ display:flex; justify-content:space-between; font-size:12px; color: var(--text-muted); margin-top:6px; flex-wrap:wrap; gap:8px; }
  .trend-empty{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-sm); padding:24px 12px; margin-top:16px; text-align:center; color: var(--text-muted); font-size:13px; }
  .report-actions{ margin-top:4px; display:flex; flex-direction:column; gap:14px; }
  .report-card{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding:14px 14px 14px 16px; }
  .report-card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; min-height:32px; }
  .report-card-title{ font-family: var(--serif); font-size:19px; }
  .report-btns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .report-btns .btn{ width:100%; padding:14px 8px; font-size:16px; white-space:nowrap; min-width:0; }
  .attempt-mini.active{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .attempt-list{ border:1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
  .attempt-row{ padding:6px 10px; border-bottom:1px solid var(--border); }
  .attempt-row:last-child{ border-bottom:none; }
  .attempt-row-top{ display:flex; align-items:center; gap:8px; }
  .attempt-row-num{ color: var(--text-muted); font-size:13px; flex:none; }
  .attempt-row-title{ flex:1; min-width:0; font-size:14px; overflow-wrap:anywhere; }
  .attempt-mini{ flex:none; background:none; border:1px solid var(--border); border-radius:8px; padding:5px 9px; font-size:13px; color: var(--text); cursor:pointer; font-family:inherit; }
  .attempt-mini.danger{ color: var(--warn); border-color: var(--warn); }
  .delta-flat{ color: var(--text-muted); }
  .chart-card{ margin-bottom: 20px; }
  .chart-card h3{ font-size:15px; margin-bottom: 10px; color: var(--text-muted); font-family: var(--sans); }
  canvas.chart{ width:100%; height:150px; display:block; }
  .history-row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; gap:10px; }
  .history-row:last-child{ border-bottom:none; }
  .history-row .d{ color: var(--text-muted); white-space:nowrap; }
  .history-row .m{ text-align:right; }
  .digest-item{ padding: 14px 0; border-bottom:1px solid var(--border); }
  .digest-item:last-child{ border-bottom:none; }
  .digest-item .dd{ font-size:12px; color: var(--text-muted); margin-bottom:4px; }
  .digest-item .dl{ font-size:11px; color: var(--accent); margin-bottom:2px; }
  .digest-item .dt{ font-size:14px; }
  .note-card{ padding:14px 18px; font-size:14px; color: var(--text-muted); margin-bottom:18px; }
  .note-card b{ color: var(--text); font-weight:600; }

  /* ---- Calendar ---- */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; }
  .cal-weekdays{ margin-bottom:6px; }
  .cal-weekday{ font-size:11px; color: var(--text-muted); text-align:center; padding-bottom:2px; }
  .cal-cell{ position:relative; min-width:0; aspect-ratio:1; border-radius:12px; background: var(--surface); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding-top:2px; }
  .cal-cell.empty{ background:transparent; border:none; }
  .cal-cell.done{ background: color-mix(in srgb, var(--good) 20%, var(--surface)); border-color: color-mix(in srgb, var(--good) 45%, var(--border)); }
  .cal-cell.today{ border-color: var(--accent); border-width:2px; }
  .cal-day-num{ font-size:15px; font-family: var(--serif); color: var(--text); line-height:1; }
  .cal-emojis{ display:flex; gap:2px; min-height:14px; align-items:center; font-size:12px; line-height:1; }
  .cal-count{ font-size:9px; color: var(--accent); font-weight:600; line-height:1; min-height:10px; }
  .cal-arrow{ position:absolute; top:3px; right:4px; font-size:10px; line-height:1; }
  .cal-arrow.up{ color: var(--good); }
  .cal-arrow.down{ color: var(--warn); }
  .cal-legend{ display:flex; flex-wrap:wrap; justify-content:center; gap:14px 18px; margin-top:14px; font-size:12px; color: var(--text-muted); align-items:center; text-align:center; width:100%; }
  .cal-legend span{ display:inline-flex; align-items:center; gap:5px; }

  /* ---- Exercises ---- */
  .exercise-cat-list{ display:flex; flex-direction:column; gap:12px; }
  .exercise-cat-card{
    display:flex; align-items:center; gap:14px; text-align:left;
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding:18px; font-family: var(--sans); color: var(--text); cursor:pointer;
  }
  .exercise-cat-icon{ font-size:24px; line-height:1; flex-shrink:0; width:46px; height:46px; display:flex; align-items:center; justify-content:center; background: var(--accent-soft); border-radius:13px; }
  .exercise-cat-body{ flex:1; min-width:0; }
  .exercise-cat-label{ font-family: var(--serif); font-size:19px; }
  .exercise-cat-sub{ font-size:13px; color: var(--text-muted); margin-top:3px; }
  .exercise-cat-count{ font-size:16px; color: var(--text-muted); flex-shrink:0; }

  .exercise-list{ display:flex; flex-direction:column; gap:10px; }
  .exercise-row{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-sm); padding:4px 14px; }
  .exercise-row-top{ display:flex; align-items:center; gap:12px; min-height:52px; }
  .exercise-name{ flex:1; text-align:left; background:none; border:none; color: var(--text); font-size:16px; font-family: var(--sans); padding:10px 0; }
  .exercise-chevron{ color: var(--text-muted); font-size:11px; flex-shrink:0; }
  .exercise-detail{ padding:0 0 16px; font-size:14px; line-height:1.55; color: var(--text); }
  .exercise-note{ margin-top:8px; color: var(--text-muted); font-size:13px; font-style:italic; }
  .exercise-group{ margin:14px 2px 2px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color: var(--text-muted); }
  .exercise-p{ margin:0 0 8px; }
  .exercise-sub{ margin-bottom:8px; color: var(--text-muted); font-size:13px; }
  .exercise-intro{ background: var(--surface, #fff); border:1px solid var(--border, rgba(0,0,0,.08)); border-radius:14px; padding:14px 16px 6px; margin-bottom:14px; font-size:14px; line-height:1.55; }
  .exercise-errors-title{ margin:12px 0 4px; font-weight:600; font-size:13px; }
  .exercise-errors{ margin:0; padding-left:20px; font-size:13px; line-height:1.5; color: var(--text-muted); }
  .exercise-errors li{ margin-bottom:3px; }
  .exercise-rules{ color: var(--text); font-size:14px; }
  /* Launch splash (~1.5s): logo fades in, glows and a light sweep passes over it, then the overlay fades out */
  #splash{ position:fixed; inset:0; z-index:9999; background:#1A1D23; display:flex; align-items:center; justify-content:center; animation: splash-out .5s ease-in 1s forwards; pointer-events:none; }
  #splash .splash-in{ display:flex; flex-direction:column; align-items:center; gap:18px; opacity:0; transform:scale(.92); animation: splash-in .45s ease-out .05s forwards; }
  #splash .splash-logo{ position:relative; width:104px; height:104px; border-radius:26px; background:#fff; overflow:hidden; animation: splash-glow 1.4s ease-in-out .1s both; }
  #splash .splash-logo img{ display:block; width:100%; height:100%; padding:6px; box-sizing:border-box; object-fit:contain; }
  #splash .splash-logo::after{ content:''; position:absolute; top:0; bottom:0; width:45%; left:-60%; background:linear-gradient(105deg, transparent, rgba(255,255,255,.85), transparent); animation: splash-shine .7s ease-in-out .35s forwards; }
  #splash .splash-name{ font-family: Georgia, 'Times New Roman', serif; font-size:30px; letter-spacing:.04em; color:#fff; }
  @keyframes splash-in{ 0%{ opacity:0; transform:scale(.92); } 100%{ opacity:1; transform:scale(1); } }
  @keyframes splash-glow{ 0%{ box-shadow:0 0 0 0 rgba(60,190,180,0); } 50%{ box-shadow:0 0 34px 8px rgba(60,190,180,.65); } 100%{ box-shadow:0 0 22px 4px rgba(60,190,180,.4); } }
  @keyframes splash-shine{ from{ left:-60%; } to{ left:130%; } }
  @keyframes splash-out{ to{ opacity:0; visibility:hidden; } }
  @media (prefers-reduced-motion: reduce){ #splash .splash-in, #splash .splash-logo, #splash .splash-logo::after{ animation:none; } #splash .splash-in{ opacity:1; transform:none; } #splash .splash-logo::after{ display:none; } }

/* ---- ФТ: мастер и карточка цели дня (общий стиль с остальным приложением) ---- */
.ft-item{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; line-height:1.3; }
.ft-row{ display:flex; flex-wrap:wrap; align-items:stretch; gap:8px; }
.ft-row .ft-item{ flex:1; min-width:0; }
.ft-i{ flex:none; width:44px; border-radius: var(--radius-sm); border:1px solid var(--border); background: var(--surface); color: var(--text-muted); font-family: var(--serif); font-style:italic; font-size:18px; padding:0; }
.ft-i.on{ color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.ft-desc-open{ flex-basis:100%; font-size:14px; line-height:1.5; color: var(--text-muted); background: var(--surface-2); border-radius: var(--radius-sm); padding:12px 14px; }
.sync-pill{ display:inline-flex; align-items:center; gap:4px; height:36px; padding:0 12px; border-radius:18px; border:1px solid var(--warn); background: var(--warn-soft); color: var(--warn); font-size:14px; }
.ft-desc{ font-size:13px; font-weight:400; line-height:1.45; color: var(--text-muted); }
.choice-list-btn.selected .ft-desc{ color: var(--text); opacity:.8; }
.ft-all{ margin-top:6px; font-weight:600; text-align:center; border-style:dashed; border-color: var(--accent); color: var(--accent); background: transparent; }
.ft-all.selected{ border-style:solid; background: var(--accent); color: var(--accent-text); }
.ft-group{ display:flex; align-items:center; gap:10px; margin:18px 2px 4px; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color: var(--accent); }
.ft-group::after{ content:''; flex:1; height:1px; background: var(--border); }
.ft-group:first-child{ margin-top:0; }
.ft-details{ display:flex; flex-direction:column; gap:4px; }
.ft-detail-label{ font-family: var(--serif); font-size:17px; color: var(--text); margin:12px 2px 2px; }

.goal-card{
  position:relative; margin:0 0 20px; padding:18px 18px 16px 22px; overflow:hidden;
  background: linear-gradient(160deg, var(--surface) 0%, var(--accent-soft) 140%);
  border:1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 10px 26px -16px var(--accent);
}
.goal-card::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background: var(--accent); }
.goal-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.goal-icon{
  flex:none; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background: var(--accent-soft); border:1px solid var(--accent); font-size:17px; line-height:1;
}
.goal-title{ flex:1; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color: var(--accent); }
.goal-edit{
  flex:none; width:34px; height:34px; border-radius:50%; padding:0; cursor:pointer;
  background: var(--surface); border:1px solid var(--border); color: var(--text-muted); font-size:15px;
  display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color: transparent;
}
.goal-text{ font-family: var(--serif); font-size:23px; line-height:1.3; color: var(--text); overflow-wrap:anywhere; }
.goal-desc{ font-size:15px; line-height:1.5; color: var(--text-muted); margin-top:8px; overflow-wrap:anywhere; }
.goal-empty{ text-align:center; }
.goal-empty .goal-head{ justify-content:center; }
.goal-empty .goal-title{ flex:none; }
.goal-add{
  width:100%; margin-top:2px; padding:13px; border-radius: var(--radius-sm); cursor:pointer;
  background: transparent; border:1px dashed var(--accent); color: var(--accent); font-size:16px; font-weight:600; font-family: var(--sans);
}
.goal-hint{
  margin-top:12px; padding:12px 14px; border-radius: var(--radius-sm); text-align:left;
  background: var(--accent-soft); font-size:14px; line-height:1.45; color: var(--text);
}
.goal-hint-btn{
  margin-top:10px; background: var(--accent); color: var(--accent-text); border:none; border-radius:999px;
  padding:8px 16px; font-size:13px; font-weight:600; font-family: var(--sans); cursor:pointer;
}
.goal-form .field-label{ margin-top:12px; }
.goal-form textarea{ min-height:90px; font-size:16px; }
.goal-form input[type=text]{ font-size:17px; }
.save-error{ margin:14px 0 0; padding:12px 14px; border-radius: var(--radius-sm); background: rgba(217,95,76,.14); border:1px solid var(--warn); color: var(--text); font-size:14px; line-height:1.45; }
.db-check{ margin-top:12px; font-size:14px; line-height:1.6; }
.db-check .bad{ color: var(--warn); }
.db-check .good{ color: var(--accent); }
.goal-form .nav-row{ margin-top:14px; padding:0; position:static; background:none; }
</style>
</head>

<script>
const SUPABASE_URL = 'https://zvstrubroelqaivgtooc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cnIPiLyx12CBRvx175QrhQ_kKQgW6Eh';

// Everything the person types (journal text, custom answers, notes) ends up
// back in the page via innerHTML — this neutralizes it as plain text before
// it's inserted, so typed-in HTML/script can never run (stored XSS).
function esc(str){
  if(str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ---------- lazy-load jsPDF ----------
   Only the two "скачать PDF" buttons actually need jsPDF — "копировать
   картинкой" works off plain canvas and never touches it. Loading the
   ~280KB library eagerly on every page open (even for people who never
   export a PDF) slowed down first paint for no reason, so it's now
   fetched on demand, once, the first time it's actually needed. */
let jsPDFLoadPromise = null;
function ensureJsPDF(){
  if(window.jspdf) return Promise.resolve(true);
  if(jsPDFLoadPromise) return jsPDFLoadPromise;
  jsPDFLoadPromise = new Promise((resolve)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = ()=> resolve(!!window.jspdf);
    s.onerror = ()=> resolve(false);
    document.head.appendChild(s);
  });
  return jsPDFLoadPromise;
}

/* ---------- auth (Supabase email/password) ---------- */
const auth = { accessToken: null, refreshToken: null, userId: null, email: null, expiresAt: 0 };

function sbHeaders(extra){
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + (auth.accessToken || SUPABASE_KEY),
    'Content-Type': 'application/json',
    ...(extra || {}),
  };
}
function loadSession(){
  try{
    const raw = localStorage.getItem('arlilia_session');
    if(!raw) return;
    const s = JSON.parse(raw);
    auth.accessToken = s.access_token; auth.refreshToken = s.refresh_token;
    auth.userId = s.user_id; auth.email = s.email; auth.expiresAt = s.expires_at;
  }catch(e){}
}
function setSession(data){
  auth.accessToken = data.access_token;
  auth.refreshToken = data.refresh_token;
  if(data.user){ auth.userId = data.user.id; auth.email = data.user.email; }
  auth.expiresAt = Date.now() + (data.expires_in || 3600) * 1000;
  try{
    localStorage.setItem('arlilia_session', JSON.stringify({
      access_token: auth.accessToken, refresh_token: auth.refreshToken,
      user_id: auth.userId, email: auth.email, expires_at: auth.expiresAt,
    }));
  }catch(e){}
}
function clearSession(){
  auth.accessToken = null; auth.refreshToken = null; auth.userId = null; auth.email = null; auth.expiresAt = 0;
  try{ localStorage.removeItem('arlilia_session'); }catch(e){}
}
// Returns 'ok' (refreshed), 'invalid' (Supabase explicitly rejected the
// refresh token — it's genuinely expired/revoked, session really is gone),
// or 'network' (couldn't even reach the server — a connectivity blip, not
// a reason to log anyone out).
//
// Supabase rotates the refresh token on every refresh, so the OLD one stops
// working the moment a refresh succeeds. Two things used to turn that into
// surprise logouts: (1) two refreshes racing each other (several requests
// 401-ing at once, or this tab and another/installed copy of the app), and
// (2) another tab having already rotated the token, leaving this tab holding
// a dead one. So refreshes are single-flight, and before giving up on a
// rejected token we check whether another tab saved a newer one.
let refreshInFlight = null;
function refreshSession(){
  if(refreshInFlight) return refreshInFlight;
  refreshInFlight = doRefreshSession().finally(()=>{ refreshInFlight = null; });
  return refreshInFlight;
}
async function doRefreshSession(){
  syncSessionFromStorage(); // pick up a newer token if another tab rotated it
  if(!auth.refreshToken) return 'invalid';
  const usedToken = auth.refreshToken;
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: usedToken }),
    });
    if(res.ok){
      const data = await res.json();
      setSession(data);
      return 'ok';
    }
    if(res.status === 400 || res.status === 401){
      // Rejected — but maybe only because another tab already used (and
      // replaced) this token a moment ago. If storage now holds a different
      // token, the session is alive: adopt it instead of logging out.
      syncSessionFromStorage();
      if(auth.refreshToken && auth.refreshToken !== usedToken && auth.expiresAt - Date.now() > 30 * 1000) return 'ok';
      return 'invalid';
    }
    return 'network';
  }catch(e){ return 'network'; }
}
// Re-reads the saved session so this tab never keeps using a refresh token
// that another tab has already replaced.
function syncSessionFromStorage(){
  try{
    const raw = localStorage.getItem('arlilia_session');
    if(!raw) return;
    const s = JSON.parse(raw);
    if(s && s.refresh_token && (s.expires_at || 0) >= (auth.expiresAt || 0)){
      auth.accessToken = s.access_token; auth.refreshToken = s.refresh_token;
      auth.userId = s.user_id; auth.email = s.email; auth.expiresAt = s.expires_at;
    }
  }catch(e){}
}
// Proactively renews the access token a few minutes before it expires, so
// the app rarely has to rely on the reactive 401-then-refresh path below —
// fewer round trips at exactly the moment the person wants to see data.
async function ensureFreshToken(){
  if(!auth.accessToken || !auth.refreshToken) return;
  if(auth.expiresAt - Date.now() > 5 * 60 * 1000) return;
  const status = await refreshSession();
  if(status === 'invalid') auth.sessionInvalid = true;
}
async function sbFetch(url, options){
  options = options || {};
  options.headers = sbHeaders(options.headers);
  let res = await fetch(url, options);
  if(res.status === 401 && auth.refreshToken){
    const status = await refreshSession();
    if(status === 'ok'){
      options.headers = sbHeaders(options.headers);
      res = await fetch(url, options);
    } else if(status === 'invalid'){
      auth.sessionInvalid = true;
    }
    // status === 'network': leave the original 401 as-is and keep the
    // session — a dropped connection isn't proof the login expired.
  }
  return res;
}
function translateAuthError(data, fallback){
  const raw = (data && (data.error_description || data.msg || data.error_code || data.error)) || '';
  const text = String(raw);
  const waitMatch = text.match(/after (\d+) seconds?/i);
  if(waitMatch) return `Слишком много попыток подряд — подождите ${waitMatch[1]} секунд и повторите.`;
  if(/already registered|user_already_exists/i.test(text)) return 'Этот email уже зарегистрирован — попробуйте войти.';
  if(/invalid login credentials/i.test(text)) return 'Неверный email или пароль.';
  if(/email not confirmed/i.test(text)) return 'Email ещё не подтверждён — проверьте почту (или попросите админа отключить подтверждение в Supabase).';
  if(/password.*at least|should be at least/i.test(text)) return 'Пароль слишком короткий — минимум 6 символов.';
  if(/invalid.*email|unable to validate email/i.test(text)) return 'Проверьте формат email.';
  if(/signup.*disabled|signups? not allowed/i.test(text)) return 'Регистрация сейчас отключена в настройках Supabase.';
  if(/network|failed to fetch/i.test(text)) return 'Нет соединения с сервером.';
  return text || fallback;
}
async function login(email, password){
  state.loginBusy = true; state.loginError = null; state.loginNotice = null; render();
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if(!res.ok){
      state.loginError = translateAuthError(data, 'Неверный email или пароль');
      state.loginBusy = false; render();
      return;
    }
    setSession(data);
    state.loggedIn = true;
    state.loginBusy = false;
    await loadAll();
    render();
  }catch(e){
    state.loginError = 'Нет соединения с сервером';
    state.loginBusy = false; render();
  }
}
async function signUp(email, password){
  state.loginBusy = true; state.loginError = null; render();
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if(!res.ok){
      state.loginError = translateAuthError(data, 'Не удалось создать профиль');
      state.loginBusy = false; render();
      return;
    }
    // Profile created — do NOT log the person in automatically. They
    // explicitly asked for registration and login to be separate steps.
    state.loginBusy = false;
    state.authMode = 'login';
    state.loginError = null;
    state.loginNotice = data.access_token
      ? 'Профиль создан! Теперь войдите с вашим email и паролем.'
      : 'Профиль создан! Проверьте почту и подтвердите email, затем войдите.';
    render();
  }catch(e){
    state.loginError = 'Нет соединения с сервером';
    state.loginBusy = false; render();
  }
}
function logout(){
  clearLocalUserData();
  clearSession();
  state.loggedIn = false;
  state.loaded = false;
  state.entries = []; state.journalEntries = [];
  render();
}

async function resetAllData(){
  if(!auth.userId) return;
  state.resetBusy = true; render();
  try{
    await sbFetch(`${SUPABASE_URL}/rest/v1/attempts?user_id=eq.${auth.userId}`, { method:'DELETE' });
    await sbFetch(`${SUPABASE_URL}/rest/v1/journal_entries?user_id=eq.${auth.userId}`, { method:'DELETE' });
    await saveStartDate(null);
    state.entries = [];
    state.journalEntries = [];
    lsSet(outboxKey(), []); lsSet(jPendKey(), {}); saveCache();
    state.confirmReset = false;
    state.resetBusy = false;
    showToast('Все данные сброшены — можно начинать заново');
    render();
  }catch(e){
    console.error(e);
    state.resetBusy = false;
    showToast('Не удалось сбросить данные — проверьте соединение');
    render();
  }
}

  {"id": "rules", "label": "Правила", "icon": "📌", "subtitle": "Режимы и ограничения", "items": [{"name": "Режим молчания", "group": "Режимы", "desc": "Правила на период режима молчания.", "lists": [{"title": "Нельзя", "items": ["говорить шёпотом", "говорить губами", "сильно жестикулировать", "издавать звуки: мычание и т. п.", "произносить гласные или слоги", "свистеть"]}, {"title": "Нужно", "items": ["больше смеяться", "снимать напряжение через плач, рычание"]}]}, {"name": "Сон", "group": "Общие правила", "desc": "", "lists": [{"title": "Нельзя", "items": ["в плохом состоянии идти спать"]}]}]},
  {"id": "body", "label": "1. Подготовка тела", "icon": "🧘", "subtitle": "Расслабление, разминка", "items": [{"name": "Упражнение 1. ОТМВ и МБАТ", "desc": "«ОТМВ» (осмотри тело мысленным взором) и «МБАТ» (массаж биологически активных точек), зевки. В завершении подумать о руках (в том числе о ладонях) и пусть руки запомнят расслабленное тело.", "group": "По занятию №1"}, {"name": "Упражнение 2. ОТМВ и узелки напряжения", "desc": "«ОТМВ», затем завязываем и развязываем узелки напряжения. В завершении подумать о руках (ладонях) и пусть руки запомнят расслабленное тело.", "group": "По занятию №1"}, {"name": "Упражнение 3. Прикладная релаксация", "desc": "Три этапа: сначала отдельные части тела, потом всё тело, потом расслабление по памяти.\n1-й этап. Напрягаем разные части тела (руки, ноги, живот, плечи, шею, челюсть), удерживаем напряжение, мысленно считая до 10, далее отпускаем (пробуем отпускать резко и (или) постепенно). Закрываем глаза и мысленно рассматриваем эту часть тела, наблюдая за ощущениями, изучая и запоминая их. Говорим себе мысленно: «ЗАПОМНИ!» (запомни, что значит расслабленные руки, ноги, шея, челюсть…).\nКогда напрягаем и расслабляем плечи, это прекрасная возможность почувствовать и запомнить позу ЧСД.\nОсобое внимание шее: она как шнурочек, как мягкий воск. Соединяем мягкую шею с движением большого пальчика, а движение большого пальца — с мягким опаданием челюсти. Когда появится речь, пробуем что-то произнести, наблюдая за свободной шеей, свободным телом и мягким опаданием челюсти.\n2-й этап. Вариант 1: напрягаем (зажимаем) всё тело. Можно собирать напряжение по порядку (руки, ноги, живот, грудь, плечи, шея, челюсть) или пойти от предполагаемого очага большего напряжения, наблюдая за его распространением, и собрать в узел всё тело. Удерживаем, мысленно считая до 10. Затем сбрасываем напряжение или отпускаем постепенно (пробуем оба варианта): постепенный вариант помогает наблюдать, как расслабление разливается по телу, заполняя каждый уголок, каждую клеточку. Говорим себе: «ЗАПОМНИ» (какое тело, когда оно отдыхает). Пробуем напрягаться подчёркнуто и незаметно и отпускать.\nВариант 2: упражнение «Водолазный костюм» — «спускаемся» через «Щелинку» и изучаем расслабляющий выдох.\n3-й этап. Вариант 1: расслабление по памяти. Начинаем не от сильного напряжения, а от позы излишне собранного, организованного, тревожного, ответственного, правильного человека, который боится что-то сделать не так, ошибиться. Затем отпускаем напряжение.\nВариант 2: спускаемся через «Щелинку», наблюдая, как тело обмякает и растапливается, и добавляем упражнение «Парфюмер» (без звука).", "group": "По занятию №1"}, {"name": "Точки опоры сидя", "desc": "Расслабление по памяти: почувствуем сиденье, как ноги стоят на полу, как руки лежат на бёдрах, как вы опираетесь на большой пальчик ведущей руки и как он приглашает тело к отдыху.", "group": "По занятию №1"}, {"name": "Ноги-ноги", "desc": "Расслабление по памяти: ноги-ноги, руки-руки, плечи-плечи, шея-шея, челюсть-челюсть, тело-тело, мысли-мысли. Мысленно, в строгой последовательности, произносим эти команды и вспоминаем ощущения расслабления.", "group": "По занятию №1"}, {"name": "Дерево", "desc": "Гимнастика-растяжка и точки опоры стоя. Сначала, перенося опору с одной ноги на другую, вдавливаем стопы в пол, затем останавливаемся и точно врастаем в пол, проверяем гибкость коленей и тела, расправляем плечи (как в прикладной релаксации), руки как пустые рукава. Потом тянемся в разные стороны, занимаем больше места в пространстве, проникаемся к себе любовью и уважением.\nЗапоминаем себя таким: устойчивым, гибким, открытым, глаза смотрят на мир тепло и доброжелательно, губы готовы к улыбке. С этими ощущениями пробуем упражнения для руки стоя. Когда уже можно говорить, пробуем что-то произнести стоя, осознавая свою устойчивость и гибкость.", "group": "По занятию №1"}, {"name": "Релаксация по Джекобсону", "sub": "Прогрессивная мышечная релаксация: напрячь — расслабить — запомнить ощущение", "desc": "Суть: поочерёдно напрягаем отдельные группы мышц, удерживаем напряжение, затем полностью расслабляем и внимательно наблюдаем разницу в ощущениях. Так учимся замечать зажимы в теле и отпускать их.\nУдобно сесть или лечь, закрыть глаза (или смягчить взгляд). Зубы разжаты, язык внизу, шея мягкая. Дышим спокойно.\nНапрягаем каждую группу мышц на 10–15 секунд. Напряжение сильное, но не болезненное; остальное тело при этом остаётся расслабленным, дыхание не задерживаем.\nЗатем резко отпускаем напряжение и расслабляемся на 20–30 секунд. Ловим ощущение тела: тепло, тяжесть, покалывание, мягкость. Фиксируем это состояние расслабления и запоминаем его.\nПереходим к следующей группе мышц. В конце проходим по всему телу мысленно и убеждаемся, что везде есть расслабление.", "note": "Порядок групп мышц: кисти и предплечья → плечи → лоб → глаза → челюсть и губы → шея → грудь и спина → живот → ягодицы и бёдра → голени → стопы.\nЧем лучше получается, тем крупнее группы: можно объединять мышцы, а потом расслаблять всё тело сразу, без предварительного напряжения.", "errors": ["напрягаются лишние мышцы (например, лицо, когда напрягаем кисть)", "напряжение слишком слабое или, наоборот, до боли", "задержка дыхания во время напряжения", "расслабление торопливое: сразу переходим дальше, не успев поймать ощущение", "напряжение держится меньше 10 секунд", "расслабление неполное: плечи подняты, челюсть сжата, зубы сомкнуты"], "group": "Расслабление"}, {"name": "Тянемся", "desc": "Тянемся руками вверх, в стороны.", "note": "После упражнения сбрасываем руки вниз и болтаем руками и ногами.", "group": "Разминка"}, {"name": "Перекаты", "desc": "Перекатываемся с пятки на носок и обратно, балансируем.", "note": "Всё делать легко, ощущать свободу в теле.", "group": "Разминка"}, {"name": "Свободное движение", "desc": "Двигаемся из стороны в сторону грациозно.", "note": "Как будто внутри стержень, верхняя часть туловища свободная. Поворачиваемся, двигаемся.", "group": "Разминка"}, {"name": "Круговые движения головы", "desc": "Голову мягко и аккуратно вращаем по кругу.", "note": "Сначала в одну сторону, потом в другую.", "group": "Разминка"}, {"name": "Сжимаем лопатки", "desc": "Сжимаем лопатки на несколько секунд, затем отпускаем.", "note": "После делаем сброс со звуком «ссс».", "group": "Разминка"}, {"name": "Плечи к ушам", "desc": "Держим плечи к ушам, затем отпускаем.", "note": "После делаем сброс и снова зажимаем.", "group": "Разминка"}, {"name": "Пружинка", "desc": "Как бы приседаем в очень маленькой амплитуде, как пружинка.", "note": "Верхняя часть туловища свободная.", "group": "Разминка"}, {"name": "Моем полы", "desc": "Наклоняемся и делаем вид, что моем полы.", "note": "Размашистыми, старательными движениями делаем вид, что моем пол.", "group": "Разминка"}, {"name": "Циркуль", "desc": "Руки над головой вместе, ноги вместе, тянемся вверх как можно выше.", "note": "Не отрываем пятки от пола, тянемся вверх, потом хлопок и сброс.", "group": "Разминка"}, {"name": "Открываем тело", "desc": "Ноги, руки расставили в стороны максимально широко, затем хлопок.", "note": "Тянемся в стороны как можно шире. В конце сброс с шумным выдохом.", "group": "Разминка"}, {"name": "Зародыш", "desc": "Ложимся на пол в позу зародыша, одна нога вытянута, другая согнута прижата к животу. Руки под голову.", "note": "Лежим расслабляемся. Ощущение расслабления.", "group": "Разминка"}, {"name": "Бег на месте", "desc": "Присесть, скукожиться, напрячь плечи и руки и быстро бежать на месте.", "note": "Максимально ускориться на месте в таком состоянии, затем встать и расслабиться.", "group": "Разминка"}, {"name": "Ноги на полу", "desc": "Ложимся на спину, сгибаем ноги в коленях на весу, затем трясём вверх-вниз ноги. Затем по кругу в одну, потом в другую сторону.", "note": "Колени согнуты, не вытягивать ноги.", "group": "Разминка"}, {"name": "Голова на полу", "desc": "Так же лежим на спине, голову крутим по сторонам, затем тянем подбородок к туловищу.", "note": "Всё делаем лёжа, вытянувшись.", "group": "Разминка"}, {"name": "Плечи", "desc": "Вращаем плечами вперёд-назад.", "note": "Стоим ровно, вращаем плечами.", "group": "Разминка"}, {"name": "Поясница", "desc": "Стоим, одну руку отвели назад, мягко смотрим, затем вернули обратно и так же другую руку.", "note": "Делаем всё мягко и аккуратно, не спешим.", "group": "Разминка"}, {"name": "Голова", "desc": "Вращаем голову по кругу.", "note": "Мягко вращаем голову в одну сторону, потом в другую.", "group": "Разминка"}, {"name": "Позвоночник", "desc": "Стоя наклоняемся вниз, голова прижата к туловищу, затем так же ровно выпрямляемся. Руки вниз тянутся всегда. Внизу 3 вдоха и 3 выдоха.", "note": "Стараемся как можно ближе к телу подняться, как будто находишься в очень узком месте.", "group": "Разминка"}, {"name": "Конь", "desc": "Ноги широко расставили, как будто сели на коня, руки на поясе, большой палец смотрит вперёд. Стоим дышим. Затем сброс, болтаем руками и ногами.", "note": "Все чакры открываются, идёт энергия.", "group": "Разминка"}]},
  {"id": "articulation", "label": "2. Подготовка артикуляции", "icon": "👄", "subtitle": "«Щелинка»", "intro": [{"title": "Исходное положение артикуляции", "text": "Расслабленная («Щелинка»): язык на дне рта (кончик за нижними резцами), зубы разжаты, губы приоткрыты и готовы к улыбке."}], "items": [{"name": "Формирование «Щелинки»", "desc": "Помогают упражнения:\nоттянуть (с напряжением) нижнюю челюсть и подержать, мысленно считая до 10, потом отпустить;\nзевок;\nпальчики поставить на место соединения верхней и нижней челюсти и попробовать отпустить нижнюю челюсть до появления межчелюстной ямки;\nпотренировать свободное опадание челюсти (палец под нижней губой или пальчики «проваливаются» между зубами);\nбольшой пальчик приглашает челюсть свободно опадать.", "group": "По занятию №1", "note": "Когда появится речь, пробуем что-то произнести, наблюдая за расслабленной артикуляцией («щелиной») и свободным опаданием челюсти. Сначала молча, затем шёпотом, затем со звуком; сидя, стоя, в движении; на поролоне и на бедре."}, {"name": "Пробка", "desc": "Зажимаем пробку (или похожий небольшой предмет) зубами и в этом положении проговариваем разные слова.", "note": "Рот и артикуляция работают шире обычного — именно это и тренируем.", "group": "Дополнительно"}]},
  {"id": "breath", "label": "3. Подготовка дыхания", "icon": "🌬️", "subtitle": "Низкое дыхание, расслабляющий выдох", "items": [{"name": "Зевок", "desc": "Громко зеваем, затем средне, затем тихо. Так по кругу.\nНаблюдаем, как зевок расслабляет не только артикуляцию, но и открывает глотку, распускает живот: зевок освобождает (восстанавливает) дыхание, а значит голос. Речь — это просто озвученный выдох.", "group": "По занятию №1", "note": "Зеваем громко, затем средне и тихо."}, {"name": "Театральный зевок", "desc": "Театральный зевок и выход на «Верхушку».", "group": "По занятию №1", "note": "Важно делать неторопливо."}, {"name": "Речевой выдох", "desc": "«Сдуваемся» через «Щелинку».", "group": "По занятию №1"}, {"name": "Парфюмер (без звука)", "desc": "Тренирует расслабляющий выдох. Начинаем от театрального зевка, в момент которого указательным пальцем проводим под носом, выходим на «Верхушку» и сразу, без задержки, «сдуваемся» через «Щелинку».", "group": "По занятию №1"}, {"name": "Другие упражнения блока", "desc": "Потренировать мышцы живота (плечи на месте).\nПодышать низко в позе мыслителя.", "group": "По занятию №1", "note": "Подробные описания добавим по мере занятий."}, {"name": "Ноздри", "desc": "Вдох через одну ноздрю, выдох через другую, через неё же вдох и так по кругу.", "note": "Не напрягаемся.", "group": "Дополнительно"}, {"name": "Поглаживание носа", "desc": "Вдыхаем ртом, затем выдыхаем носом и руками проглаживаем нос сверху вниз.", "group": "Дополнительно"}, {"name": "Счёт", "desc": "Произносим счёт от 1 до 10, давя руками на живот.", "note": "Давим руками на живот, чтобы работала диафрагма при каждом произнесении числа.", "group": "Дополнительно"}]},
  {"id": "voice", "label": "4. Подготовка голоса", "icon": "🗣️", "subtitle": "Голосовые упражнения", "items": [{"name": "Парфюмер (со звуком)", "desc": "Тренирует озвученный расслабляющий выдох. Начинаем от театрального зевка, в момент которого указательным пальцем проводим под носом, выходим на «Верхушку» и сразу, без задержки, «сдуваемся» со звуком через «Щелинку».", "group": "По занятию №1", "note": "Речь — спокойный, неторопливый, расслабляющий, озвученный выдох."}, {"name": "Другие упражнения блока", "desc": "«Рождение гласного звука», «Убаюкиваем гласные», «Волна», «Вибрационный массаж», «Мом», «Домик для гласного звука» и др. Также пение с использованием нижнереберного диафрагмального дыхания, с сильными долями (на начало и акцент) и на одном выдохе, который расходуется экономно.", "group": "По занятию №1", "note": "Подробные описания добавим по мере занятий."}, {"name": "Мом", "desc": "Протяжно произносим «моммммм», вытягивая и удерживая последний звук до конца выдоха.", "note": "Звук ровный, без толчков и рывков — тянем плавно, пока хватает дыхания.", "group": "Основные"}, {"name": "Раскачка гласных", "desc": "Берём один гласный звук и плавно «раскачиваем» его голосом: ааа — ааа — ааа. Проходим так все шесть гласных по очереди: А, О, У, И, Ы, Э.", "note": "Звук как качели — покачиваем, а не толкаем. Переходим к следующему гласному только когда первый получается свободно.", "group": "Основные"}, {"name": "Зародыш урчит", "desc": "Ложимся в позу зародыша и урчим.", "note": "Грубо говоря, храпим с разными регистрами: низкий, средний, высокий. Расслабляемся, запоминаем внутренние ощущения.", "group": "Голосовые упражнения"}, {"name": "Звучим на спине", "desc": "Ложимся на спину, согнули ноги, делаем сброс воздуха звуком. Трясём ногами на звуке.", "note": "Издаём разные звуки (О, А, У, И, Ы, Э).", "group": "Голосовые упражнения"}, {"name": "Голос в подвал", "desc": "Ложимся на живот, голову на руки перед собой. Язык вытягиваем к мягкому нёбу, издаём звук.", "note": "Рот прикрыт, стараемся сделать самый низкий звук. Звучим так по кругу несколько раз.", "group": "Голосовые упражнения"}, {"name": "Расширяем звук голоса", "desc": "Ложимся на спину, руки на голову, издаём звук ДНДНДН. Затем звуки ИЭОИЭОИЭО. Затем звук УУУУУУ.", "note": "Издаём звук, лежим расслабленно. Звук «У» выводим в уши мысленно. Рот закрыт.", "group": "Голосовые упражнения"}, {"name": "Фонтан", "desc": "Ложимся на спину, вдыхаем на 2 секунды, затем 16 раз болтаем животом вверх-вниз, затем на 4 счёта выдыхаем.", "note": "Никакого звука нет и дыхания. Работают только мышцы.", "group": "Голосовые упражнения"}, {"name": "МэЛэ на полу", "desc": "Лёжа на полу сгибаем ноги на весу, издаём звуки ММ, ЛЛ.", "note": "Работаем животом, ногами не болтаем.", "group": "Голосовые упражнения"}, {"name": "Сдираем липучку с тела", "desc": "Сидим на полу, как будто снимаем с тела что-то прилипшее.", "note": "Вспоминаем свои мышцы и ощущения. Проминаем своё тело.", "group": "Голосовые упражнения"}, {"name": "Согреваем руки", "desc": "Трём руки друг о друга, затем тёплым воздухом дуем на руки. Как будто замёрзли, затем произносим низкое «О» на руки продолжительно.", "note": "Удлинить выдох.", "group": "Голосовые упражнения"}, {"name": "Кувшин с молоком", "desc": "Ложимся в позу зародыша, издаём гласные звуки, как будто выливается молоко.", "note": "Как будто молоко выливается, булькает.", "group": "Голосовые упражнения"}, {"name": "Скороговорки на стуле", "desc": "Садимся на стул, разворачиваемся, кладём одну руку на спинку стула, вторую на живот, ноги ровно. Читаем стихи, толкая спинкой живота.", "note": "Произносим как скандируем (как «на пи-шу-щей ма-шин-ке...»).", "group": "Голосовые упражнения"}, {"name": "Водичка во рту", "desc": "Представляем, как будто водичка во рту, издаём звук в пол, одиночный, как бросок (Хммм).", "note": "Губы не сжимаем, всё тело расслаблено. Рот закрыт.", "group": "Голосовые упражнения"}, {"name": "Гудим", "desc": "Гудим на звуке «О».", "note": "Рот закрыт, прямой хороший звук.", "group": "Голосовые упражнения"}, {"name": "Жуем звук", "desc": "Делаем предыдущее упражнение, только жуём звук.", "note": "Тело расслаблено.", "group": "Голосовые упражнения"}, {"name": "Гитара", "desc": "Тянем за кончик носа, как будто играем на гитаре, издаём звук «О» с закрытым ртом.", "note": "Всё свободно, расслабленно.", "group": "Голосовые упражнения"}, {"name": "Мяч", "desc": "Бросаем невидимый мяч со звуком. Разбежались и бросили.", "note": "Со звуком «ЭЭЭЭХ».", "group": "Голосовые упражнения"}, {"name": "Ленточки", "desc": "Со звуком вытягиваем невидимые ленточки из носа.", "note": "Легко, выводим звук на губы.", "group": "Голосовые упражнения"}, {"name": "Раскачиваем гласные (ребёночек)", "desc": "Взяли невидимого ребёнка на руки и из стороны в сторону качаем его со звуками (гласными) АААА, ОООО, УУУУ и т.д.", "note": "Как будто качаем ребёночка из стороны в сторону.", "group": "Голосовые упражнения"}, {"name": "Подбрасываем ребёночка", "desc": "Руки немного вытянуты перед собой, как будто на руках лежит ребёночек, мы его раскачиваем, затем подбрасываем и ловим. С гласными ААААА-А, ОООО-О.", "note": "Как будто ребёнок — в момент подбрасывания звук гласной как при броске.", "group": "Голосовые упражнения"}, {"name": "Ромашка и малина", "desc": "Поднимаем руки вверх через стороны со словом «РАААА», потом сброс и наклоняемся вниз со звуком «МАШКА», точно так же «МАЛИНА».", "note": "После сброса делаем снова по несколько раз.", "group": "Голосовые упражнения"}, {"name": "Канат", "desc": "Стоим ровно, как будто держимся за канат и дёргаем его со звуком «ЭэЭэ».", "note": "Ноги полусогнутые, трясём звук.", "group": "Голосовые упражнения"}, {"name": "Обезьянки (авторское)", "desc": "Наклоняемся немного, как обезьянки, и издаём звук — по типу упражнения «Канат».", "note": "Так же со звуком, только в согнутом положении.", "group": "Голосовые упражнения"}, {"name": "БРАБРОБРЫ", "desc": "Произносим БРА БРО БРУ БРЫ с разной интонацией, задаём вопрос, отвечаем.", "note": "Как будто общаемся на БРА БРЭ БРЫ БРО БРУ.", "group": "Голосовые упражнения"}, {"name": "ДА ДО ДУ ДЫ", "desc": "Как будто распеваем ДА ДА ДА ДА, ДО ДО ДО ДО.", "note": "Как будто пропиваем (нараспев).", "group": "Голосовые упражнения"}, {"name": "Скороговорки", "desc": "Произносим скороговорки с интонацией.", "note": "Закрепляем хороший голос.", "group": "Голосовые упражнения"}, {"name": "Лоб", "desc": "Издаём звук и постукиваем себя по лбу.", "note": "От середины к вискам.", "group": "Вибрационный массаж"}, {"name": "Губы", "desc": "Верхняя губа — ВВВВВ. Нижняя губа — ЗЗЗЗЗ.", "group": "Вибрационный массаж"}, {"name": "Грудь", "desc": "Стучим по груди, как Кинг-Конг.", "note": "Не сильно.", "group": "Вибрационный массаж"}, {"name": "Рёбра", "desc": "Стучим ребром кисти по рёбрам.", "group": "Вибрационный массаж"}, {"name": "Пах", "desc": "В паховых ямках стучим.", "group": "Вибрационный массаж"}, {"name": "Живот", "desc": "Стучим по животу.", "group": "Вибрационный массаж"}, {"name": "Спина", "desc": "Попросить кого-то постучать по спине, по лопаткам и позвоночнику.", "note": "Нужен помощник, кто может постучать по спине.", "group": "Вибрационный массаж"}]},
  {"id": "hand", "label": "5. Подготовка руки к речи", "icon": "✋", "subtitle": "Упражнения для руки", "intro": [{"text": "Каждое упражнение сначала изучаем с открытыми глазами, наблюдая за движениями пальцев, далее пробуем с закрытыми глазами (с мысленным взором), далее с открытыми (учимся выполнять упражнения глядя на что-то, кого-то и мысленно наблюдаем за правильными движениями) сначала на поролоне, а далее на бедре, далее не только сидя, но и стоя."}, {"text": "Важно, чтобы руки были расслаблены. Освободить руки от скованности помогут упражнения для расслабления кистей рук и плеч."}, {"title": "Исходное положение артикуляции", "text": "Расслабленная: язык на дне рта, зубы разжаты, губы приоткрыты."}, {"title": "Исходное положение шеи", "text": "Мягкая, как шнурочек, как мягкий воск, пластилиновая."}, {"title": "Исходное положение руки", "text": "Рука тяжёлая, плечо опущено, кисть расслабленная: округлая, пальчики стоят на подушечках, между пальчиками просветы, сами пальчики точно варёные макаронинки."}], "items": [{"name": "Упражнение 1. «Опираюсь-отпускаю»", "sub": "Для большого пальца ведущей руки", "desc": "Перед началом выполнения упражнения подумать (мысленно найти) руку, кисть руки и далее подумать о теле. Оно отдыхает и значит плечи опущены, язык внизу за нижними резцами, зубы разжаты, шея мягкая, лень шевелить ногами и руками.\nПодумаем о большом пальчике, он нашёл себе основание.\nДалее большой палец начинает плавно, неторопливо и в то же время уверенно погружается в ямку и достигает твёрдой поверхности. Большой пальчик не только надавливает, мы на него опираемся, и пальчик точно говорит: «успокаиваюсь» (важно определить скорость движения пальца, когда он успокаивает, и всегда сохранять эту скорость). Одновременно другие пальчики разлетаются над поролоном лёгким мягким веером.\nДостигнув твёрдой поверхности стола (бедра), большой пальчик сразу возвращается в исходное положение (это напоминает пружинку, когда большой палец оттолкнулся от твёрдой поверхности и без усилий возвращается. Остальные пальчики возвращаются в исходное положение вместе с ним. Возвращаются так же, без усилий, по инерции). Вместе с пальцами отпускается тело.\nДалее подумаем о руке и подумаем о теле. Тело отдыхает и значит плечи опущены, зубы разжаты, шея мягкая, лень шевелить ногами и руками.", "errors": ["в исходном положении рука не округлая, а плоская", "в исходном положении рука заваливается на бок", "в исходном положении пальцы собраны в кучку (между ними должны быть просветы)", "в исходном положении большой палец согнут (он должен быть прямой)", "в исходном положении большой палец смотрит в сторону, а не на указательный", "большой пальчик и указательный расположились далеко друг от друга (они должны быть рядом)", "надавливанию пальца помогает плечо", "пальчик давит, а не надавливает", "палец начинает движение торопливо и погружается в поролон (нажимает) резко. Верно, когда начало движения большого пальца очень вкрадчивое", "пальчик погружается в ямку с разной скоростью", "большой палец не достигает твёрдой поверхности", "есть только надавливание большого пальца, нет опоры на него", "веер напряжённый", "разъезжаясь и собираясь, пальцы оказываются не в полёте, а скользят по поролону", "большой пальчик задержался в ямке", "веер возвращается в исходное положение не по инерции, а с усилием", "веер в своём раскрытии замирает (останавливается), а должен сразу после раскрытия возвращаться в исходную позицию"], "group": "По занятию №1"}, {"name": "Упражнение 2. «Пианино»", "sub": "Считаем про себя: один, два, три, четыре, пять, четыре, три, два", "desc": "Начало, как в Упражнение 1, но, когда разлетевшиеся пальчики возвращаются в исходное положение на поролон, рядом с первым опускается только указательный пальчик, а остальные остаются над поролоном на высоте примерно 1 см. Как только второй коснулся поролона и встретился на нём с большим пальчиком, тот тоже отрывается от поролона (второй палец отпускает первый).\nДальше ставим третий пальчик, он встречается со вторым и дальше третий разрешает второму оторваться от поролона (или бедра).\nТак каждый последующий пальчик отпускает предыдущий. Есть момент встречи двух пальчиков и дальше на поролоне остаётся один пальчик.\nПосле выполнения упражнения рука занимает исходное положение, и мы думаем о руке и отдыхаем (проверяем, что зубы разжаты, шейка мягкая, плечи опущены, лень шевелить ногами и руками).", "note": "Важно! Нажимает только первый пальчик. Остальные просто ставятся на поролон, не оставляя ямок.\nВажно! Мысленный счёт должен быть одновременно или вслед за пальцем, не раньше, чем палец коснулся поролона.", "errors": ["пальцы прыгают (нет момента встречи), а не здороваются (момент встречи)", "в пальцах есть напряжение", "слишком высоко поднимаются вверх (они живут у самого поролона)", "пальчики приземляются не на исходную позицию, а вытягиваются и оказываются вытянутыми, а не округлыми", "пальчики (кроме первого) оставляют ямки (они должны только вставать на поролон)", "плечо помогает движению пальцев"], "group": "По занятию №1"}, {"name": "Упражнения 3–12. Дальнейшие шаги", "desc": "Упражнение 3. «Любой пальчик: опираюсь-отпускаю».\nУпражнение 4. «5 медведей» — цель: первый слог и акцент с голосом на опоре.\nУпражнение 5. «5 медведей с эмоциями»: помним предыдущие шаги и добавляем эмоции.\nУпражнение 6. «6 медведей, 7…».\nУпражнение 7. Переходим на два пальчика (первый и третий).\nУпражнение 8. Третий палец заменяем ладонью.\nУпражнение 9. Третий палец заменяется ритмическими, указательными и изобразительными жестами.\nУпражнение 10. Большой палец заменяется движением по представлению.\nУпражнение 11. Большой палец заменяется ритмическим жестом и взглядом.\nУпражнение 12. Большой палец заменяется взглядом.\nУпражнение 13. Речь с контролем состояния тела.", "group": "По занятию №1", "note": "В каждом упражнении, начиная с Упражнение 3, контролируем состояние тела. Нумерация приведена по порядку (в исходном документе есть повтор «Упражнение 9»)."}]},
  {"id": "handvoice", "label": "6. Озвучивание руки", "icon": "🎙️", "subtitle": "Гласные, согласные, слитность, интонация", "intro": [{"text": "Важно: большой палец — командир, он запускает речь и приглашает к расслаблению! Каждое упражнение сначала с закрытыми глазами, потом с открытыми; учимся сидя, стоя и далее в движении."}], "items": [{"name": "Упражнение 1. Гласные", "desc": "Шесть гласных звуков: А, О, У, Э, И, Ы.\nПроизносим по схеме: зрительный контакт (ЗК) или мысленный взор (МВ), подумать о руке (рука — скульптор тела), внимание к большому пальцу, который нашёл себе нужное основание. После того как большой палец дождался «Верхушки», он тут же неторопливо запускает речь. Голос рождается на «Щелинке» (гудим на «Щелинке» вниз — расслабляющий выдох). Дальше палец погружается в ямку и вместе с ним опадает челюсть, затем сразу отпускаем палец из ямки и вместе с ним шею, челюсть, живот, голос. Голос снова возвращается на «Щелинку» (гудим), рука отпускается (занимает исходное положение), тело обмякает.\nМожно разбить постановку гласных на этапы и потом сложить вместе:\n1) БП — опираюсь-отпускаю («пружинка»);\n2) сосредоточиться на низком дыхании;\n3) БП дожидается «Верхушки» и от неё начинает неторопливое движение;\n4) потренировать расслабление шеи: БП дожидается «Верхушки», начинает движение и расслабляет шею;\n5) потренировать мягкое опадание челюсти: БП дожидается «Верхушки», начинает движение, расслабляет шею и опускает челюсть. Возвращается палец, и с ним живот, шея, челюсть;\n6) «Парфюмер» — расслабляющий выдох на «Щелинке»: БП начинает от «Верхушки», запускает выдох, расслабляет шею;\n7) «Парфюмер» с озвученным выдохом на «Щелинке»;\n8) «Парфюмер с пружинкой»: БП начинает от «Верхушки», запускает озвученный расслабляющий выдох, расслабляет шею, отталкивается и дальше отпускает голос, живот, шею.\nДалее — гласные с опаданием челюсти.", "group": "По занятию №1", "errors": ["на вдох поднимаются плечи и голова", "вдох заметный", "замирание на «Верхушке» (верно: как только почувствовали «Верхушку», сразу, без промедления начинаем звучать на «Щелинке», направляя озвученный выдох вниз)", "гудим на «Щелинке» вперёд, а нужно вниз", "голос царапает глотку — важно вывести его вперёд к губам, голос звонкий", "придыхание перед звучанием", "голос появился раньше пальца", "палец уже в ямке и только потом появляется голос", "слабое надавливание большого пальца: он должен погружаться в ямку спокойно и уверенно до твёрдой поверхности стола, тянуть за собой голос и находить голосовой низ (низкий голос)", "нет опадания челюсти (когда палец погружается в ямку)", "нет отпускания: взял голос и отпустил, и он не обрывается, а продолжает жить — это наша «пружинка»", "слабый выдох: нужно оттолкнуться с усилием, тогда пружинка легко появится сама", "голос не вернулся на «Щелинку»"]}, {"name": "Упражнение 2. Слова на гласные", "desc": "Слова на гласные с ударением на первый слог, второй, третий… (на всех известных языках и тех, которые в процессе освоения).", "group": "По занятию №1", "note": "Следим, чтобы второй пальчик заканчивал первый гласный и начинал второй (перетекание из одного гласного в другой) и т. д."}, {"name": "Упражнение 3. Согласные", "desc": "На всех известных языках и тех, которые в процессе освоения. Сначала исследуем одну из групп согласных (они объединены по сходству артикуляционного уклада). Групп семь: б п м; в ф; д т н; г к й х; з с ц; ж ш ч щ; л р.\nПоленимся согласному: рассмотрим две части — смычку и голос. Смычка — точка, голос — линия. Голоса больше. В согласном живёт гласный — начало того гласного, который за ним следует. Согласный потому так и называется: «со-гласный», «с гласной». Он согласен быть не главным: без гласной его нет, а гласные образуют слог. Чтобы смычка была небольшой, начинаем от «Щелинки» и большим пальцем нащупываем гласный, который живёт в согласном.\nПробуем произносить слова на согласные сначала с ударением на первый, второй, третий… слоги, затем фразы. Сколько слогов (гласных) — столько пальцев. Рука «пишет речевой диктант».", "group": "По занятию №1"}, {"name": "Упражнение 4. Слитность", "desc": "Речь — это не движение слов, это движение слогов! Но слоги бывают закрытыми. Верное озвучивание руки, когда каждый следующий пальчик заканчивает предыдущий гласный и начинает новый, помогает научиться слитному произношению. Важно научиться открывать слоги, чтобы речь текла как река и перетекала из одного гласного в другой.\nОбязательно пробуем письменно подготовить для лёгкого произношения несколько отрезков. Хорошо разобрать скороговорку на выбранный звук или придумать комбинации, где много закрытых слогов.", "group": "По занятию №1"}, {"name": "Упражнение 5. Ювелир-парфюмер", "desc": "Работа со слоговой таблицей.", "group": "По занятию №1", "note": "Подробное описание добавим по мере занятий."}, {"name": "Упражнение 6. Интонация", "desc": "«Активный слушатель»; игра «Актёр-режиссёр»; меняем акценты местами, пробуем вопросительную интонацию; формируем образы за акцентами; распространяем фразы.\nРабота с текстом: интонационная разметка с помощью, затем самостоятельно. Краткие и подробные пересказы текстов. Заучивание и рассказывание стихов, анекдотов, притч, интересных фактов.", "group": "По занятию №1"}, {"name": "Упражнение 7. Импровизация", "desc": "Учимся распространять ответы на неожиданные вопросы. Импровизированные пересказы. Учимся превращать прочитанное в беседу и брать интервью: видеть и слышать собеседника, живо реагировать на его реакции и реплики, произносить то, что точно соответствует данной речевой ситуации.", "group": "По занятию №1"}, {"name": "Колпак", "desc": "Сжимаем кулак и аккуратно подносим его ко рту, как будто «надеваем колпак». Делаем вдох и на выдохе произносим по очереди: «колпак», «на колпаке», «под колпаком», «колпак».", "note": "Артикуляция вокруг кулака утрированная, каждая фраза — на одном выдохе.", "group": "Основные"}, {"name": "Слова звуками", "desc": "«Произносим слова», используя вместо них пары гласных звуков — «А-О», «У-И» и так далее — запуская каждую пару рукой, как в речевом ритуале.", "note": "Тренируем само включение речи через руку, а не конкретные слова — рука ведёт звук, а не наоборот.", "group": "Основные"}, {"name": "Закрытые слоги", "desc": "Произносим открытые слоги на руке: МО МА МЭ МИ МЫ. Затем ММА ММО ММУ ММЫ. Затем МИМОЗЫ МИЛА МАМЕ КУПИЛА.", "note": "Не давим, спокойно. Играем с ударением на слогах. Произносим с разным ударением.", "group": "Основные"}]},
  {"id": "syllables", "label": "7. Слоги и слова", "icon": "🔤", "subtitle": "Слоги, гласные, слова по согласным", "items": [{"name": "Говорим слогами, не словами", "group": "Слоги", "desc": "Каждый слог заканчивается на гласную, на ней и ставим палец.\nСогласная внутри слова уходит к следующему слогу. Только в самом конце слова слог может закончиться на согласную.\nСогласные, которые «утонули» в слоге, пишем в скобках.", "note": "Паспорт — пА-(с)парт\nПочта — пО-(ч)та\nПолка — пО-(л)ка\nАвгуст — А-(ф)густ\nОстров — О-(ст)раф"}, {"name": "Разбор имён и слов на слоги", "group": "Слоги", "desc": "Произнесите каждое слово слогами, палец на каждый гласный. Заглавная буква — акцент.\nДиана — ди-А-на\nАнастасия — а-на-(с)та-Си-я\nАлександр — а-ли-(к)сАндр\nТатьяна — та-(ть)Я-на\nБогдан — бА-(г)дАн\nДенис — дИ-нИс", "note": "Знать ударения заранее не нужно — со временем это приходит само."}, {"name": "Безударные гласные", "group": "Слоги", "desc": "Без ударения О звучит как А, Е — как И.\nва-дИ-тель, фи-нАл, ва-гОн, ви-сЕ-лый, ва-лЕ-(н)си-я.\nДомик всегда на первый слог и на акцент.", "note": "Как звучат остальные безударные гласные и согласные — уточнить у логопеда."}, {"name": "Фразы по слогам", "group": "Слоги", "desc": "Слова в фразе тоже говорим слогами. Если следующий слог начинается с гласной, это новый слог. Предлоги В и К прикрепляются к слогу.\nВот и всё — во-ты-всЕ\nВам привет — ва-(м)при-вЕт\nВоз овса — во-зо-(в)сА\nКонь ел овес — все по слогам", "note": "В фразе длиной в выдох всегда один слог главный. Первый акцент — мягкий вход в речь, второй — по смыслу фразы."}, {"name": "Связки гласных", "group": "Гласные", "desc": "Две гласные произносятся слитно, первая выделяется (заглавная буква — ударная).\nПары: Аи, Оы, Уэ, Эа, АО/Ао, УИ/Уи, ЭА/Эа\nТройки: Аоу, ИУы, ЭИо, Иуэ, Оиы, ОЫа, Уао, АоУ, ИуЫ, ЭиО", "note": "Щелинку делайте подольше. Гласные И и Ы — челюсть не открываем."}, {"name": "Утренняя разминка гласных", "group": "Гласные", "desc": "Утром по 20 раз синхронно с рукой: И, Ы, А, О, У, Э.\nСначала звуки на выдох, затем слоги на выдох, затем фразы на выдох.", "note": "Можно с закрытыми глазами — так крепче связь руки и голоса."}, {"name": "Имена с рукой", "group": "Гласные", "desc": "Произносим одно-двухсложные имена гласными, палец на каждый гласный: Аня, Оля, Уля, Эля, Ира, Ива.\nСлоги появляются из-под пальца, как клавиши пианино."}, {"name": "Ряд гласных: па по пу пэ пы пи", "group": "Гласные", "desc": "Согласная П, затем ряд гласных: па, по, пу, пэ, пы, пи. Палец запускает гласную, которая идёт за согласной.\nСлоги с ударением на конце: спА, шкА, лвА."}, {"name": "Слова на М, П, Б", "group": "Слова по согласным", "desc": "Сначала односложные и двусложные слова, потом слова с закрытым слогом.\nБарт, Порт, Борт, Парк.\nПробуйте придумывать свои слова на эти согласные и отвечать на неожиданные вопросы («какие слова знаешь на М, П, Б?»)."}, {"name": "Слова на В и Ф", "group": "Слова по согласным", "desc": "Короткие, один слог: век, вес, вол, вал, вид, воз, вор, фон, фен, фас.\nДве согласные в конце: волк, воск, фейк, факт, фарт, финт.\nДве согласные в начале: вход, враг, врач, взгляд, взрыв, вкус, флот, флаг, фрахт, фрукт, флюс.\nДлиннее: воздух, время, ветер, волна, фонарь, фильм, фонтан, фигура, фантазия, финал."}, {"name": "Слова на Д, Т, Н", "group": "Слова по согласным", "desc": "Слова на слоги с акцентом:\nда-рО-га, ди-кта-фОн, дра-ва-сЕк, двИ-га-тель, на-чА-(ль)ство, твО-(р)чи-(ст)ва, на-стО-(й)чи-вый, ди-ма-(к)рА-ти-я, ти-ра-ми-сУ, нО-ва-сти, на-сЫ-щи-ный.", "note": "Д, Т, Н — язык в нижнем положении."}, {"name": "Слова на Г, К, Й, Х", "group": "Слова по согласным", "desc": "Й смягчает согласные.\nйОш, кИль, клЕн, кОт, грЕк, гОл, гОд, грОм, гАм.\nга-мАк, гу-дЕть, го-рОх, ка-бАн, ко-вЁр, ко-нЕц, ха-лАт, хо-лОд, хи-трЕц, ходИть, ху-дОй, хо-рИст."}, {"name": "Пословицы по слогам", "group": "Фразы и практика", "desc": "Читайте вслух слогами, палец на каждом слоге:\nВ тесноте, да не в обиде — фти-сна-тЭ, да-ни-ва-б
