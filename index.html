const SILENT_LABEL = 'Режим молчания';
const RITUAL_ITEMS = ['Зрительный контакт','Доброжелательный взгляд','Отомри','Щелинка'];
const RITUAL_PREFIX = 'Ритуал: ';
const START_PREFIX = 'Начало речи: ';
const TONE_PREFIX = 'Тон голоса: ';
// ritual_note holds (no DB change needed): optional line «Режим молчания»,
// optional line «Ритуал: a, b», then the free-text description.
function parseRitual(ritual, note){
  let silent = false, items = [], speechStart = [];
  let rest = typeof note === 'string' ? note : '';
  if(rest === SILENT_LABEL || rest.startsWith(SILENT_LABEL + ': ')){ // older one-line format
    silent = true; rest = rest.slice(SILENT_LABEL.length).replace(/^: /, '');
  } else {
    const lines = rest.split('\n');
    if(lines[0] === SILENT_LABEL){ silent = true; lines.shift(); }
    if(lines[0] && lines[0].startsWith(RITUAL_PREFIX)){
      items = lines.shift().slice(RITUAL_PREFIX.length).split(', ').filter(x=>RITUAL_ITEMS.includes(x));
    }
    if(lines[0] && lines[0].startsWith(START_PREFIX)){
      speechStart = lines.shift().slice(START_PREFIX.length).split(', ').map(x=>x.trim()).filter(Boolean);
    }
    if(lines[0] && lines[0].startsWith(TONE_PREFIX)){
      lines.shift(); // «Тон голоса» was removed — older records just lose that line
    }
    rest = lines.join('\n');
  }
  return { silent, ritualItems: items, speechStart, ritual: (silent || items.length) ? null : (ritual ?? null), ritualNote: rest };
}
function ritualToRow(e){
  const items = (e.ritualItems || []).filter(x=>RITUAL_ITEMS.includes(x));
  const lines = [];
  if(e.silent) lines.push(SILENT_LABEL);
  if(items.length) lines.push(RITUAL_PREFIX + items.join(', '));
  const st = e.silent ? [] : (e.speechStart || []).map(x=>String(x).replace(/,/g,' ').trim()).filter(Boolean);
  if(st.length) lines.push(START_PREFIX + st.join(', '));
  if(e.ritualNote) lines.push(e.ritualNote);
  return {
    ritual: items.length ? true : (!e.silent && typeof e.ritualLegacy === 'boolean' ? e.ritualLegacy : null),
    ritual_note: lines.join('\n') || null,
  };
}
function ritualText(e){
  const parts = [];
  if(e.silent) parts.push(SILENT_LABEL);
  if(e.ritualItems && e.ritualItems.length) parts.push(...e.ritualItems);
  else if(!e.silent) { if(e.ritual === true) parts.push('Соблюдал'); else if(e.ritual === false) parts.push('Не соблюдал'); }
  return parts.join(', ');
}
function rowToAttempt(r){
  return {
    id: r.id,

      ? { ft: r.ft, silent: !!r.ft.silent, ritualItems: [], speechStart: [], ritual: null, ritualNote: r.ritual_note || '' }
      : parseRitual(r.ritual, r.ritual_note)),
    voice: r.voice, voiceNote: r.voice_note,
    hand: r.hand, handNote: r.hand_note,

}
function ftFromAnswers(e){

  const pick = (k)=> (silent && FT_SPEECH_KEYS.includes(k)) ? [] : (e[k + 'Sel'] || []);

  const titleName = e.title === 'other' ? '' : e.title;

    hard: (e.hardSel || []).filter(id=>allowed.has(id)),

// "Режим молчания: как прошло" → { speechMode:'Режим молчания', speechModeNote:'как прошло' }.
// Stored in the same single column, so no DB change is needed.
function splitDescribed(val, presets, key){
  if(val == null) return { [key]: val };
  for(const p of presets){
    if(val === p) return { [key]: p };
    if(val.startsWith(p + ': ')) return { [key]: p, [key + 'Note']: val.slice(p.length + 2) };
  }
  return { [key]: val };
}
function rowToJournal(r){
  return {
    id: r.id,
    entryDate: r.entry_date,
    ts: new Date(r.entry_date + 'T12:00:00').getTime(),
    scrubbed: !!r.scrubbed_at,
    mood: r.mood === 'Норм' ? 'Нормальное' : r.mood, glad: r.glad, worry: r.worry,
    ...splitDescribed(typeof r.speech_mode === 'string' ? r.speech_mode.replace(/^Режим молчания(?= *$|: )/, 'Режим молчания (РМ)') : r.speech_mode, SPEECH_MODES_DESCRIBE, 'speechMode'),
    lessons: r.lessons, ftNotes: r.ft_notes, sleepQuality: r.sleep_quality,
    dailyRoutine: r.daily_routine,
    sleepHours: r.sleep_hours, sleepHoursNote: r.sleep_note,
    difficulties: r.difficulties,
    questions: r.questions,
    reflections: r.reflections, tricks: r.tricks, praise: r.praise,
    intentions: r.intentions,
  };
}
/* Multi-select with a free-text "Другое": the value is stored as one plain string
   ("Джекобсон, Прогулка, свой текст"), so older free-text entries still read fine. */
function parseMulti(val, presets, legacy){
  const sel = new Set(); const others = [];
  String(val || '').split(',').map(t=>t.trim()).filter(Boolean).forEach(t=>{
    if(presets.includes(t)) sel.add(t);
    else if(!others.includes(t)) others.push(t);
  });
  return { sel, others };
}
function buildMulti(sel, others, presets){
  const parts = presets.filter(p=>sel.has(p));
  (others || []).forEach(o=>{ const t = String(o).replace(/,/g, ' ').trim(); if(t && !parts.includes(t)) parts.push(t); });
  return parts.join(', ');
}
// Adds whatever is typed in the "own option" field (if anything) to the draft.
function addMultiCustom(id, text){
  const q = JOURNAL_STEPS.find(x=>x.id===id);
  const t = String(text || '').replace(/,/g, ' ').trim();
  if(!t) return false;
  const m = parseMulti(state.journalDraft[id], q.options, q.legacy);
  if(q.options.includes(t)) m.sel.add(t); else if(!m.others.includes(t)) m.others.push(t);
  state.journalDraft[id] = buildMulti(m.sel, m.others, q.options);
  scheduleJournalSave();
  return true;
}

}

/* ---------- offline support ----------
   The last loaded data is kept on the phone, so the app opens and shows it
   without internet. New attempts made offline wait in an "outbox" (and a
   journal entry in "journal pending") and are sent when the connection is
   back. Everything is per account and wiped on logout. */
function lsGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function lsSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
const cacheKey  = ()=> 'arlilia_cache_' + auth.userId;
const outboxKey = ()=> 'arlilia_outbox_' + auth.userId;
const jPendKey  = ()=> 'arlilia_jpending_' + auth.userId;
function saveCache(){
  if(!auth.userId || !state.loaded) return;
  lsSet(cacheKey(), { entries: state.entries, journal: state.journalEntries, goals: state.dayGoals, startDate: state.settings.startDate || null });
}
function loadCache(){
  const c = lsGet(cacheKey(), null);
  if(!c) return false;
  state.entries = Array.isArray(c.entries) ? c.entries : [];
  state.journalEntries = Array.isArray(c.journal) ? c.journal : [];
  state.dayGoals = (c.goals && typeof c.goals === 'object') ? c.goals : {};
  if(c.startDate) state.settings.startDate = c.startDate;
  return true;
}
function clearLocalUserData(){
  if(!auth.userId) return;
  try{ [cacheKey(), outboxKey(), jPendKey(), 'arlilia_last_seen'].forEach(k=>localStorage.removeItem(k)); }catch(e){}
}
function isNetworkError(err){ return err instanceof TypeError; }
function mergeOutboxIntoEntries(){
  lsGet(outboxKey(), []).forEach(it=>{
    if(state.entries.some(x=>x.id === it.tempId)) return;
    state.entries.push({ ...rowToAttempt({ ...it.row, id: it.tempId }), pending: true });
  });
  state.entries.sort((a,b)=>a.ts-b.ts);
}
let flushing = false;
let flushQueued = false;
async function flushOutbox(){
  if(!auth.userId || !state.loggedIn) return;
  if(flushing){ flushQueued = true; return; }
  flushing = true;
  state.flushError = null;
  try{
    let changed = false;
    // 1) attempts made offline
    for(const it of lsGet(outboxKey(), [])){
      try{
        const res = await sbFetch(`${SUPABASE_URL}/rest/v1/attempts`, {
          method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify(it.row),
        });
        if(res.status === 401) break; // not signed in right now — try again later
        let rows = null;
        if(res.ok) rows = await res.json();
        if(res.ok && Array.isArray(rows) && rows[0]){
          const idx = state.entries.findIndex(x=>x.id === it.tempId);
          const real = rowToAttempt(rows[0]);
          if(idx >= 0) state.entries[idx] = real; else state.entries.push(real);
        } else {
          // Сервер отказал: запись остаётся на телефоне (⏳) и не теряется.
          const et = await res.text().catch(()=>'');
          state.flushError = saveErrorText0(res.status, et) + ' (код ' + res.status + ')';
          console.error('outbox item not accepted', res.status, et);
          if(res.status >= 500 || /PGRST204|42703|column|schema cache/i.test(et)) break;
          continue; // другая запись может пройти
        }
        lsSet(outboxKey(), lsGet(outboxKey(), []).filter(x=>x.tempId !== it.tempId));
        changed = true;
      }catch(e){ break; } // still offline
    }
    // 2) journal entries saved offline
    const pend = lsGet(jPendKey(), {});
    for(const date of Object.keys(pend)){
      try{
        const res = await sbFetch(`${SUPABASE_URL}/rest/v1/journal_entries?on_conflict=entry_date,user_id`, {
          method: 'POST', headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' }, body: JSON.stringify([pend[date]]),
        });
        if(res.status === 401) break;
        if(res.ok){
          const rows = await res.json();
          if(Array.isArray(rows) && rows[0]){
            const updated = rowToJournal(rows[0]);
            const idx = state.journalEntries.findIndex(j=>j.entryDate === updated.entryDate);
            if(idx >= 0) state.journalEntries[idx] = updated; else state.journalEntries.push(updated);
            if(state.journalDraft && state.journalDraft.entryDate === updated.entryDate && !state.journalFormActive) state.journalDraft = updated;
          }
        } else {
          const et = await res.text().catch(()=>'');
          if(!(res.status >= 400 && res.status < 500) || /PGRST204|42703|column|schema cache/i.test(et)) break;
        }
        const left = lsGet(jPendKey(), {}); delete left[date]; lsSet(jPendKey(), left);
        changed = true;
      }catch(e){ break; }
    }
    if(changed){ saveCache(); if(!state.practiceActive && !state.journalFormActive) render(); }
  } finally {
    flushing = false;

async function loadAll(){

  await ensureFreshToken();
  // Все запросы стартуют одновременно, а не по очереди — загрузка в разы быстрее.
  const pAttempts = fetchAllRows(`${SUPABASE_URL}/rest/v1/attempts?select=*&user_id=eq.${auth.userId}&order=created_at.asc`);
  const pJournal = fetchAllRows(`${SUPABASE_URL}/rest/v1/journal_entries?select=*&user_id=eq.${auth.userId}&order=entry_date.asc`);

  const pSettings = sbFetch(`${SUPABASE_URL}/rest/v1/app_settings?select=*&user_id=eq.${auth.userId}&limit=1`).then(r=>r.json());
  [pAttempts, pJournal, pGoals, pSettings].forEach(pr=>pr.catch(()=>{}));
  try{
    const { res, rows } = await pAttempts;
    if(res.status === 401){
      if(auth.sessionInvalid) return false; // Supabase really did reject the session
      state.loadOffline = true; loadCache(); state.loaded = true; mergeOutboxIntoEntries(); applyTheme(); return true; // just a connectivity blip — stay logged in
    }
    if(Array.isArray(rows)){
      // Записи, сделанные пока шла загрузка, не должны пропасть из списка.
      const fresh = state.entries.filter(e=> e.ts >= loadStartedAt - 5000 && !String(e.id).startsWith('local-'));
      state.entries = rows.map(rowToAttempt);
      fresh.forEach(e=>{ if(!state.entries.some(x=>String(x.id) === String(e.id))) state.entries.push(e); });
      state.entries.sort((a,b)=>a.ts-b.ts);
    } else state.loadOffline = true;
  }catch(e){ console.error(e); state.loadOffline = true; }
  if(state.loadOffline){ loadCache(); }
  try{
    const { rows: rows2 } = await pJournal;
    state.journalEntries = Array.isArray(rows2) ? rows2.map(rowToJournal) : [];
  }catch(e){ console.error(e); }
  try{
    const rowsG = await pGoals;
    if(Array.isArray(rowsG)){
      const prev = state.dayGoals || {};
      state.dayGoals = {};
      rowsG.forEach(g=>{ state.dayGoals[g.goal_date] = { goal: g.goal || '', description: g.description || '' }; });
      Object.keys(prev).forEach(k=>{ if(!state.dayGoals[k] && prev[k].unsynced) state.dayGoals[k] = prev[k]; });
    }
  }catch(e){ console.error(e); }
  try{
    const rows3 = await pSettings;
    if(Array.isArray(rows3) && rows3[0]){
      state.settings.startDate = rows3[0].start_date || null;
    }
  }catch(e){ console.error(e); }
  try{
    const savedTheme = localStorage.getItem('arlilia_theme');
    if(savedTheme) state.settings.theme = savedTheme;
  }catch(e){}
  applyTheme();
  state.loaded = true;
  mergeOutboxIntoEntries();
  if(!state.loadOffline){ saveCache(); touchLastSeen(); flushOutbox(); }
  return true;
}

// Supabase returns at most 1000 rows per request, so a long-time user would
// silently lose their oldest/newest records. Read in pages of 1000 until done.
async function fetchAllRows(url){
  const PAGE = 1000;
  let all = [], res = null;
  for(let from = 0; ; from += PAGE){
    res = await sbFetch(url, { headers: { 'Range-Unit': 'items', 'Range': `${from}-${from + PAGE - 1}` } });
    if(!res.ok && res.status !== 206) return { res, rows: null };
    const rows = await res.json();
    if(!Array.isArray(rows)) return { res, rows: null };
    all = all.concat(rows);
    if(rows.length < PAGE) break;
  }
  return { res, rows: all };
}

async function persistJournal(){
  const draft = state.journalDraft;
  if(!draft || !draft.entryDate) return;

    const sentBody = JSON.stringify([journalDraftToRow(draft)]);
    const res = await sbFetch(`${SUPABASE_URL}/rest/v1/journal_entries?on_conflict=entry_date,user_id`, {
      method: 'POST',

      const errText = await res.text();
      console.error('persistJournal failed', res.status, errText);
      showToast('Дневник не сохранился: ' + res.status);
      return;
    }
    { const pend = lsGet(jPendKey(), {}); if(pend[draft.entryDate]){ delete pend[draft.entryDate]; lsSet(jPendKey(), pend); } }
    const rows = await res.json();
    if(Array.isArray(rows) && rows[0]){
      const updated = rowToJournal(rows[0]);
      const idx = state.journalEntries.findIndex(j => j.entryDate === updated.entryDate);
      if(idx >= 0) state.journalEntries[idx] = updated; else state.journalEntries.push(updated);
      if(state.journalDraft && state.journalDraft.entryDate === updated.entryDate){
        // Only swap in the server copy if nothing was changed while the request
        // was in flight — otherwise a quick second tap (e.g. a second
        // «Саморегуляция» option) would be overwritten by the stale response.
        if(JSON.stringify([journalDraftToRow(state.journalDraft)]) === sentBody) state.journalDraft = updated;
        state.journalEditId = updated.entryDate;
      }
    }
  }catch(e){
    console.error(e);
    if(isNetworkError(e)){
      const pend = lsGet(jPendKey(), {}); pend[draft.entryDate] = journalDraftToRow(draft); lsSet(jPendKey(), pend);
      showToast('Нет сети — дневник сохранён на телефоне и отправится позже');

  }

function isJournalEntryEmpty(entry){
  if(entry.scrubbed) return false; // text removed after 3 days, but the entry still counts as filled
  if(entry.sleepQuality || JOURNAL_LEGACY_FIELDS.some(([k]) => entry[k])) return false;
  return !JOURNAL_STEPS.some(f => {
    const v = entry[f.id];
    if(v !== undefined && v !== null && v !== '') return true;
    // number_note fields (e.g. "Сон") can be filled in with only the text
    // note and no number — that still counts as content.
    if(f.type === 'number_note'){
      const note = entry[f.id + 'Note'];
      if(note !== undefined && note !== null && note !== '') return true;
    }
    return false;
  });
}

/* ---------- helpers ---------- */
function fmtNum(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return (Math.round(n*10)/10).toString().replace('.', ',');
}
function startOfDay(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
// Local calendar date as YYYY-MM-DD. Deliberately NOT toISOString() (which is
// UTC): for timezones ahead of UTC (e.g. Moscow, UTC+3), toISOString() still
// reports "yesterday" for roughly the first 3 hours after local midnight,
// while everything else in the app (the calendar grid, dateLabel, etc.)
// already shows the new local day — so an attempt logged just after midnight
// would silently fail to count as "today" and could land under the wrong
// calendar day. Building the key from local getFullYear/getMonth/getDate
// keeps every "which day is this" check on the same (local) calendar.
function localDateKey(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayKey(){ return localDateKey(new Date()); }
function dateKey(ts){ return localDateKey(new Date(ts)); }
function dateLabel(ts){ return new Date(ts).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'}); }
function timeLabel(ts){ return new Date(ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); }
function weekdayDateLabel(ts){ return new Date(ts).toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'}); }

function avg(arr, key){
  const vals = arr.map(e=>e[key]).filter(v=>typeof v === 'number' && !isNaN(v));
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function capitalize(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

/* ---------- calendar helpers ---------- */
function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function firstWeekdayMonIndex(d){

/* Minimum attempts for a day to count: 5 from MIN_ATTEMPTS_FROM on, 1 for earlier days. */
const MIN_ATTEMPTS_FROM = '2026-11-10';
function minAttemptsForKey(key){ return key >= MIN_ATTEMPTS_FROM ? 5 : 1; }
function dayIsComplete(key, count, hasJournal){ return !!hasJournal && count >= minAttemptsForKey(key); }
function allTimeAttemptCounts(){
  const m = {};

  return m;

/* ---------- current streak: a running score. Every fully completed day
   (enough attempts + a journal entry) adds 1, every fully missed day takes 1
   away (never below 0). Today is still in progress, so it only adds when it
   is already complete — it never takes anything away. Counting starts at the
   chosen start date (or the first recorded day). ---------- */
function currentStreak(){
  const counts = allTimeAttemptCounts();
  const journalSet = allTimeJournalDayKeys();
  const isComplete = (key)=> dayIsComplete(key, counts[key]||0, journalSet.has(key));
  const today = new Date(); today.setHours(0,0,0,0);
  let start = null;
  if(state.settings.startDate){
    start = new Date(state.settings.startDate + 'T00:00:00');
  } else {
    const keys = [...Object.keys(counts), ...journalSet].sort();
    if(!keys.length) return 0;
    start = new Date(keys[0] + 'T00:00:00');
  }
  start.setHours(0,0,0,0);
  let score = 0;
  const cur = new Date(start);
  while(cur <= today){
    const k = dateKey(cur.getTime());
    const isToday = cur.getTime() === today.getTime();
    if(isComplete(k)) score++;
    else if(!isToday) score = Math.max(0, score - 1);
    cur.setDate(cur.getDate() + 1);
  }
  return score;
}

/* ---------- running total (+1 complete / -1 missed) from the start date up
   to, but not including, a given moment — used so the month trend chart
   carries its balance over from previous months instead of resetting to 0
   on the 1st of every month. ---------- */
function cumulativeBefore(dateTs){
  if(!state.settings.startDate) return 0;
  const start = new Date(state.settings.startDate + 'T00:00:00');
  start.setHours(0,0,0,0);
  const end = new Date(dateTs);
  end.setHours(0,0,0,0);
  if(end <= start) return 0;
  const counts = allTimeAttemptCounts();
  const journalSet = allTimeJournalDayKeys();
  let cum = 0;
  const cur = new Date(start);
  while(cur < end){
    const k = dateKey(cur.getTime());
    cum += dayIsComplete(k, counts[k]||0, journalSet.has(k)) ? 1 : -1;
    cur.setDate(cur.getDate() + 1);
  }
  return cum;
}

/* ---------- month trend (up/down "stock chart" of completed days) ---------- */
function buildMonthTrend(monthDate){
  const total = daysInMonth(monthDate);
  const attemptsByDay = attemptsCountByDay(monthDate);
  const journalDays = journalDaysInMonth(monthDate);
  const today = new Date();
  const isCurMonth = today.getFullYear()===monthDate.getFullYear() && today.getMonth()===monthDate.getMonth();
  const isFutureMonth = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1) > new Date(today.getFullYear(), today.getMonth(), 1);
  const lastDay = isFutureMonth ? 0 : (isCurMonth ? today.getDate() : total);

  // Don't count any day before the chosen start date — those were never
  // meant to be tracked, so they shouldn't pull the trend down.
  let firstDay = 1;
  if(state.settings.startDate){
    const start = new Date(state.settings.startDate + 'T00:00:00');
    if(start.getFullYear() === monthDate.getFullYear() && start.getMonth() === monthDate.getMonth()){
      firstDay = start.getDate();
    } else if(start.getFullYear() > monthDate.getFullYear() ||
      (start.getFullYear() === monthDate.getFullYear() && start.getMonth() > monthDate.getMonth())){
      firstDay = total + 1; // start date is still in a later month — nothing to plot yet
    }
  }

  // Carry the running total over from every earlier day since the start
  // date (including previous months) instead of starting each month back
  // at 0 — the graph is one continuous streak, viewed a month at a time.
  const baseline = cumulativeBefore(new Date(monthDate.getFullYear(), monthDate.getMonth(), firstDay).getTime());

  const points = [{ day: firstDay - 1, val: baseline, complete: null }];
  let cum = baseline;
  for(let day=firstDay; day<=lastDay; day++){
    const complete = dayIsComplete(localDateKey(new Date(monthDate.getFullYear(), monthDate.getMonth(), day)), attemptsByDay[day]||0, journalDays.has(day));
    cum += complete ? 1 : -1;
    points.push({ day, val: cum, complete });
  }
  return points;
}

/* ---------- render root ---------- */
function render(){
  const app = document.getElementById('app');
  if(!state.loggedIn){
    app.innerHTML = renderLogin();
    attachHandlers();
    return;
  }
  if(!state.loaded){ app.innerHTML = ''; return; }

  if(state.practiceActive){
    app.innerHTML = renderPracticeWizard();
  } else if(state.journalFormActive){
    app.innerHTML = renderJournalWizardStep();
  } else if(state.journalView === 'read' && state.journalReadEntry){
    app.innerHTML = renderJournalRead(state.journalReadEntry);
  } else {
    let body = '';
    if(state.tab === 'practice') body = renderPracticeHome();
    else if(state.tab === 'journal') body = renderJournalHome();
    else if(state.tab === 'exercises') body = state.exerciseCategory ? renderExerciseCategory(state.exerciseCategory) : renderExercisesHome(false);
    else if(state.tab === 'reference') body = state.exerciseCategory ? renderExerciseCategory(state.exerciseCategory) : renderExercisesHome(true);
    else if(state.tab === 'progress') body = renderProgress();
    else body = renderSettings();
    app.innerHTML = `${renderAppBar()}<div class="content">${body}</div>${renderTabbar()}${state.tab !== 'settings' ? renderOnboarding() : ''}`;
  }
  attachHandlers();
  if(state.focusStartDate){
    state.focusStartDate = false;
    const el = document.getElementById('settings-start-date');
    if(el){ el.focus(); el.scrollIntoView({ block:'center', behavior:'smooth' }); }
  }
}

function pendingSyncCount(){

function lastRepeatableAttempt(){
  let best = null;
  state.entries.forEach(e=>{ if(e.ft && !e.scrubbed && !e.pending && (!best || e.ts > best.ts)) best = e; });
  return best;
}
function renderPracticeHome(){
  const todayK = todayKey();
  const todayCount = state.entries.filter(e => dateKey(e.ts) === todayK).length;
  const need = minAttemptsForKey(todayK);
  const done = Math.min(todayCount, need);
  // Progress ring: it grows stage by stage — 5 cells, then 10, 15, 20, 25.
  // The number of cells is the next target; the colour "levels up" like rarity
  // tiers in games each time a target is reached.
  const TIERS = [
    { at: 0,    name: '',         c: 'var(--t0)' },
    { at: need, name: 'Норма',    c: 'var(--t1)' },
    { at: 10,   name: 'Хорошо',   c: 'var(--t2)' },
    { at: 15,   name: 'Отлично',  c: 'var(--t3)' },
    { at: 20,   name: 'Цель дня', c: 'var(--t4)' },
    { at: 25,   name: 'Рекорд',   c: 'var(--t5)' },
  ];
  let ti = 0; TIERS.forEach((t,k)=>{ if(todayCount >= t.at) ti = k; });
  const tier = TIERS[ti], nextTier = TIERS[ti+1] || null;
  const CELLS = nextTier ? nextTier.at : TIERS[TIERS.length-1].at;
  const R = 98, C = 2 * Math.PI * R, gap = CELLS <= 5 ? 18 : (CELLS <= 15 ? 12 : 9), arcLen = C / CELLS - gap;
  const filled = Math.min(todayCount, CELLS);
  const arcs = Array.from({length: CELLS}, (_,i)=>{
    const dash = `stroke-dasharray="${arcLen.toFixed(1)} ${(C-arcLen).toFixed(1)}" stroke-dashoffset="${(-(C/CELLS)*i - gap/2).toFixed(1)}"`;
    if(i < filled) return `<circle class="ring-arc on" style="stroke:${tier.c}" cx="103" cy="103" r="${R}" ${dash}/>`;
    return `<circle class="ring-arc${i < need && CELLS > need ? ' min' : ''}" cx="103" cy="103" r="${R}" ${dash}/>`;
  }).join('');
  const caption = todayCount < need
    ? `До нормы: ${need - todayCount} из ${need}`
    : !nextTier
      ? `<span style="color:${tier.c}">Рекорд дня</span> · всего ${todayCount}`
      : `<span style="color:${tier.c}">${tier.name}</span>${ti === 1 || ti === 4 ? ' ✓' : ''} · до «${nextTier.name}» ещё ${nextTier.at - todayCount}`;
  const numColor = todayCount >= need ? tier.c : 'var(--accent)';
  const remind = getRemind();
  const needJournal = remind.on && new Date().getHours() >= remind.hour && !findTodayJournal();
  const last = lastRepeatableAttempt();
  return `
    <div class="home-hero">
      <div class="eyebrow">Подходы</div>
    </div>
    ${needJournal ? `<div class="remind-card"><span class="remind-text">📓 Не забудьте заполнить дневник за сегодня</span><button class="btn btn-primary" data-tab="journal">Заполнить</button></div>` : ''}
    <div class="today-badge-wrap has-ring">
      <div class="ring-wrap">
        <svg viewBox="0 0 206 206" aria-hidden="true">${arcs}</svg>
        <div class="today-badge">
          <div class="today-badge-num" style="color:${numColor}">${todayCount}</div>
          <div class="today-badge-lbl">подход${todayCount===1?'':(todayCount>=2&&todayCount<=4?'а':'ов')} сегодня</div>
        </div>
      </div>
    </div>
    <div class="ring-caption">${caption}</div>
    ${renderDayGoal(todayK)}
    <button class="btn btn-primary" data-action="start-practice">Записать подход</button>
  `;
}

async function saveDayGoal(dk, goal, description){
  state.dayGoals = state.dayGoals || {};
  state.dayGoals[dk] = { goal, description, unsynced: true };
  saveCache();
  try{
    const res = await sbFetch(`${SUPABASE_URL}/rest/v1/day_goals?on_conflict=user_id,goal_date`, {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([{ user_id: auth.userId, goal_date: dk, goal: goal || null, description: description || null, updated_at: new Date().toISOString() }]),
    });
    if(res.ok){ delete state.dayGoals[dk].unsynced; saveCache(); }
    else { console.error('goal save', res.status, await res.text()); showToast('Цель не сохранилась на сервере: ' + res.status); }
  }catch(e){ showToast('Нет связи — цель сохранится на этом устройстве'); }
}

  } else if(q.type === 'choice'){
    const val = state.answers[q.id];
    control = `<div class="choice-list">${q.options.map(opt => `
      <button class="choice-list-btn ${val===opt?'selected':''}" data-choice-id="${q.id}" data-choice-val="${opt.replace(/"/g,'&quot;')}">${opt}</button>
    `).join('')}</div>`;
  } else if(q.type === 'text'){
    const val = state.answers[q.id] || '';
    control = `<textarea id="text-${q.id}" placeholder="Коротко, по сути...">${esc(val)}</textarea>`;
  }

  const isFirst = state.qIndex === 0;
  const isLast = state.qIndex === activeQuestions().length - 1;

  return `
    <div class="wiz-shell">
      <div class="progress-dots">${dots}</div>
      <div class="q-wrap">
        <div class="q-label">${q.label}</div>
        <div class="q-hint">${q.hint || ''}</div>
        ${control}
      </div>
      ${(isLast && state.saveError) ? `<div class="save-error">⚠️ ${esc(state.saveError)}</div>` : ''}
      <div class="nav-row">
        <button class="btn btn-ghost" data-action="${isFirst ? 'cancel-practice' : 'prev-question'}">${isFirst ? 'Отмена' : 'Назад'}</button>
        <button class="btn btn-primary" data-action="${isLast ? 'save-practice' : 'next-question'}">${isLast ? 'Сохранить' : 'Далее'}</button>
      </div>
    </div>
  `;
}

/* ---------- read-only beautiful view ---------- */
function renderJournalRead(entry){
  const rowsHtml = JOURNAL_STEPS.concat(JOURNAL_LEGACY_FIELDS.map(([id,label])=>({id, label, type:'textarea'}))).map(f=>{
    if(f.id === 'mood') return '';
    const v = entry[f.id];
    const hasV = v !== undefined && v !== null && v !== '';
    const noteVal = (f.type === 'number_note' || f.type === 'sleep') ? entry[f.id + 'Note'] : null;
    const hasNote = noteVal !== undefined && noteVal !== null && noteVal !== '';
    if(!hasV && !hasNote && !(f.type === 'sleep' && entry.sleepQuality)) return '';

    if(f.type === 'sleep'){
      const q2 = entry.sleepQuality;
      const parts = [hasV ? fmtNum(v) + ' ч' : '', hasNote ? noteVal : ''].filter(Boolean).join(' — ');
      const text = [q2, parts].filter(Boolean).join(' · ');
      return text ? readRow(JOURNAL_ICONS.sleepHours, null, text, 'Сон') : '';
    }
    if(f.type === 'number' || f.type === 'number_note'){
      const unit = f.id === 'sleepHours' ? 'сон, часов' : f.label;
      if(hasV) return readRow(JOURNAL_ICONS[f.id]||'🔹', v, hasNote ? `${unit} — ${noteVal}` : unit);
      return readRow(JOURNAL_ICONS[f.id]||'🔹', null, noteVal, f.label); // text note only, no number
    }
    return readRow(JOURNAL_ICONS[f.id]||'🔹', null, v, f.label);
  }).join('');

  if(entry.scrubbed){
    const dn0 = dayNumberForTs(entry.ts);
    return `
    <div style="padding:22px 20px 40px;">
      <div class="top-bar">
        <button class="back-btn" data-action="journal-read-back">‹</button>
        <h2 style="text-transform:capitalize;">${dn0 ? 'День ' + dn0 : weekdayDateLabel(entry.ts)}</h2>
      </div>
      <div class="empty">В этот день дневник был заполнен.<br>Текст записи хранится 30 дней и потом удаляется — осталась только отметка.</div>
    </div>`;
  }
  const moodVal = entry.mood;
  const moodIcon = MOOD_ICONS[moodVal] || '🙂';
  const dn = dayNumberForTs(entry.ts);

  return `
    <div style="padding:22px 20px 40px;">
      <div class="top-bar">
        <button class="back-btn" data-action="journal-read-back">‹</button>
        <h2 style="text-transform:capitalize;">${dn ? 'День ' + dn : weekdayDateLabel(entry.ts)}</h2>
      </div>
      ${dn ? `<div style="text-align:center; color:var(--text-muted); font-size:13px; text-transform:capitalize; margin:-6px 0 4px;">${weekdayDateLabel(entry.ts)}</div>` : ''}
      <div class="read-hero">
        <div class="read-hero-emoji">🌇</div>
        <div class="read-hero-mood">${moodIcon} ${esc(moodVal)}</div>
      </div>
      ${rowsHtml || emptyState('journal','Запись пуста')}
    </div>
  `;
}
function readRow(icon, big, text, label){
  // icon/label come from our own fixed lookup tables; big/text are the
  // person's own saved values, so those are the ones that need escaping.
  return `
    <div class="read-row">
      <div class="read-icon">${icon}</div>
      <div class="read-body">
        ${label ? `<div class="read-label">${esc(label)}</div>` : ''}
        ${big !== null && big !== undefined
          ? `<div class="read-big">${esc(big)}</div><div class="read-sub">${esc(text)}</div>`
          : `<div class="read-text">${esc(text)}</div>`}
      </div>
    </div>
  `;
}

/* ---------- step-by-step wizard for a new/current entry ---------- */
function renderJournalWizardStep(){
  const idx = state.journalStepIndex;
  const q = JOURNAL_STEPS[idx];
  const val = state.journalDraft[q.id];

  const dots = JOURNAL_STEPS.map((_,i)=>{
    let cls = 'dot';
    if(i < idx) cls += ' done';
    if(i === idx) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');

  let control = '';
  if(q.type === 'choice'){
    control = `<div class="choice-list">${q.options.map(opt => `
      <button class="choice-list-btn ${val===opt?'selected':''}" data-jw-choice="${q.id}" data-jw-val="${opt}">${opt}</button>
    `).join('')}</div>`;
  } else if(q.type === 'choice_other'){
    // Any stored value that isn't one of the preset options is treated as a
    // previously-typed custom answer (mirrors the practice wizard's
    // choice_other, and how it's saved: the real text is stored directly,
    // not the word "other" — see journalDraftToRow).
    const presetIds = q.options.map(o => o === 'Другое' ? 'other' : o);
    const isOther = val != null && val !== '' && !presetIds.includes(val);
    const selId = isOther ? 'other' : val;
    const customVal = isOther ? val : (state.journalDraft[q.id + 'Custom'] || '');
    control = `<div class="choice-list">${q.options.map(opt => {
      const optId = opt === 'Другое' ? 'other' : opt;
      const selected = selId === optId;
      return `<button class="choice-list-btn ${selected?'selected':''}" data-jw-choice="${q.id}" data-jw-val="${optId.replace(/"/g,'&quot;')}">${opt}</button>`;
    }).join('')}
    ${selId === 'other' ? `<input type="text" id="jw-text-${q.id}Custom" value="${esc(customVal)}" placeholder="Напишите свой вариант" style="margin-top:10px;">` : ''}
    </div>`;
    if(q.describe && selId !== 'other' && (q.describe === true || !selId || q.describe.includes(selId))){
      const dKey = q.id + 'Note';
      const dVal = state.journalDraft[dKey] || '';
      const dOpen = (state.journalNoteOpen && state.journalNoteOpen[q.id]) || !!dVal;
      control += `
        <button type="button" class="btn-ghost" data-jw-note-toggle="${q.id}" style="margin-top:20px; padding:11px;">${dOpen ? 'Скрыть описание' : '+ Добавить описание'}</button>
        ${dOpen ? `<textarea id="jw-text-${dKey}" placeholder="Как всё прошло, что получилось, что нет..." style="margin-top:10px;">${esc(dVal)}</textarea>` : ''}`;
    }
  } else if(q.type === 'bool'){
    control = `
      <div class="choice-row">
        <button class="choice-btn ${val===true?'selected':''}" data-jw-bool="${q.id}" data-jw-val="true">Да</button>
        <button class="choice-btn ${val===false?'selected':''}" data-jw-bool="${q.id}" data-jw-val="false">Нет</button>
      </div>`;
  } else if(q.type === 'number'){
    control = `<input type="number" inputmode="decimal" id="jw-number-${q.id}" value="${val ?? ''}" style="text-align:center; font-size:30px; padding:16px; font-family:Georgia,serif;">`;
  } else if(q.type === 'number_note'){
    const noteKey = q.id + 'Note';
    const noteVal = state.journalDraft[noteKey] || '';
    const noteOpen = (state.journalNoteOpen && state.journalNoteOpen[q.id]) || !!noteVal;
    control = `
      <input type="number" inputmode="decimal" id="jw-number-${q.id}" value="${val ?? ''}" style="text-align:center; font-size:30px; padding:16px; font-family:Georgia,serif;">
      <button type="button" class="btn-ghost" data-jw-note-toggle="${q.id}" style="margin-top:20px; padding:11px;">${noteOpen ? 'Скрыть текст' : '+ Написать словами'}</button>
      ${noteOpen ? `<textarea id="jw-text-${noteKey}" placeholder="Можно написать словами, а не только цифрой..." style="margin-top:10px;">${esc(noteVal)}</textarea>` : ''}
    `;
  } else if(q.type === 'sleep'){
    const sq = state.journalDraft.sleepQuality;
    const noteKey = q.id + 'Note';
    const noteVal = state.journalDraft[noteKey] || '';
    const noteOpen = (state.journalNoteOpen && state.journalNoteOpen[q.id]) || !!noteVal;
    control = `
      <div class="choice-row">
        ${['Высыпаюсь','Не высыпаюсь'].map(o=>`<button class="choice-btn ${sq===o?'selected':''}" data-jw-sleepq="${o}">${o}</button>`).join('')}
      </div>
      <div class="q-hint" style="margin:18px 0 6px;">Сколько часов</div>
      <input type="number" inputmode="decimal" id="jw-number-${q.id}" value="${val ?? ''}" style="text-align:center; font-size:30px; padding:16px; font-family:Georgia,serif;">
      <button type="button" class="btn-ghost" data-jw-note-toggle="${q.id}" style="margin-top:20px; padding:11px;">${noteOpen ? 'Скрыть текст' : '+ Написать словами'}</button>
      ${noteOpen ? `<textarea id="jw-text-${noteKey}" placeholder="Можно написать словами..." style="margin-top:10px;">${esc(noteVal)}</textarea>` : ''}
    `;
  } else if(q.type === 'text'){
    control = `<input type="text" id="jw-text-${q.id}" value="${esc(val)}" placeholder="Коротко, по сути...">`;
  } else if(q.type === 'textarea'){
    control = `<textarea id="jw-text-${q.id}" placeholder="Коротко, по сути...">${esc(val)}</textarea>`;
  } else if(q.type === 'multi_other'){
    const m = parseMulti(val, q.options, q.legacy);
    const otherOpen = !!(state.multiOtherOpen && state.multiOtherOpen[q.id]);
    control = `<div class="choice-list">${q.options.map(opt => `
      <button class="choice-list-btn ${m.sel.has(opt)?'selected':''}" data-jw-multi="${q.id}" data-jw-val="${esc(opt)}">${opt}</button>
    `).join('')}
      ${m.others.map((o,i) => `
      <button class="choice-list-btn selected" data-jw-multi-del="${q.id}" data-jw-idx="${i}">${esc(o)} <span style="opacity:.7;">×</span></button>
    `).join('')}
      <button class="choice-list-btn ${otherOpen?'selected':''}" data-jw-multi-other="${q.id}">${otherOpen ? 'Другое' : '+ Другое'}</button>
      ${otherOpen ? `<div style="display:flex; gap:8px; margin-top:10px;">
        <input type="text" id="jw-mother-${q.id}" placeholder="Свой вариант" style="flex:1; min-width:0;">
        <button type="button" class="btn-ghost" data-jw-multi-add="${q.id}" style="width:auto; padding:0 18px;">Добавить</button>
      </div>` : ''}
    </div>`;
  }

  const isFirst = idx === 0;
  const isLast = idx === JOURNAL_STEPS.length - 1;

  return `
    <div class="wiz-shell">
      <div class="progress-dots">${dots}</div>
      <div class="q-wrap">
        <div class="q-label">${q.label}</div>
        <div class="q-hint">${q.hint || ''}</div>
        ${control}
      </div>
      <div class="nav-row">
        <button class="btn btn-ghost" data-action="${isFirst ? 'done-journal' : 'journal-prev-step'}">${isFirst ? 'Готово' : 'Назад'}</button>
        <button class="btn btn-primary" data-action="${isLast ? 'done-journal' : 'journal-next-step'}">${isLast ? 'Готово' : 'Далее'}</button>
      </div>
    </div>
  `;
}

function renderCalendar(monthDate){
  const total = daysInMonth(monthDate);
  const offset = firstWeekdayMonIndex(monthDate);
  const countsByDay = attemptsCountByDay(monthDate);
  const journalDays = journalDaysInMonth(monthDate);
  const today = new Date();
  const todayStart = startOfDay(Date.now());
  const startDate = state.settings.startDate ? startOfDay(new Date(state.settings.startDate + 'T00:00:00').getTime()) : null;
  const isCurMonth = today.getFullYear()===monthDate.getFullYear() && today.getMonth()===monthDate.getMonth();
  const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  let cells = '';
  for(let i=0;i<offset;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=total; day++){
    const count = countsByDay[day] || 0;
    const hasJournal = journalDays.has(day);
    const cellDate = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
    const isToday = isCurMonth && today.getDate() === day;
    // A day before the chosen start date was never meant to be tracked —
    // don't mark it as a missed day, only days from the start date onward.
    const isAfterStart = startDate === null || cellDate.getTime() >= startDate;
    const isPastOrToday = cellDate.getTime() <= todayStart && isAfterStart;
    const complete = dayIsComplete(localDateKey(cellDate), count, hasJournal);
    let arrow = '';
    if(isPastOrToday) arrow = complete
      ? `<span class="cal-arrow up">↑</span>`
      : `<span class="cal-arrow down">↓</span>`;
    cells += `<div class="cal-cell${isToday?' today':''}${complete&&isPastOrToday?' done':''}">
      ${arrow}
      <div class="cal-day-num">${day}</div>
      <div class="cal-emojis">
        ${hasJournal ? `<span>📓</span>` : ''}
        ${count ? `<span>🚶</span>` : ''}
      </div>
      <div class="cal-count">${count ? '×'+count : ''}</div>
    </div>`;
  }

  return `
    <div class="cal-grid cal-weekdays">${weekdays.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <span>📓 дневник</span>
      <span>🚶 подход</span>
      <span>×N — подходов за день (нужно 5+)</span>
      <span style="color:var(--good);">↑ день выполнен</span>
      <span style="color:var(--warn);">↓ день пропущен</span>
    </div>
  `;
}

function renderTrendChart(monthDate){
  const points = buildMonthTrend(monthDate);
  if(points.length <= 1){
    return `<div class="trend-empty"><div class="empty-art">${EMPTY_ART.chart}</div>В этом месяце пока нет данных для графика</div>`;
  }
  const W = 600, H = 150, padX = 10, padY = 18;
  const maxAbs = Math.max(2, ...points.map(p=>Math.abs(p.val)));
  const lastDay = points[points.length-1].day;
  const xFor = day => padX + (day / Math.max(1,lastDay)) * (W - padX*2);
  const yFor = val => H/2 - (val / maxAbs) * (H/2 - padY);

  let segments = '';
  for(let i=1;i<points.length;i++){
    const a = points[i-1], b = points[i];
    const color = b.complete ? 'var(--good)' : 'var(--warn)';
    segments += `<line x1="${xFor(a.day).toFixed(1)}" y1="${yFor(a.val).toFixed(1)}" x2="${xFor(b.day).toFixed(1)}" y2="${yFor(b.val).toFixed(1)}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`;
  }
  const last = points[points.length-1];
  const lastColor = last.val > 0 ? 'var(--good)' : (last.val < 0 ? 'var(--warn)' : 'var(--text-muted)');

  return `
    <div class="trend-wrap">
      <svg viewBox="0 0 ${W} ${H}" class="trend-svg" preserveAspectRatio="none">
        <line x1="${padX}" y1="${(H/2).toFixed(1)}" x2="${W-padX}" y2="${(H/2).toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4"/>
        ${segments}
        <circle cx="${xFor(last.day).toFixed(1)}" cy="${yFor(last.val).toFixed(1)}" r="4.5" fill="${lastColor}"/>
      </svg>
      <div class="trend-legend">
        <span style="color:var(--good);">↑ день выполнен</span>
        <span style="color:var(--warn);">↓ день пропущен</span>
        <span style="color:${lastColor}; font-weight:600;">сейчас: ${last.val > 0 ? '+' : ''}${last.val}</span>
      </div>
    </div>
  `;
}

async function changePassword(){
  const msg = (t, ok)=>{ const el = document.getElementById('pw-msg'); if(el){ el.textContent = t; el.style.color = ok ? 'var(--accent)' : 'var(--warn)'; } };
  const cur = (document.getElementById('pw-current')||{}).value || '';
  const n1 = (document.getElementById('pw-new')||{}).value || '';
  const n2 = (document.getElementById('pw-new2')||{}).value || '';
  if(!cur || !n1 || !n2){ msg('Заполните все три поля'); return; }
  if(n1.length < 6){ msg('Новый пароль должен быть не короче 6 символов'); return; }
  if(n1 !== n2){ msg('Новые пароли не совпадают'); return; }
  if(n1 === cur){ msg('Новый пароль совпадает с текущим'); return; }
  if(state.pwBusy) return;
  state.pwBusy = true; msg('Проверяем…', true);
  try{
    // Confirm the current password first (also gives a fresh session for the change).
    const chk = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method:'POST', headers:{ 'apikey': SUPABASE_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email: auth.email, password: cur }),
    });
    if(!chk.ok){ msg(chk.status === 400 ? 'Текущий пароль неверный' : 'Не удалось проверить пароль: ' + chk.status); return; }
    setSession(await chk.json());
    const res = await sbFetch(`${SUPABASE_URL}/auth/v1/user`, {
      method:'PUT', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ password: n1 }),
    });
    if(!res.ok){
      let data = null; try{ data = await res.json(); }catch(e){}
      msg(translateAuthError(data, 'Не удалось сменить пароль: ' + res.status));
      return;
    }
    state.pwOpen = false;
    showToast('Пароль изменён');
    render();
  }catch(e){
    msg('Нет соединения — пароль не изменён');
  }finally{
    state.pwBusy = false;
  }
}

      setTimeout(()=>{
        if(state.journalStepIndex === targetIndex && state.journalStepIndex < JOURNAL_STEPS.length - 1){
          state.journalStepIndex++;
          render();
        }
      }, 260);
    });
  });
  app.querySelectorAll('[data-jw-multi]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const id = e.currentTarget.getAttribute('data-jw-multi');
      const opt = e.currentTarget.getAttribute('data-jw-val');
      const q = JOURNAL_STEPS.find(x=>x.id===id);
      commitPendingMulti();
      const m = parseMulti(state.journalDraft[id], q.options, q.legacy);
      if(m.sel.has(opt)) m.sel.delete(opt); else m.sel.add(opt);
      state.journalDraft[id] = buildMulti(m.sel, m.others, q.options);
      scheduleJournalSave();
      render();
    });
  });
  app.querySelectorAll('[data-jw-multi-del]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const id = e.currentTarget.getAttribute('data-jw-multi-del');
      const idx = parseInt(e.currentTarget.getAttribute('data-jw-idx'), 10);
      const q = JOURNAL_STEPS.find(x=>x.id===id);
      commitPendingMulti();
      const m = parseMulti(state.journalDraft[id], q.options, q.legacy);
      // commitPendingMulti may have appended a new one; indexes of existing ones stay valid
      m.others.splice(idx, 1);
      state.journalDraft[id] = buildMulti(m.sel, m.others, q.options);
      scheduleJournalSave();
      render();
    });
  });
  app.querySelectorAll('[data-jw-multi-other]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const id = e.currentTarget.getAttribute('data-jw-multi-other');
      commitPendingMulti();
      state.multiOtherOpen[id] = !state.multiOtherOpen[id];
      render();
      const inp = document.getElementById('jw-mother-' + id); if(inp) inp.focus();
    });
  });
  app.querySelectorAll('[data-jw-multi-add]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const id = e.currentTarget.getAttribute('data-jw-multi-add');
      const inp = document.getElementById('jw-mother-' + id);
      if(inp && addMultiCustom(id, inp.value)){ render(); const n = document.getElementById('jw-mother-' + id); if(n) n.focus(); }
    });
  });
  app.querySelectorAll('#app input[id^="jw-mother-"]').forEach(el=>{
    el.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        const id = e.target.id.replace('jw-mother-','');
        if(addMultiCustom(id, e.target.value)){ render(); const n = document.getElementById('jw-mother-' + id); if(n) n.focus(); }
      }
    });
  });
  app.querySelectorAll('#app input[id^="jw-text-"], #app textarea[id^="jw-text-"]').forEach(el=>{
    el.addEventListener('input', (e)=>{
      const id = e.target.id.replace('jw-text-','');
      state.journalDraft[id] = e.target.value;
      scheduleJournalSave();
    });
  });
  app.querySelectorAll('#app input[id^="jw-number-"]').forEach(el=>{
    el.addEventListener('input', (e)=>{
      const id = e.target.id.replace('jw-number-','');
      state.journalDraft[id] = e.target.value === '' ? null : parseFloat(e.target.value);
      scheduleJournalSave();
    });
  });
  app.querySelectorAll('#app input[id^="text-"], #app textarea[id^="text-"]').forEach(el=>{
    el.addEventListener('input', (e)=>{
      const id = e.target.id.replace('text-','');
      state.answers[id] = e.target.value;
    });
  });
  const reportDateEl = app.querySelector('#report-date');
  if(reportDateEl){
    reportDateEl.addEventListener('input', (e)=>{
      state.reportDate = e.target.value || todayKey();
    });
    reportDateEl.addEventListener('change', (e)=>{
      state.reportDate = e.target.value || todayKey();
      state.confirmDeleteAttemptId = null;
      render();
    });
  }
  ['login-password','login-password2'].forEach(id=>{
    const el = app.querySelector('#'+id);
    if(el){
      el.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter') doAuthFromForm();
      });
    }
  });
}

function doLoginFromForm(){
  if(state.loginBusy) return;
  const email = (document.getElementById('login-email')||{}).value || '';
  const password = (document.getElementById('login-password')||{}).value || '';
  if(!email.trim() || !password){
    state.loginError = 'Введите email и пароль';
    render();
    return;
  }
  login(email.trim(), password);
}

function doSignupFromForm(){
  if(state.loginBusy) return;
  const email = (document.getElementById('login-email')||{}).value || '';
  const password = (document.getElementById('login-password')||{}).value || '';
  const password2 = (document.getElementById('login-password2')||{}).value || '';
  if(!email.trim() || !password){
    state.loginError = 'Введите email и пароль';
    render();
    return;
  }
  if(password.length < 6){
    state.loginError = 'Пароль должен быть не короче 6 символов';
    render();
    return;
  }
  if(password !== password2){
    state.loginError = 'Пароли не совпадают';
    render();
    return;
  }
  signUp(email.trim(), password);
}

function doAuthFromForm(){
  if(state.authMode === 'signup') doSignupFromForm();
  else doLoginFromForm();
}

function endOnboarding(){
  state.onboarding = 0;
  try{ localStorage.setItem('arlilia_onboarding_done', '1'); }catch(e){}
}

async function onAction(e){
  const action = e.currentTarget.getAttribute('data-action');

  if(action === 'toggle-streak-info'){
    state.streakInfoOpen = true; render(); return;
  } else if(action === 'close-streak-info'){
    state.streakInfoOpen = false; render(); return;
  } else if(action === 'toggle-settings'){
    if(state.tab === 'settings'){
      state.tab = state.lastTab || 'practice';
    } else {
      state.lastTab = state.tab;
      state.tab = 'settings';
    }
    render();
    return;
  } else if(action === 'goto-start-date'){
    if(state.tab !== 'settings') state.lastTab = state.tab;
    state.tab = 'settings';
    state.focusStartDate = true;
    endOnboarding();
    render();
    return;
  } else if(action === 'onboarding-next'){
    state.onboarding = 2;
    render();
    return;
  } else if(action === 'onboarding-skip'){
    endOnboarding();
    render();
    return;
  } else if(action === 'confirm-start-date'){
    const input = document.getElementById('settings-start-date');
    const val = input ? input.value : '';
    state.startDateSaving = true; render();
    await saveStartDate(val || null);
    state.startDateSaving = false;
    showToast(val ? 'Дата начала сохранена' : 'Дата начала очищена');
    render();
    return;
  } else if(action === 'reset-start-date'){
    state.startDateSaving = true; render();
    await saveStartDate(null);
    state.startDateSaving = false;
    showToast('Дата начала сброшена');
    render();
    return;
  } else if(action === 'do-login'){
    doLoginFromForm(); return;
  } else if(action === 'do-signup'){
    doSignupFromForm(); return;
  } else if(action === 'auth-mode-login'){
    state.authMode = 'login'; state.loginError = null; state.loginNotice = null; render(); return;
  } else if(action === 'auth-mode-signup'){
    state.authMode = 'signup'; state.loginError = null; state.loginNotice = null; render(); return;
  } else if(action === 'logout'){
    logout(); return;
  } else if(action === 'ask-reset-data'){
    state.confirmReset = true; render(); return;
  } else if(action === 'cancel-reset-data'){
    state.confirmReset = false; render(); return;
  } else if(action === 'confirm-reset-data'){
    resetAllData(); return;
  } else if(action === 'start-practice'){
    state.editingAttemptId = null;
    state.practiceActive = true; state.qIndex = 0; state.answers = {}; state.noteOpen = {}; state.wizOtherOpen = {};
    ALL_QUESTIONS.forEach(q => { if(q.type==='scale' || q.type==='scale_note') state.answers[q.id] = 5; });
  } else if(action === 'start-practice-repeat'){
    const a = lastRepeatableAttempt();
    if(!a){ showToast('Нет прошлого подхода для повтора'); return; }
    const ans = answersFromAttempt(a);
    // Repeat the setup (type, mood, ritual, method), start the rest fresh.
    ans.detail = []; delete ans.reactionAfter; delete ans.reactionAfterCustom;
    ans.hardSel = []; ans.hardOther = []; ans.ritualNote = '';
    ans.anxiety = 5; ans.anxietyNote = '';
    state.editingAttemptId = null;
    state.wizOtherOpen = {}; state.noteOpen = {};
    state.answers = ans; state.qIndex = 0; state.practiceActive = true;
    showToast('Подставил из прошлого подхода — проверьте и дополните');
  } else if(action === 'edit-goal'){
    state.goalEditing = true;
  } else if(action === 'cancel-goal'){
    state.goalEditing = false;
  } else if(action === 'save-goal'){
    const gt = (document.getElementById('goal-text') || {}).value || '';
    const gd = (document.getElementById('goal-desc') || {}).value || '';
    state.goalEditing = false;
    render();
    await saveDayGoal(todayKey(), gt.trim(), gd.trim());
  } else if(action === 'use-goal-hint'){
    const yj = journalEntryOnDate(prevDateKey(todayKey()));
    if(yj && yj.intentions){ await saveDayGoal(todayKey(), String(yj.intentions).trim().slice(0,200), ''); }
  } else if(action === 'toggle-edit-list'){
    state.editListOpen = !state.editListOpen;
    state.confirmDeleteAttemptId = null;
  } else if(action === 'edit-attempt'){
    const a = state.entries.find(x=> String(x.id) === e.currentTarget.getAttribute('data-aid'));
    if(!a) return;
    state.editingAttemptId = a.id;
    state.wizOtherOpen = {};
    state.answers = answersFromAttempt(a);
    state.noteOpen = {};
    state.qIndex = 0;
    state.practiceActive = true;
  } else if(action === 'ask-delete-attempt'){
    state.confirmDeleteAttemptId = e.currentTarget.getAttribute('data-aid');
  } else if(action === 'cancel-delete-attempt'){
    state.confirmDeleteAttemptId = null;
  } else if(action === 'confirm-delete-attempt'){
    const id = e.currentTarget.getAttribute('data-aid');
    state.confirmDeleteAttemptId = null;
    if(await deleteAttempt(id)){
      state.entries = state.entries.filter(x=> String(x.id) !== id);
      saveCache();
      showToast('Подход удалён');
    }
  } else if(action === 'cancel-practice'){
    state.editingAttemptId = null;
    state.practiceActive = false;
  } else if(action === 'prev-question'){
    commitWizOther();
    state.qIndex = Math.max(0, state.qIndex - 1);
  } else if(action === 'next-question'){
    commitWizOther();
    state.qIndex = Math.min(activeQuestions().length - 1, state.qIndex + 1);
  } else if(action === 'save-practice'){
    commitWizOther();
    state.saveError = null; state.lastSaveError = null;
    state.practiceActive = false;
    render();
    const keepAnswers = state.answers, keepEditId = state.editingAttemptId;
    // Если сервер отказал — возвращаем в мастер с теми же ответами, ничего не теряется.
    const restoreWizard = ()=>{
      state.answers = keepAnswers; state.editingAttemptId = keepEditId;
      state.practiceActive = true; state.qIndex = activeQuestions().length - 1;
      state.saveError = state.lastSaveError || 'Не удалось сохранить. Введённое не потеряно.';
      render();
    };
    if(state.editingAttemptId){
      // Правка: сразу показываем изменения, на сервер отправляем в фоне.
      const editId = state.editingAttemptId;
      state.editingAttemptId = null;
      const idx = state.entries.findIndex(x=> String(x.id) === String(editId));
      const before = idx >= 0 ? state.entries[idx] : null;
      if(before){
        state.entries[idx] = { ...rowToAttempt({ ...attemptToRow(keepAnswers), id: editId, created_at: new Date(before.ts).toISOString() }) };
        saveCache();
      }
      render();
      showToast('Изменения сохранены');
      updateAttempt(editId, keepAnswers).then(updated=>{
        const i2 = state.entries.findIndex(x=> String(x.id) === String(editId));
        if(updated){ if(i2 >= 0) state.entries[i2] = updated; saveCache(); }
        else if(before && i2 >= 0){ state.entries[i2] = before; saveCache(); showToast('Изменения не сохранились на сервере и отменены'); }
        render();
      });
      return;
    }
    // Новая ФТ: сразу кладём на телефон и показываем, отправляем на сервер в фоне —
    // не нужно ждать ответа, даже при медленном интернете.
    const row = { ...attemptToRow(keepAnswers), created_at: new Date().toISOString() };
    const tempId = 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    lsSet(outboxKey(), lsGet(outboxKey(), []).concat([{ tempId, row }]));
    state.entries.push({ ...rowToAttempt({ ...row, id: tempId }), pending: true });
    saveCache();
    render();
    showToast('Записано ✓');
    flushOutbox().then(()=>{
      if(lsGet(outboxKey(), []).some(x=>x.tempId === tempId)){
        showToast(state.flushError ? ('Запись на телефоне, пока не отправилась: ' + state.flushError) : 'Нет сети — запись сохранена на телефоне и отправится позже');
      }
    });
    return;

  } else if(action === 'new-journal'){
    let entry = findTodayJournal();
    if(!entry){
      const entryDate = todayKey();
      entry = { entryDate, ts: new Date(entryDate + 'T12:00:00').getTime() };
      state.journalEntries.push(entry);
    }
    // Retired preset options from older entries are dropped when the entry is
    // opened for editing (a person typing the same word as their own variant
    // afterwards keeps it).
    JOURNAL_STEPS.filter(q=>q.type==='multi_other' && q.legacy).forEach(q=>{
      if(entry[q.id]) entry[q.id] = buildMulti(...(m=>[m.sel, m.others.filter(o=>!q.legacy.includes(o)), q.options])(parseMulti(entry[q.id], q.options)));
    });
    if(entry.questions){ // «Вопросы» объединены с «Откровениями»
      entry.reflections = [entry.reflections, entry.questions].filter(Boolean).join('\n\n');
      entry.questions = null;
    }
    state.journalDraft = entry;
    state.journalEditId = entry.entryDate;
    state.journalStepIndex = 0;
    state.multiOtherOpen = {};
    state.journalFormActive = true;
  } else if(action === 'view-old-journal'){
    const jid = parseInt(e.currentTarget.getAttribute('data-jid'),10);
    const existing = state.journalEntries.find(j=>j.ts === jid);
    if(!existing) return;
    state.journalReadEntry = existing;
    state.journalView = 'read';
  } else if(action === 'journal-read-back'){
    state.journalReadEntry = null;
    state.journalView = 'history';
  } else if(action === 'show-journal-history'){
    state.journalView = 'history';
  } else if(action === 'journal-history-back'){
    state.journalView = 'home';
  } else if(action === 'journal-prev-step'){
    commitPendingMulti();
    state.journalStepIndex = Math.max(0, state.journalStepIndex - 1);
  } else if(action === 'journal-next-step'){
    commitPendingMulti();
    state.journalStepIndex = Math.min(JOURNAL_STEPS.length - 1, state.journalStepIndex + 1);
  } else if(action === 'done-journal'){
    commitPendingMulti();
    clearTimeout(journalSaveTimer);
    const draft = state.journalDraft;
    state.journalFormActive = false;
    state.journalStepIndex = 0;
    state.journalView = 'home';
    render();
    if(draft && draft.entryDate){
      if(isJournalEntryEmpty(draft)){
        if(state.journalEditId) await deleteJournalEntry(draft.entryDate);
        else state.journalEntries = state.journalEntries.filter(j => j.entryDate !== draft.entryDate);

        await persistJournal();

  } else if(action === 'toggle-ft-desc'){
